original_text: "modernised-spelling transcription of the 1609 text (archive.org item comentarios-reales-de-los-incas-1609); the page numbers of that edition were suppressed, so there are no page markers. Chapters included: Book I, chs. XV, XVI, XVIII, XIX; Book II, chs. I, II, IV; Book III, chs. XX–XXIV; Book VI, chs. XX–XXIII (the Manco Cápac and Mama Ocllo origin story, the Sun as chief god above whom stands Pachacámac, the Temple of the Sun in the Coricancha, and the feast of Inti Raymi with the Inca’s toast to his father the Sun). Lines broken mid-sentence in the source were rejoined, and the heading line repeated at the head of each chapter was dropped. The numbered footnotes of the modern edition (seven, with no cue left in the text) were left out: they are the modern editor’s, not Garcilaso’s."
