<title>On the Meaning of History</title>

<style>
/* ── Design tokens ─────────────────────────────────────────────────────── */
:root {
  --bg:         #ffffff;
  --bg-alt:     #f5f5f5;
  --text:       #1E2529;
  --text-muted: #6B7C78;
  --accent:     #3D7A70;
  --rule:       #B8C9C5;
  --fs:         15.5px;
  --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#141C1E; --bg-alt:#1A2426; --text:#DDE8E4; --text-muted:#7A9490;
    --accent:#5A9E93; --rule:#2E4240;
  }
}
:root[data-theme="light"] {
  --bg:#ffffff; --bg-alt:#f5f5f5; --text:#1E2529; --text-muted:#6B7C78;
  --accent:#3D7A70; --rule:#B8C9C5;
}
:root[data-theme="dark"] {
  --bg:#141C1E; --bg-alt:#1A2426; --text:#DDE8E4; --text-muted:#7A9490;
  --accent:#5A9E93; --rule:#2E4240;
}

/* ── Reset & base ───────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--serif); line-height: 1.72;
  padding: 0 0.5rem 5rem;
}

/* ── Masthead ───────────────────────────────────────────────────────────── */
.masthead {
  max-width: 820px; margin: 0 auto; padding: 3.5rem 0 0; text-align: center;
}
.main-title {
  font-family: var(--serif); font-size: clamp(1.35rem, 3vw, 1.9rem);
  font-weight: normal; font-style: italic; line-height: 1.3;
  color: var(--text); letter-spacing: 0.01em;
}
.wave-rule {
  display: block; width: 100%; max-width: 320px;
  margin: 1.6rem auto 1.8rem; overflow: visible;
}

/* ── Column header bar ─────────────────────────────────────────────────── */
.col-bar {
  max-width: 1180px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1fr;
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  padding: 0.45rem 0;
}
.col-label {
  font-family: var(--sans); font-size: 10.5px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted);
  padding: 0 1.5rem;
}
.col-label:last-child { text-align: right; }

/* ── Paragraph grid with single vertical divider ────────────────────────── */
/* The divider is one ::before pseudo-element on .paras running top-to-bottom,
   positioned at exactly 50% (the column boundary). No horizontal rules. */
.paras {
  max-width: 1180px; margin: 0 auto;
  position: relative;
}
.paras::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0; bottom: 0;
  width: 1px;
  background: var(--rule);
  pointer-events: none;
}
.row {
  display: grid; grid-template-columns: 1fr 1fr;
  padding: 0.85rem 0;
  align-items: start;
}
.row p {
  margin: 0; font-size: var(--fs); line-height: 1.74; hyphens: auto;
  padding: 0 1.5rem;
}
.row p:last-child { opacity: 0.88; }

/* ── Section dividers (short all-caps paragraphs) ───────────────────────── */
.section-div {
  display: grid; grid-template-columns: 1fr 1fr;
  margin-top: 2.4rem; position: relative;
}
.section-div .s-orig,
.section-div .s-trans {
  font-family: var(--sans); font-size: 10px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent);
  padding: 0.55rem 1.5rem; border-top: 1.5px solid var(--accent);
}

/* ── Page markers ───────────────────────────────────────────────────────── */
.page-row { max-width: 1180px; margin: 0 auto; text-align: center; padding: 0.35rem 0; }
.page-mark {
  color: var(--text-muted); font-size: 11px;
  font-family: var(--sans); font-style: normal;
}

/* ── Controls (font size + theme) ───────────────────────────────────────── */
.controls {
  position: fixed; top: 1rem; right: 1rem;
  display: flex; gap: 0.35rem; align-items: center; z-index: 100;
}
.ctrl-btn {
  background: var(--bg-alt); border: 1px solid var(--rule);
  color: var(--text-muted); border-radius: 4px;
  padding: 0.28rem 0.55rem; cursor: pointer;
  font-family: var(--sans); font-size: 11px; font-weight: 600;
  letter-spacing: 0.04em; transition: border-color 0.15s, color 0.15s;
  line-height: 1;
}
.ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
.theme-btn {
  background: var(--bg-alt); border: 1px solid var(--rule);
  color: var(--text-muted); border-radius: 4px;
  padding: 0.28rem 0.55rem; cursor: pointer;
  font-family: var(--sans); font-size: 11px; font-weight: 600;
  letter-spacing: 0.04em; transition: border-color 0.15s, color 0.15s;
  line-height: 1; margin-left: 0.15rem;
}
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Responsive ─────────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  .col-bar, .row, .section-div { grid-template-columns: 1fr; }
  .paras::before { display: none; }
  .row p:first-child {
    border-bottom: 1px solid var(--rule); padding-bottom: 0.6rem;
  }
  .row p:last-child { opacity: 1; padding-top: 0.6rem; }
  .col-bar { display: none; }
  .section-div .s-trans { border-top: none; padding-top: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<div class="controls">
  <button class="ctrl-btn" id="fontDown" aria-label="Decrease font size">A−</button>
  <button class="ctrl-btn" id="fontUp"   aria-label="Increase font size">A+</button>
  <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">dark</button>
</div>

<header class="masthead">
  <h1 class="main-title">On the Meaning of History</h1>
  <svg class="wave-rule" viewBox="0 0 320 16" fill="none"

      stroke="currentColor" stroke-width="1.2" stroke-opacity="0.28" fill="none"/>
  </svg>
</header>

<div class="col-bar">
  <span class="col-label">Español</span>
  <span class="col-label">English</span>
</div>

<div class="paras" id="paras"></div>

<script>
const DATA = [{"orig": "DEL SENTIDO DE LA HISTORIA", "trans": "ON THE MEANING OF HISTORY"}, {"orig": "Si prescindiendo de su acepción meramente sensorial, psicofísica, evocamos o pronunciamos la palabra sentido, podemos pensar en una de estas dos cosas: en el contenido de una expresión, como cuando decimos: el dolor es el sentido del llanto, o en la dirección o finalidad de un movimiento o de un proceso, como cuando hablamos de la dirección del tránsito o cuando afirmamos que el sentido de la educación es el perfeccionamiento espiritual. La primera acepción implica un concepto de intención semántica y se refiere a una calidad del sentido que le confiere una cierta permanencia, algo así como una cierta esencialidad ontológica en la propia variación de la vida histórica. La segunda, un concepto dinámico del sentido. Precisándolas un poco mejor estableceríamos lo siguiente: según la acepción semántica o significativa; el sentido es la unidad interna que se explicita en la exterioridad de la expresión; según la acepción segunda, dinámica, el sentido puede ser la simple dirección de un impulso o de una atracción física o psíquica, y puede ser también una forma final a cuya realización tienden los momentos, fases, etapas de la evolución. En todas sus formas el concepto dinámico supone movimiento, dirección y orientación.", "trans": "If, setting aside its merely sensory and psychophysical acceptation, we evoke or pronounce the word meaning, we may have in mind one of two things: the content of an expression, as when we say that pain is the meaning of weeping, or the direction or purpose of a movement or process, as when we speak of the direction of traffic or affirm that the meaning of education is spiritual perfection. The first acceptation implies a concept of semantic intention and refers to a quality of meaning that confers upon it a certain permanence — something akin to a certain ontological essentiality within the very variation of historical life. The second implies a dynamic concept of meaning. Sharpening the distinction somewhat, we might establish the following: according to the semantic or significative acceptation, meaning is the internal unity that explicates itself in the externality of expression; according to the second, dynamic acceptation, meaning may be the simple direction of an impulse or of a physical or psychic attraction, and it may also be a final form toward whose realization the moments, phases, and stages of evolution tend. In all its forms the dynamic concept presupposes movement, direction, and orientation."}, {"orig": "Como toda vida, la historia es expresión, expresión de lo humano, esto es, de una interioridad cuya última, cuya más honda palpitación es quizá la angustia o mejor, quizá, el asombro: esa ignorancia admirativa y creativa que ora se hipnotiza en las figuraciones arquetípicas del mito, ora se empeña en encontrar fórmulas precisas y abstractas para la confusa afluencia de las imágenes, para la obscura profundidad del alma; si ya no es que esta última palpitación de lo humano no esté constituida por el ansia devorante de placer o por el apetito de inmortalidad, o por el instinto de perseverar en el propio ser de que hablaba Spinoza. Quién sabe. \"Nadie puede llegar hasta el fondo del alma\" decía el gran Heráclito. Sea lo que sea de esa profundidad ella aparece en la expresión histórica, en la sinfónica profusión de sus formas; y son sus grandes semánticos: un Herder, un Goethe, un Spengler, quienes leen ese lenguaje, diríase musical y poético, y nos permiten participar en las que Klages llamaría las grandes olas de la vida del alma.", "trans": "Like all life, history is expression — the expression of the human, that is, of an interiority whose last and deepest pulsation is perhaps anguish, or better perhaps astonishment: that admirative and creative ignorance which now hypnotizes itself in the archetypal figurations of myth, now strives to find precise and abstract formulas for the confused influx of images, for the obscure depths of the soul; unless, indeed, this ultimate pulsation of the human consists in the devouring craving for pleasure, or in the appetite for immortality, or in the instinct to persevere in one's own being of which Spinoza spoke. Who can say? \"No one can reach to the bottom of the soul,\" said the great Heraclitus. Whatever may be said of that depth, it appears in historical expression, in the symphonic profusion of its forms; and its great semanticists — a Herder, a Goethe, a Spengler — are those who read that language, at once musical and poetic, and permit us to share in what Klages would call the great waves of the life of the soul."}, {"orig": "La vida es movilidad incoercible y la historia es vida. Atendido lo cual, cuando hablamos de sentido, según su aspecto semántico y le atribuimos una cierta fijeza en la propia variación, no intentamos tratarlo como definitivamente hecho y exento de toda ambigüedad y fecundidad. Quizá sólo en algunos signos meramente convencionales el sentido es fijo y rígido: el sentido del 2 es dos, el sentido del + es más. En las expresiones naturales en cambio, el sentido tiene siempre un coeficiente de ambigüedad y por ello un fondo no determinable de posibilidad. Las obras del genio poseen una inagotable profundidad de sentido. Piénsese si no en que ni los filósofos ni los críticos acaban de desentrañar el sentido psicológico y metafísico de algunas tragedias de Sófocles: Edipo Rey, Antígona. La formulación del sentido en la historia es en gran parte una obra del futuro. Y así, si en determinada perspectiva puede llamarse estática la significación interna y esencial de una obra, de un proceso o de una vida no es porque esas entidades constituyan productos inertes, sino porque en cada momento, la interpretación que pretende encontrar el sentido debe postularlo como algo permanente, excluyente de otro sentido y en fin, como algo que desde determinado punto de vista, debe ser concebido con abstracción de sus posibilidades de modificación en el tiempo. Toda interpretación es por esencia abstractiva y, en cuanto opuesta a otras posibles interpretaciones, polémica. Razón por la cual sólo cuando se termina una obra, cuando se cierra un ciclo, cuando termina una vida se libera, para la contemplación y acaso para la eternidad, la posibilidad del sentido.", "trans": "Life is uncoercible mobility, and history is life. Having noted this, when we speak of meaning in its semantic aspect and attribute to it a certain fixity within variation itself, we do not attempt to treat it as definitively fixed and exempt from all ambiguity and fecundity. Perhaps only in certain purely conventional signs is meaning fixed and rigid: the meaning of 2 is two, the meaning of + is plus. In natural expressions, on the other hand, meaning always carries a coefficient of ambiguity and therefore an indeterminable fund of possibility. The works of genius possess an inexhaustible depth of meaning. One need only reflect that neither philosophers nor critics have yet succeeded in fully disentangling the psychological and metaphysical meaning of certain tragedies of Sophocles — the Oedipus Rex, the Antigone. The formulation of meaning in history is in large part a work of the future. And so, if from a certain perspective the internal and essential signification of a work, a process, or a life may be called static, it is not because those entities constitute inert products, but because at each moment the interpretation that purports to find meaning must posit it as something permanent, exclusive of other meanings, and finally as something that, from a given standpoint, must be conceived in abstraction from its possibilities of modification in time. Every interpretation is by its very nature abstractive and, in so far as it is opposed to other possible interpretations, polemical. Hence it is only when a work is finished, when a cycle closes, when a life ends, that the possibility of meaning is liberated — for contemplation and perhaps for eternity."}, {"orig": "Recordemos una vez más el famoso verso de Mallarmé en el soneto sobre la tumba de Edgar Poe: Tel qu'en Lui-même enfin l'éternité le change.", "trans": "Let us recall once more the celebrated line of Mallarmé in the sonnet on the tomb of Edgar Poe: Tel qu'en Lui-même enfin l'éternité le change [Such as into Himself at last eternity changes him]."}, {"orig": "Según lo cual, en toda expresión histórica se darían por lo menos dos sentidos: un sentido que diríamos local y que está presente de modo explícito o tácito en el ánimo de quienes viven directamente esa experiencia, y otro sentido que la posteridad extrae del acontecer y que trasciende a la eternidad, pero no a la eternidad de la muerte, sino a aquella que misteriosamente alienta y promueve la vida. Un sentido de eternidad que ilumina retrospectivamente el propio ámbito histórico donde surgieron la situación, la personalidad o la obra significativa. Según la bella interpretación de Guido de Ruggiero hay dos Sócrates: un Sócrates histórico y un Sócrates eterno, fuera de la historia, inmune a las limitaciones de la mentalidad griega. El primero es el antecedente inmediato de Platón; se propone definir el objeto y con ello tiende a inmovilizarlo; el segundo, el eterno \"Ya no es el ateniense de la edad de Pericles, sino el símbolo de la actividad mental, personificación del espíritu vivo de la investigación científica\". Y en un aspecto diferente de la creatividad espiritual, tenemos el Quijote que, según parece, tan sólo fue para Cervantes y sus contemporáneos una sátira contra los libros de caballería y que para nosotros encierra un símbolo inmortal de excelsitud humana. Ejemplos que nos muestran claramente la diferencia entre el sentido inmediato estrictamente histórico y el sentido intemporal que se superpone al primero iluminándolo.", "trans": "According to this, every historical expression would yield at least two meanings: a meaning one might call local, which is present explicitly or tacitly in the minds of those who live the experience directly, and another meaning that posterity extracts from the event and that transcends into eternity — not, however, into the eternity of death, but into that which mysteriously animates and promotes life. A meaning of eternity that illuminates retrospectively the very historical domain in which the significant situation, personality, or work arose. According to the beautiful interpretation of Guido de Ruggiero, there are two Socrateses: a historical Socrates and an eternal Socrates, outside of history, immune to the limitations of the Greek mentality. The first is the immediate forerunner of Plato; he proposes to define the object and thereby tends to immobilize it; the second, the eternal one, \"is no longer the Athenian of the age of Pericles, but the symbol of mental activity, the personification of the living spirit of scientific inquiry.\" And in a different aspect of spiritual creativity we have the Quixote which, so it seems, was for Cervantes and his contemporaries nothing more than a satire against books of chivalry, but which for us enshrines an immortal symbol of human nobility. These are examples that show us clearly the difference between the immediate, strictly historical meaning and the timeless meaning that is superimposed upon the first, illuminating it."}, {"orig": "Como bien se comprende, un problema específico de la historiografía consiste en establecer el sentido histórico de los hechos que estudia; la significación de los sucesos, de las realizaciones materiales de las vidas humanas en \"su\" tiempo, a veces muy distinto y distante de nuestra actual estimativa. Sabemos que muchos objetos materiales considerados por nosotros como meras obras de arte no tuvieron en su origen destino estético sino mágico; sabemos que el teatro trágico de los Griegos, el cual es para nosotros un monumento esencialmente literario, constituía en su tiempo una institución de carácter religioso. Y así en general la tarea de la investigación histórica consiste en descubrir, el sentido de la vida en los tiempos pasados, sentido que, por principio, debe ser fijado según sus semejanzas y sus diferencias con nuestro modo de ser, pero acentuando su idiosincrasia, o sea lo que tuvo de irrepetible y único, como lo que estaba incluido en el devenir que es, justamente, lo histórico.", "trans": "As is well understood, a specific problem of historiography consists in establishing the historical meaning of the facts it studies: the signification of events, of the material realizations of human lives \"in their\" time — a time often very different from and distant from our current system of valuation. We know that many material objects which we regard as mere works of art had in their origin not an aesthetic but a magical purpose; we know that the tragic theatre of the Greeks, which for us is an essentially literary monument, constituted in its own time an institution of religious character. And so in general the task of historical inquiry consists in discovering the meaning of life in past times — a meaning which, as a matter of principle, must be determined according to its similarities and differences with our own mode of being, but with emphasis upon its idiosyncrasy, that is, upon what was unrepeatable and unique in it, as that which was included in the becoming that is, precisely, the historical."}, {"orig": "Ahora bien, por hipótesis, las entidades históricas son entes concretos, singularidades irreducibles unas a otras y rebeldes a los criterios abstractivos del conocimiento intemporal, ¿cómo es posible su comprensión histórica?. Nosotros, en cuanto seres históricos, tenemos nuestro propio sentimiento de la vida. Estamos por decirlo así confinados en el ámbito de ese sentimiento; y entonces se plantea el problema de saber de qué modo podemos transponer esos límites y penetrar en la profundidad del momento abolido. Para conocer lo otro internamente, se necesita salir de sí mismo, pero si el yo sale de sí mismo, el conocimiento de lo otro, mejor del otro, se pierde en la identificación. Y de esta suerte, o bien el pasado deja de ser histórico y entonces puede ser incorporado sin residuo en la actualidad de un conocimiento intemporal, o es histórico, es decir irrepetible, y entonces, por de pronto, parece sustraido a la captación del presente.", "trans": "Now, given that historical entities are, by hypothesis, concrete entities, singularities irreducible to one another and resistant to the abstractive criteria of timeless knowledge — how is their historical comprehension possible? We, as historical beings, have our own feeling of life. We are, so to speak, confined within the domain of that feeling; and there arises the problem of knowing in what manner we can transpose those limits and penetrate into the depth of the abolished moment. To know the other internally, one must go out from oneself; but if the self goes out from itself, knowledge of the other — or rather, of the other person — is lost in identification. And so, either the past ceases to be historical, and then it can be incorporated without remainder into the actuality of a timeless knowledge, or it is historical — that is, unrepeatable — and then, on the face of it, it seems withdrawn from the grasp of the present."}, {"orig": "Dejando para otra oportunidad el análisis detenido y el señalamiento de los alcances epistemológicos y ontológicos del problema del conocimiento histórico, sólo daremos ahora respecto de él las aclaraciones que siguen.", "trans": "Leaving for another occasion the careful analysis and the delineation of the epistemological and ontological implications of the problem of historical knowledge, we shall now offer only the following clarifications with respect to it."}, {"orig": "La aprehensión de sentido en toda exterioridad obedece a una propensión instintiva del ser humano. Y el acto de aprehensión es simultáneo, por lo general con el acto de percepción, sin perjuicio de rectificación posterior. Por lo cual puede afirmarse que no hay percepción de un acto humano sin una inmediata aprehensión de sentido. Según esto, en resumen, es legítimo hablar de una cognosis, de una fisiognómica y por consiguiente de una semántica universal como estructuras inherentes al modo de ser del hombre. El espectáculo del acontecer humano es una expresión, y el hombre que lo contempla le atribuye de modo inmediato, diríamos reflejo, un sentido. Inherentes a la esencia del ser humano, que exterioriza su interioridad y anhela descifrar todo lenguaje, existen pues el instinto interpretativo y la propensión captadora de significaciones; y esos intentos, por su origen y su intención, nos inducen a inferir su eficacia. \"El hombre es el ser de la expresión\" asienta con profundidad Eduardo Nicol. Por consiguiente es el ser que expresa y comprende. Mas ¿hasta qué punto y dentro de qué límites nuestro instinto semántico nos permite penetrar en la interioridad significativa de la expresión histórica?.", "trans": "The apprehension of meaning in all exteriority obeys an instinctive propensity of the human being. And the act of apprehension is simultaneous, in general, with the act of perception, without prejudice to subsequent rectification. From which it may be affirmed that there is no perception of a human act without an immediate apprehension of meaning. According to this, in sum, it is legitimate to speak of a cognosis, a physiognomics, and consequently a universal semantics as structures inherent in the mode of being of man. The spectacle of human happening is an expression, and the man who contemplates it attributes to it immediately — we might say reflexively — a meaning. Inherent in the essence of the human being, who exteriorizes his interiority and yearns to decipher every language, there exist, then, the interpretive instinct and the propensity to capture significations; and those impulses, by their origin and their intention, induce us to infer their efficacy. \"Man is the being of expression,\" Eduardo Nicol states with profundity. He is consequently the being that expresses and comprehends. But to what extent and within what limits does our semantic instinct allow us to penetrate the significative interiority of historical expression?"}, {"orig": "Saber si, en sentido absoluto, podemos realizar o vivir el pasado o su interioridad, tales como efectivamente fueron es una cuestión que en la generalidad de su enunciado puede tener una respuesta afirmativa, pero que en el detalle de sus posibilidades concretas sólo es susceptible de respuestas problemáticas. En todo caso creemos que en la experiencia de la participación intersubjetiva tenemos una profunda base psicológica y si queremos metafísica para afirmar esa posibilidad. La participación es la base de la vida social, la posibilidad anímica que permite a los hombres respirar una atmósfera común de emoción, de esperanza, de terror, de amor, etc. Por la participación —no necesariamente integral— se explican las relaciones subjetivas no sólo en el sentido de cooperación y de comunión cordial, sino aún de recíproca hostilidad, ya que, al fin y al cabo, los propios adversarios se combaten porque recíprocamente viven, digamos, en la comunidad de la cólera y del odio, porque viven dentro de los impulsos de agresión que mutuamente los amenazan y los ligan.", "trans": "To know whether, in an absolute sense, we can re-enact or relive the past or its interiority as it effectively was, is a question which in the generality of its formulation may receive an affirmative answer, but which in the detail of its concrete possibilities admits only of problematic replies. In any case we believe that in the experience of intersubjective participation we possess a profound psychological — and, if we wish, metaphysical — basis for affirming that possibility. Participation is the foundation of social life, the psychic possibility that allows men to breathe a common atmosphere of emotion, hope, terror, love, and so forth. Through participation — not necessarily complete — are explained subjective relations not only in the sense of cooperation and cordial communion, but even of mutual hostility, since in the last analysis even adversaries fight each other because they reciprocally live, let us say, in the community of wrath and hatred, because they live within the impulses of aggression that mutually threaten and bind them."}, {"orig": "Según todo lo cual, si podemos entender a nuestros contemporáneos podemos también, en principio, entender a los antiguos, sin que detenga el impulso de esa esperanza la idea de que el pasado es algo abolido, puesto que la misma apetencia de revivirlo parece certificarnos de su obscura vigencia. Las expresiones históricas son expresiones humanas, y, por consiguiente en términos generales, su mensaje es descifrable, aunque sin duda no en toda su significación. Y esto último no sólo a causa de la distancia en el tiempo histórico y de la posible deficiencia de información sino, y principalmente, a consecuencia de la insondable profundidad del alma. Refiriéndose a esta mutua relación anímica y espiritual entre los seres vivos y más esencialmente entre el yo y el tú, escribe Martín Buber: \"Vivimos nuestras vidas inscrutablemente incluidos en la fluyente vida del universo\".", "trans": "According to all of this, if we can understand our contemporaries we can also, in principle, understand the ancients, without having the impulse of that hope arrested by the idea that the past is something abolished, since the very appetite to relive it seems to certify its obscure vitality. Historical expressions are human expressions, and consequently, in general terms, their message is decipherable, though certainly not in its full signification. And this last caveat holds not only on account of the distance in historical time and of possible deficiency of information, but chiefly as a consequence of the unfathomable depth of the soul. Referring to this mutual psychic and spiritual relation among living beings, and more essentially between the I and the Thou, Martin Buber writes: \"We live our lives inscrutably included in the streaming life of the universe.\""}, {"orig": "Desde el punto de vista de la comunicación intermental el problema del sentido interior, anímico de la historia es un problema de relaciones humanas ampliamente consideradas. En el fondo se trata de saber lo que, a través de la historia el hombre dice al hombre. Por donde llegamos a pensar que el problema del pasado histórico, por lo menos en cuanto al contenido interior del alma humana se reduce al gran problema eterno del yo y del tú, llamando tú por extensión legítima a la totalidad de la vida espiritual y anímica que no es yo y con la cual nos pone en relación más o menos mediata o inmediata, la expresión. En este concepto, por ejemplo, las palabras enigmáticas con que Sócrates poco antes de beber la cicuta encarga a Critón un gallo a Asclepios, son expresiones del tú, como lo son en general todas las intuiciones y posibilidades que se revelan con variable evidencia en el aparecer humano, más claro en la historia. Las pirámides de Egipto, las fortalezas incaicas, los templos griegos, las catedrales, son otras tantas configuraciones que contienen mensajes de una alma, de un inmenso Tú el cual mantiene con el contemplador y descifrador las conocidas relaciones de alteridad y comunidad.", "trans": "From the standpoint of intermental communication, the problem of the inner, psychic meaning of history is a problem of human relations broadly considered. At bottom, what is at issue is knowing what, through history, man says to man. This brings us to think that the problem of the historical past — at least as concerns the inner content of the human soul — reduces to the great and eternal problem of the I and the Thou, calling Thou, by legitimate extension, the totality of spiritual and psychic life that is not I, and with which expression places us in more or less mediate or immediate relation. In this sense, for example, the enigmatic words with which Socrates, shortly before drinking the hemlock, bids Crito offer a cock to Asclepius, are expressions of the Thou, as are in general all the intuitions and possibilities that reveal themselves with variable evidence in human appearing, more legibly in history. The pyramids of Egypt, the Incan fortresses, the Greek temples, the cathedrals — all these are configurations that contain messages of a soul, of an immense Thou, which maintains with the contemplator and decipherer the well-known relations of otherness and community."}, {"orig": "Igual que el tú de la experiencia cotidiana diríamos, si no fuera porque ese tú del pasado histórico al que interrogamos con amorosa curiosidad, sin duda nos habla, hasta pensaríamos que nos responde, pero no nos puede oír.", "trans": "Just as the Thou of everyday experience we might say, were it not that this Thou of the historical past, whom we interrogate with loving curiosity, no doubt speaks to us — we might even think it answers us — yet cannot hear us."}, {"orig": "En suma, es evidente que siempre cabe la incertidumbre sobre el mundo interior de los otros. Pero es evidente también que junto a esa incertidumbre y quizá superándola existe una certeza de signo contrario: la de que es posible comprender dentro de ciertos límites las palabras, los gestos, los actos de los demás. Y esa certeza se integra con dos elementos indisolublemente unidos en el acto de comprensión: un elemento de exterioridad, la expresión comunicativa, sensible, y un impulso de simpatía universal que puede ser adivinatorio, que busca un sentido en toda expresión y que, a través de ella, suele penetrar en regiones muy hondas de la vida del alma. Gracias a esa expansión del alma, a esa simpatía universal por todo lo que fue podemos vivir el pasado como tal pasado en su verdadera historicidad. Pero aquí debemos aclarar y decir que esta reviviscencia se opera en una suerte de actualidad segunda, o sea en una actualidad en cuyo ámbito quien revive el pasado sabe que el objeto de su vivencia es ido; y por eso lo contempla en la lejanía de lo que por esencia, está irrevocablemente ausente. Por lo cual, con frase permanentemente paradójica podría decirse que el pasado comparece como ausente a la mirada y al juicio del presente.", "trans": "In sum, uncertainty about the inner world of others is always possible. But it is equally evident that alongside that uncertainty, and perhaps surpassing it, there exists a certainty of the opposite sign: the certainty that it is possible to comprehend, within certain limits, the words, gestures, and acts of others. And that certainty is composed of two elements insolubly united in the act of comprehension: an element of exteriority, the sensible communicative expression, and an impulse of universal sympathy — which may be divinatory — that seeks a meaning in every expression and, through it, customarily penetrates into very deep regions of the life of the soul. Thanks to that expansion of the soul, to that universal sympathy for all that was, we are able to live the past as past in its true historicity. But here we must clarify and say that this re-vivification operates in a sort of secondary actuality — that is, an actuality within whose domain whoever relives the past knows that the object of his living experience is gone; and therefore he contemplates it in the remoteness of what is, by its very essence, irrevocably absent. Hence, in permanently paradoxical phrase, it might be said that the past appears as absent before the gaze and judgment of the present."}, {"orig": "Toda persona individual, toda formación histórica: pueblo, cultura, etc., orienta su actividad según ciertos ideales o arquetipos no siempre claramente conscientes y que son como las formas finales invívitas en la vida espiritual y anímica. De suerte que el sentido de la vida se define, en el fondo por relación a esos arquetipos: religiosos, éticos, estéticos, etc. Formas de grandeza, de perfección o de exaltación individual o nacional. Formas, valores, normas. Así por ejemplo, la vocación de la alta espiritualidad griega consistía en acceder a la esfera de lo divino por mediación de Eros. Es una accesión anagógica, mística, estética o heroica que confiere a la posibilidad humana una dimensión de eternidad, más allá del tiempo.", "trans": "Every individual person, every historical formation — people, culture, and so forth — orients its activity according to certain ideals or archetypes that are not always clearly conscious and that are as it were the final forms innate in spiritual and psychic life. So that the meaning of life is defined, at bottom, by reference to those archetypes: religious, ethical, aesthetic, and others. Forms of greatness, of perfection, or of individual or national exaltation. Forms, values, norms. Thus, for example, the vocation of the highest Greek spirituality consisted in gaining access to the sphere of the divine through the mediation of Eros. It is an anagogical, mystical, aesthetic, or heroic ascent that confers upon human possibility a dimension of eternity beyond time."}, {"orig": "La idea arquetípica del romano es el orden. Es una vocación de fundación que supone dominio sobre el espacio y sobre el tiempo, es decir, imperio, y que reclama por lo tanto permanencia en el tiempo y no precisamente eternidad. Lo que dura mucho tiempo, incluso sin término en el tiempo, no es la eternidad, que no necesita de la duración para ser. Y así mismo mientras el griego tiene una vocación intemporal que se cumple en la realización de lo perfecto, el romano tiene una vocación temporal que se cumple en la permanencia y en la dominación; y por ello al paso que las figuras representativas del espíritu griego son sus artistas que plasman lo divino en formas imperecibles, y muy especialmente sus héroes trágicos, míticos o históricos, que consagran con el dolor y la muerte el sentido de eternidad de sus vidas; un Prometeo, una Antígona, un Sócrates; las figuras simbólicas del espíritu romano: orden, fundación, dominación, imperio, serían evidentemente, sus juristas, y en la esfera de la eminencia individual, César, Augusto, Catón El Censor.", "trans": "The archetypal idea of the Roman is order. It is a vocation of foundation that presupposes dominion over space and over time — that is to say, empire — and that therefore demands permanence in time, not eternity precisely. What endures for a long time, even without end in time, is not eternity, which requires no duration in order to be. And so, while the Greek has a timeless vocation that is fulfilled in the realization of the perfect, the Roman has a temporal vocation fulfilled in permanence and domination; and accordingly, whereas the representative figures of the Greek spirit are its artists, who shape the divine in imperishable forms, and especially its tragic heroes — mythical or historical — who consecrate with pain and death the eternal meaning of their lives (a Prometheus, an Antigone, a Socrates), the symbolic figures of the Roman spirit — order, foundation, domination, empire — would evidently be its jurists, and in the sphere of individual eminence, Caesar, Augustus, Cato the Censor."}, {"orig": "La consideración de lo arquetípico nos conduce a estudiar el sentido en su acepción dinámica, puesto que el arquetipo es al propio tiempo una constante en el devenir de la vida y un futuro que debe ser cumplido como acabamiento y perfección de la misma.", "trans": "The consideration of the archetypal leads us to study meaning in its dynamic acceptation, since the archetype is at once a constant in the becoming of life and a future that must be fulfilled as the completion and perfection of that same life."}, {"orig": "Toda formación histórica contiene algo que en ella se cumple y, hasta cierto punto, se fija; pero también se da en ella una transitoriedad que apunta hacia adelante; como la palabra que puede expresar una idea, una imagen, un sentimiento definido, pero que sólo alcanza su plenitud de significado al incorporarse en el sentido final de la frase o del discurso. La interpretación pone el énfasis ora en lo que las configuraciones históricas tienen de perfección lograda, en lo que tienen de acabado, y concluso, como frutos que cierran, expresándola, una evolución; ora en lo que esas configuraciones, sean las que fueren, tienen de transitoriedad, como fases, pasos o momentos de un movimiento. Pero esas posiciones interpretativas no se anulan y, dentro de una perspectiva más amplia, las mismas realizaciones pueden ser consideradas diría Goethe: como metas y, a la vez, como pasos.", "trans": "Every historical formation contains something that is fulfilled and, to a certain extent, fixed within it; but there is also in it a transitoriness that points forward — as the word can express a definite idea, image, or feeling, but attains its fullness of meaning only by being incorporated into the final sense of the sentence or the discourse. Interpretation places its emphasis now on what historical configurations possess of achieved perfection, of what is finished and concluded in them, like fruits that close, by expressing it, an evolution; now on what those configurations, whatever they may be, possess of transitoriness, as phases, steps, or moments of a movement. But these interpretive positions do not cancel each other out, and within a broader perspective the very realizations can be regarded — as Goethe would say — both as goals and as steps at one and the same time."}, {"orig": "En el incesante devenir histórico atribuimos sentido en la acepción dinámica del término, a los movimientos o procesos humanos según estas tres posibilidades: llamamos sentido a la dirección de un movimiento o de un proceso que nos parece encaminarse no precisamente a un fin, sino más propiamente hacia un término, siguiendo una cierta dirección, orientándose según una línea definida; llamamos también sentido a la forma final de una evolución, forma que no siempre está conscientemente predeterminada, sino que actúa como una invencible fuerza de atracción que orienta, plasma, organiza los momentos, las fases del proceso según una intención configuradora; en fin existe un sentido programático que ordena los factores y las energías de que dispone la acción en vista de un resultado a obtener, de un logro a alcanzar.", "trans": "In the incessant historical becoming we attribute meaning, in the dynamic acceptation of the term, to human movements or processes according to three possibilities: we call meaning the direction of a movement or process that seems to us to be making its way not precisely toward an end, but rather toward a term, following a certain direction, orienting itself along a defined line; we also call meaning the final form of an evolution — a form not always consciously predetermined, but acting as an invincible force of attraction that orients, shapes, and organizes the moments and phases of the process according to a configuring intention; and finally there is a programmatic meaning that orders the factors and energies available to action with a view to a result to be obtained, an achievement to be reached."}, {"orig": "En todas estas modalidades del sentido la categoría dominante es la unidad que engloba los momentos o fases que se engendran y enlazan en una dirección o en el proceso que persigue un fin. Pero en esta movilidad cuyos momentos engloba la unidad que los organiza y dirige hay, como bien se comprende, algo más, algo que nos remite a las consideraciones expuestas a propósito de la acepción que llamaríamos estática del sentido, a saber: una significación trascendente que puede poseer los más altos quilates de la excelencia y que en sí misma es independiente de las contingencias de hecho de la frustración o del éxito.", "trans": "In all these modalities of meaning the dominant category is that of unity, which encompasses the moments or phases that are generated and linked in a direction or in the process that pursues an end. But in this mobility whose moments are encompassed by the unity that organizes and directs them there is, as is well understood, something more — something that refers us back to the considerations set forth with regard to what we might call the static acceptation of meaning, namely: a transcendent signification that may possess the highest degree of excellence and that is in itself independent of the contingent facts of frustration or success."}, {"orig": "Dentro de este orden de ideas, no creemos necesario referirnos por ahora desde un punto de vista estrictamente psicológico a las estructuras con sentido, por más que el conocimiento psicológico constituya la base fundamental de las teorías sobre el sentido en general: histórico y supra-histórico. En esta esfera Dilthey ha desarrollado las nociones fundamentales: estructura de la movilidad, unidad, finalidad, etc., y así, sin olvidar al gran filósofo, estudiaremos brevemente aunque en una perspectiva algo distinta de la suya, la calidad del sentido en sus aspectos axiológico y teleológico.", "trans": "Within this order of ideas, we do not think it necessary for the present to refer from a strictly psychological standpoint to the structures endowed with meaning, even though psychological knowledge constitutes the fundamental basis of theories of meaning in general — historical and supra-historical alike. In this sphere Dilthey has developed the fundamental notions — structure of mobility, unity, finality, and so forth — and thus, without forgetting the great philosopher, we shall study briefly, though in a perspective somewhat different from his, the quality of meaning in its axiological and teleological aspects."}, {"orig": "Según Spranger \"tiene sentido lo que está incorporado en un conjunto de valor como miembro constitutivo\", fórmula que, como se ve, pone la consideración axiológica como base de la noción del sentido; fórmula que consideramos en esencia válida, pero que debe ser aclarada y completada asentando que el valor no es necesariamente una entidad de tipo consciente ni mucho menos programático en los conjuntos dotados de sentido. Como ejemplo baste citar el proceso instintivo, en el cual los sujetos en quienes se desarrolla, ignoran por modo absoluto la finalidad y, en consecuencia, el valor de sus actos.", "trans": "According to Spranger, \"that has meaning which is incorporated into a whole of value as a constitutive member\" — a formula that, as can be seen, places axiological consideration as the basis of the notion of meaning; a formula we regard as essentially valid, but which must be clarified and completed by establishing that value is not necessarily an entity of a conscious type, still less a programmatic one, within wholes endowed with meaning. As an example it suffices to cite the instinctive process, in which the subjects in whom it unfolds are in complete ignorance of the purpose, and consequently of the value, of their acts."}, {"orig": "Existe pues en concepto de Spranger una teleología trascendente que nos ayuda a comprender estas dos grandes esferas de estructuras: la biológica y la histórico-espiritual. El juego que para el niño es un mero estímulo de placer, puede ser interpretado dentro de una concepción de sentido, como una preparación para la vida. En cuanto a los complejos histórico-espirituales: culturas, corrientes sociales, políticas, religiosas, etc., es sabido que el individuo participa en ellas sin tener una clara conciencia del significado de su participación ni del conjunto espiritual al que se incorpora. Puede imaginarse que obedece a un impulso absolutamente original y obedecer en realidad a una objetividad espiritual que lo trasciende. Según lo cual existiría una dependencia intrínseca del espíritu subjetivo por relación al espíritu objetivo.", "trans": "There exists, then, in Spranger's view a transcendent teleology that helps us to comprehend these two great spheres of structures: the biological and the historical-spiritual. The play that for the child is a mere stimulus of pleasure may be interpreted, within a conception of meaning, as a preparation for life. As for the historical-spiritual complexes — cultures, social, political, and religious currents, and so forth — it is well known that the individual participates in them without having a clear consciousness of the significance of his participation or of the spiritual whole into which he is incorporated. He may imagine himself obeying an absolutely original impulse and in reality be obeying a spiritual objectivity that transcends him. According to this, there would exist an intrinsic dependence of the subjective spirit in relation to the objective spirit."}, {"orig": "Algunos hablan de una teleología racional (Max Weber); pero ella es de toda evidencia insuficiente para permitir la comprensión de la realidad humana en su actuación histórica. Dos hechos impiden la vigencia irrestricta de una teleología racional, y son la subconsciencia que implica la existencia en la psique individual de factores ignorados que influyen en la conducta y condicionan las vivencias, y la existencia del espíritu objetivo que sólo es vivido y representado, pero que es anterior a la mente individual y representa para cada cual un nexo previamente dado de condiciones vitales y de factores directivos. En el fondo el espíritu objetivo sería la cultura, como mundo supraindividual de valores y de normas (religión, ética, derecho, arte, tradición, etc.), en el cual se incorpora el individuo y cuyas formas de pensamiento y de conducta confieren un sentido espiritual e histórico a los actos humanos.", "trans": "Some speak of a rational teleology (Max Weber); but it is patently insufficient to permit comprehension of human reality in its historical action. Two facts impede the unrestricted validity of a rational teleology: the subconscious, which implies the existence in the individual psyche of unknown factors that influence conduct and condition lived experience; and the existence of the objective spirit, which is only lived and represented, but which antedates the individual mind and represents for each person a previously given nexus of vital conditions and directive factors. At bottom, the objective spirit would be culture, as the supra-individual world of values and norms — religion, ethics, law, art, tradition, and so forth — into which the individual is incorporated and whose forms of thought and conduct confer a spiritual and historical meaning upon human acts."}, {"orig": "Hasta aquí la referencia a Spranger quien en la obra citada y en clara síntesis, nos muestra la estructura del sentido en la acepción que llamamos dinámica y además orienta nuestra contemplación histórica según un criterio de totalidad y de integración, es decir según un criterio que interprete el acontecer humano, y en él la acción individual, en conexión con las objetivaciones espirituales que en su conjunto y en su recíproca irradiación constituyen la cultura.", "trans": "So much for the reference to Spranger, who in the work cited, and in clear synthesis, shows us the structure of meaning in what we call the dynamic acceptation and moreover orients our historical contemplation according to a criterion of totality and integration — that is, according to a criterion that interprets human happening, and within it individual action, in connection with the spiritual objectifications that in their totality and in their mutual irradiation constitute culture."}, {"orig": "Y pasando ahora a lo concreto presentamos algunos ejemplos sencillos relativos al sentido dinámico. El ejemplo es lo concreto, típico y así los que ahora ofrecemos nos ayudarán a aclarar nuestra noción sobre este aspecto del sentido y quizá nos susciten inferencias útiles para la comprensión del sentido en general, es decir tanto en el aspecto dinámico como en el significativo o semántico.", "trans": "And passing now to the concrete, we present a few simple examples relating to dynamic meaning. The example is the concrete and typical, and so the examples we now offer will help us clarify our notion of this aspect of meaning and will perhaps suggest inferences useful for the comprehension of meaning in general — that is, both in its dynamic aspect and in its significative or semantic aspect."}, {"orig": "Un ejemplo claro de sentido como dirección, como aproximación a un término, o mejor como orientación según orden, lo encontramos en las variaciones fonéticas y semánticas de las palabras en el curso de la historia. Esas variaciones obedecen a leyes que estudian los lingüistas, que expresan tendencias más o menos definidas y constantes. Para concretarnos al sentido de una evolución fonética, nos bastará referirnos al paso del sonido a i al sonido e. Este tránsito que Menéndez Pidal estudia en forma admirable de claridad y de ciencia, se produciría a través de varias vicisitudes, \"de una compleja serie de episodios\", reveladores en su propia diversidad de una tendencia general; diríamos nosotros: de un sentido. Se diría que existen fuerzas intencionales que impulsan o, si se prefiere, que atraen en direcciones definidas las modificaciones del lenguaje.", "trans": "A clear example of meaning as direction, as approximation to a term — or better, as orientation according to order — is to be found in the phonetic and semantic variations of words in the course of history. These variations obey laws studied by linguists, laws that express more or less defined and constant tendencies. To confine ourselves to the meaning of a phonetic evolution, it will suffice to refer to the passage from the sound ai to the sound e. This transition, which Menéndez Pidal studies with admirable clarity and scholarship, would have come about through several vicissitudes — \"through a complex series of episodes\" — revealing in their very diversity a general tendency; we would say: a meaning. It is as though there exist intentional forces that impel, or if one prefers, that attract in definite directions the modifications of language."}, {"orig": "Numerosas indicaciones de historiadores y lingüistas nos permiten afirmar un sentido de espiritualización semántica de las palabras. Leemos en Mommsen que la palabra latina aes: bronce, engendra la palabra estimación. Y Menéndez Pidal, en ilustrativa coincidencia sobre el origen etimológico, nos describe la aventura semántica de la voz latina aeris: tributo, que vino a derivar en la determinación cronológica era.", "trans": "Numerous indications from historians and linguists allow us to affirm a meaning of semantic spiritualization in words. We read in Mommsen that the Latin word aes [bronze] generates the word for estimation. And Menéndez Pidal, in instructive coincidence regarding etymological origin, describes for us the semantic adventure of the Latin voice aeris [tribute], which came to derive into the chronological term era."}, {"orig": "En otra perspectiva de las objetividades espirituales, la historia del derecho romano nos muestra claramente el sentido de su evolución que va desde el primitivo materialismo simbólico hacia un ordenamiento jurídico que aspira a aproximarse cada vez más al ideal de la justicia distributiva; siendo de advertir que esta meta no es propuesta programáticamente sino divisada con claridad progresiva en el curso del proceso. El ideal que ella implica está sin duda invívito en el ánimo de los reformadores, legistas y jueces, pero las transformaciones obedecen en gran parte a circunstancias contingentes.", "trans": "In another perspective of spiritual objectivities, the history of Roman law shows us clearly the meaning of its evolution, which moves from a primitive symbolic materialism toward a juridical ordering that aspires to approximate ever more closely the ideal of distributive justice — it being worth noting that this goal is not programmatically proposed but is descried with progressive clarity in the course of the process. The ideal it implies is no doubt innately alive in the minds of the reformers, jurists, and judges, but the transformations obey in large part contingent circumstances."}, {"orig": "Nunca terminaríamos si quisieramos dar ejemplos del sentido programático en la vida moderna: planes y programas de educación, planes y programas sociales, políticos, económicos, etc. Programatismo que tiene un aspecto positivo: el optimismo, la fé en la eficacia del esfuerzo ejercitado con previsión y método, y un aspecto negativo y nefasto: la tendencia a la hipertrofia de la reglamentación, el prurito totalitario que para alcanzar tal o cual fin (social, político, pedagógico) dogmáticamente consagrado, somete la espontaneidad natural de la vida al imperio tiránico del fanatismo tecnificado.", "trans": "We should never finish if we wished to give examples of programmatic meaning in modern life: plans and programs of education, social, political, and economic plans and programs, and so forth. A programmatism that has a positive aspect — optimism, faith in the efficacy of effort exercised with foresight and method — and a negative and baneful aspect: the tendency toward hypertrophy of regulation, the totalitarian compulsion that, in order to achieve some dogmatically consecrated end (social, political, pedagogical), subjects the natural spontaneity of life to the tyrannical empire of technified fanaticism."}, {"orig": "Ejemplos todos que nos hacen ver con evidencia la relación, o mejor la recíproca implicación de las dos acepciones del sentido: la semántica, significativa y en cierto modo estática del sentido y la teleológica o dinámica. En efecto la evolución semántica de las palabras revela una intención espiritualidora, la evolución del derecho romano revela un sentido arquetípico del orden, una cierta idea sobre lo justo, en fin la exageración programática de nuestros días es la expresión de una cierta idea del hombre concebido como centro de acción, la cual debe ser orientada y sobre todo disciplinada por el conocimiento científico.", "trans": "These are all examples that make clearly apparent the relation, or better the mutual implication, of the two acceptations of meaning: the semantic, significative, and in a certain sense static acceptation, and the teleological or dynamic one. For indeed, the semantic evolution of words reveals a spiritualizing intention; the evolution of Roman law reveals an archetypal meaning of order, a certain idea of justice; and finally the programmatic exaggeration of our day is the expression of a certain idea of man conceived as a center of action, an action that must be oriented and above all disciplined by scientific knowledge."}, {"orig": "Hasta aquí hemos tratado de determinar los caracteres formales del sentido como significación, dirección y finalidad. El problema de captar o de inferir el sentido concreto, digamos material, de los sucesos, de los mundos históricos o de la historia en su totalidad, es del resorte de la historiografía o de la filosofía de la historia tal como la profesan un San Agustín, un Herder, un Hegel, un Spengler, etc., y por lo tanto no corresponde al propósito central de estos estudios. Empero no queremos omitir ciertas consideraciones que nos sugiere inmediatamente la actualidad espiritual de nuestra civilización en cuanto a su sentido, ni tampoco algunas inferencias sobre lo que en términos generales podemos llamar sentido universal de la historia, como revelación y como vocación de la vida histórica.", "trans": "Thus far we have attempted to determine the formal characters of meaning as signification, direction, and finality. The problem of grasping or inferring the concrete — let us say material — meaning of events, of historical worlds, or of history in its totality, falls within the province of historiography or of the philosophy of history as practiced by a Saint Augustine, a Herder, a Hegel, a Spengler, and others, and therefore does not belong to the central purpose of these studies. Nevertheless we do not wish to omit certain considerations immediately suggested to us by the spiritual actuality of our civilization as regards its meaning, nor certain inferences concerning what in general terms we may call the universal meaning of history, as revelation and as vocation of historical life."}, {"orig": "La planificación, el prurito programático de nuestros días, imprimen un sentido teleológico a la actividad que esas tendencias disciplinan; pero esa teleología es distinta de la que se cumple por la espontaneidad creadora del devenir histórico. Esa planificación, ese programatismo se funda en una confianza cada vez más absoluta y dominadora en la eficacia todo poderosa de la técnica, entendida ésta como la aplicación rigurosa a la actividad práctica de los conocimientos científicos, principalmente los de las ciencias físicas y biológicas. Puede decirse que este programatismo, esta planificación no son sino expresiones de la técnica que tiende o trata de extender su acción a zonas de la realidad espiritual o anímica que parecían sustraidas por su naturaleza a un tratamiento rígido, mecánico, para obtener un rendimiento automático, rigurosamente predeterminado.", "trans": "Planning, the programmatic compulsion of our day, imprints a teleological meaning upon the activity that those tendencies discipline; but this teleology is distinct from that which fulfills itself through the creative spontaneity of historical becoming. This planning, this programmatism, is founded upon an ever more absolute and dominating confidence in the all-powerful efficacy of technique — understood as the rigorous application to practical activity of scientific knowledge, principally that of the physical and biological sciences. One might say that this programmatism, this planning, are nothing but expressions of the technique that tends or strives to extend its action into zones of spiritual and psychic reality which seemed by their very nature withdrawn from a rigid, mechanical treatment aimed at producing an automatic, rigorously predetermined yield."}, {"orig": "Que, utilizando por lo común los reflejos condicionados y mediante una publicidad exagerada, pretenden, con fines de política o de lucro, imponer a las masas un verdadero automatismo dirigido; técnicas de los tests mentales que pretenden determinar la capacidad personal para ciertas profesiones u oficios, etc., etc.: técnicas todas inspiradas en un concepto rígidamente determinista e impersonalista de la vida, y que en su conjunto y en su intención dominadora constituyen una forma de pensamiento y de acción a la que Jaspers critica muy justamente cuando escribe: \"La dirección de la técnica no puede ser encontrada en la técnica misma, sino que debe ser buscada en el ethos mismo. El hombre mismo debe encontrar el camino para esa dirección, debe examinar sus necesidades, ponerlas en claro, comprobarlas y determinar su jerarquía\", y principalmente cuando asienta: \"La técnica por sí misma no está ligada a ningún supuesto cultural y por esa razón es en sí misma, algo falto de expresión, impersonal, inhumano\".", "trans": "These techniques, generally using conditioned reflexes and through exaggerated publicity, pretend — for purposes of politics or profit — to impose upon the masses a genuine directed automatism; techniques of mental tests that purport to determine personal capacity for certain professions or trades, and so forth — all techniques inspired by a rigidly deterministic and impersonalist conception of life, and which in their totality and in their dominating intention constitute a form of thought and action that Jaspers justly criticizes when he writes: \"The direction of technique cannot be found in technique itself, but must be sought in the ethos itself. Man himself must find the way for that direction, must examine his needs, bring them to light, verify them, and determine their hierarchy\" — and especially when he states: \"Technique by itself is not bound to any cultural premise and for that reason is in itself something devoid of expression, impersonal, inhuman.\""}, {"orig": "Esta proliferación de las técnicas se funda en el inmenso prestigio de la ciencia en general y entendida para este efecto como un conocimiento exacto y en principio verificable de lo real: se funda principalmente en el auge de las ciencias físicas, entre ellas la física nuclear con sus admirables realizaciones dirigidas por desgracia más hacia fines de exterminio que hacia fines de utilidad pacífica. A este respecto refiriéndose a la guerra total en su relación con la ciencia escribía Bergson: \"Nos batimos con las armas forjadas por nuestra civilización, y las masacres son de un horror que los antiguos no habrían ni siquiera imaginado. Según va la ciencia, se acerca el día en que uno de los adversarios, poseedor de un secreto que guardaba en reserva, tendrá el medio de suprimir al otro. No quedará quizá ni huella del vencido sobre la tierra\".", "trans": "This proliferation of techniques is founded upon the immense prestige of science in general — understood in this context as an exact and in principle verifiable knowledge of the real — and principally upon the ascendancy of the physical sciences, among them nuclear physics with its admirable achievements directed, unfortunately, more toward ends of extermination than toward ends of peaceful utility. In this regard, referring to total war in its relation to science, Bergson wrote: \"We fight with arms forged by our civilization, and the massacres are of a horror that the ancients would not even have imagined. As science progresses, the day approaches when one of the adversaries, possessing a secret held in reserve, will have the means of suppressing the other. Perhaps not a trace of the vanquished will remain upon the earth.\""}, {"orig": "De todos modos la ciencia alcanza en el ámbito espiritual del presente un predominio, un prestigio tal que tiende a constituirse en un verdadero ente dominador cuyo imperio es admitido de modo incondicional, más allá de toda crítica y por encima de otras posibilidades de conocimiento y de interpretación. La ciencia de vocación matemática y física desplaza la vieja sabiduría fundada en la experiencia vivida y pretende así promulgar como si se tratara de proposiciones de la mecánica o de la astronomía, las leyes del alma. Por lo cual creemos que si se quiere salvar el verdadero humanismo debe, a toda costa, mantenerse una instancia espiritual por encima de la mera ciencia, una instancia axiológica que, sin contrariar su desarrollo como tratamiento meramente explicativo o taxonómico de los hechos, reivindique la autonomía de las esferas espirituales que son las esferas de la libertad y del sentido.", "trans": "In any event, science attains in the spiritual domain of the present a predominance, a prestige such that it tends to constitute itself into a true dominating entity whose empire is admitted unconditionally, beyond all criticism and above all other possibilities of knowledge and interpretation. Science of mathematical and physical vocation displaces the old wisdom grounded in lived experience and pretends to promulgate — as though they were propositions of mechanics or astronomy — the laws of the soul. For this reason we believe that if true humanism is to be preserved, a spiritual instance above mere science must at all costs be maintained: an axiological instance that, without opposing science's development as a purely explanatory or taxonomic treatment of facts, reclaims the autonomy of the spiritual spheres, which are the spheres of freedom and of meaning."}, {"orig": "Pero he aquí, que ante el imperio creciente de la técnica, se presenta un problema: ¿Quiere decir que el sentido de nuestra era histórica y en suma de toda la historia humana consiste en la sumisión final de la humanidad a la técnica?. O dicho en términos más explícitos: ¿Llegará en un futuro más o menos próximo un momento en que el hombre, creyéndose en posesión de un conocimiento total reductible a principios abstractos, someterá a reglas, métodos y procedimientos derivados de esos principios la conducta y más aún, la vida interior de los seres humanos sin restricción ninguna?. Creemos poder contestar negativamente, y nos fundamos en las siguientes consideraciones:", "trans": "But here, confronted with the growing empire of technique, a problem presents itself: does this mean that the meaning of our historical era, and in sum of all human history, consists in the final submission of humanity to technique? Or stated in more explicit terms: will there come a moment — in a more or less near future — when man, believing himself in possession of a total knowledge reducible to abstract principles, will subject to rules, methods, and procedures derived from those principles the conduct and, further still, the inner life of human beings without any restriction whatsoever? We believe we can answer in the negative, and we ground that answer in the following considerations:"}, {"orig": "1) Dadas la insondabilidad del alma y la infinita complejidad de las cuestiones que plantea la realidad psicofísica del hombre, es imposible que ese alcance un conocimiento de tal extensión y profundidad que le permita controlar en forma que llamaremos totalitaria, las reacciones y posibilidades humanas; 2) La insondabilidad de lo humano no solamente es actual, sino que implica un infinito de posibilidades, una futuridad imprevisible, que hace de todo punto irrealizable calcular en forma precisa la conducta de los hombres, principalmente cuando se trata de formas o de actos complejos y elevados de la vida espiritual.", "trans": "1) Given the unfathomability of the soul and the infinite complexity of the questions raised by the psychophysical reality of man, it is impossible for him to attain a knowledge of such extension and depth as would allow him to control in what we shall call a totalitarian manner the reactions and possibilities of humanity; 2) The unfathomability of the human is not merely actual, but implies an infinity of possibilities, an unforeseeable futurity, that makes it altogether impossible to calculate with precision the conduct of men, above all when it concerns complex and elevated forms or acts of the spiritual life."}, {"orig": "Este carácter inexhaustible, inabarcable de lo humano no debe entenderse pues como un mero modo de ser actual, como extensión y profundidad. El ser humano es infinito también desde un punto de vista dinámico, y esto a causa de la negatividad dialéctica conjugada con la creatividad positiva que le es inherente y que le impide congelarse o configurarse en forma definitiva y susceptible de un conocimiento cabal, absoluto.", "trans": "This inexhaustible, uncontainable character of the human must not be understood, then, as a mere mode of actual being, as extension and depth. The human being is infinite also from a dynamic standpoint, and this by reason of the dialectical negativity conjugated with the positive creativity inherent in him, which prevents him from freezing or configuring himself in any definitive and fully knowable form."}, {"orig": "Al par que la tecnificación y actuando en íntima relación con ella, la socialización aparece como la posibilidad dominante en este momento histórico; vasto fenómeno, cuyas expresiones más acusadas son el socialismo como concepción económica y política y la creciente influencia de las masas como conjuntos humanos que absorben o dominan en forma que se diría absoluta las particularidades individuales. El socialismo contiene importantes elementos de sensibilidad humana, de aspiración a la justicia y de tradición cristiana, pero es evidente que en sus formas extremas tiende hacia una organización totalitaria de la vida y que una de ellas, el marxismo, implica una verdadera escatología que prenuncia el fin de la historia. En la actual situación de las corrientes sociales y políticas el problema del socialismo no marxista —ya que el marxismo ha eliminado ese problema sin resolverlo— consiste en decidir hasta qué punto se concilian o se conjugan sus postulados económicos y jurídicos con los valores de la individualidad como centro irremplazable de actividad espiritual, valores que, en consecuencia, no deben ser ni olvidados ni preteridos.", "trans": "Alongside technification, and acting in intimate relation with it, socialization appears as the dominant possibility in this historical moment — a vast phenomenon whose most pronounced expressions are socialism as an economic and political conception, and the growing influence of the masses as human aggregates that absorb or dominate in what might be called an absolute manner the individual particularities. Socialism contains important elements of human sensibility, of aspiration toward justice, and of Christian tradition, but it is evident that in its extreme forms it tends toward a totalitarian organization of life, and that one of them, Marxism, implies a genuine eschatology that heralds the end of history. In the present situation of social and political currents, the problem of non-Marxist socialism — since Marxism has eliminated that problem without resolving it — consists in deciding to what extent its economic and juridical postulates are conciliated or conjoined with the values of individuality as an irreplaceable center of spiritual activity — values which, accordingly, must be neither forgotten nor passed over."}, {"orig": "En cuanto a la masa o a las masas cuya \"rebelión\" ha denunciado Ortega y Gasset en un libro notable, es evidente que aunque su acción e influencia constituyen un factor importante en el presente histórico, ellas no serán decisivas ya que la masa contemporánea, al contrario de las comunidades arcaicas a las cuales se la asimila erróneamente, más que un brote espontáneo del alma popular, es una formación creada en gran parte por obra de la ideología y de la técnica; de suerte que en el fondo la masa obedece, por lo general sin saberlo, a decisiones que la trascienden.", "trans": "As for the mass or masses whose \"rebellion\" Ortega y Gasset has denounced in a notable book, it is evident that although their action and influence constitute an important factor in the historical present, they will not prove decisive, since the contemporary mass, contrary to the archaic communities with which it is erroneously assimilated, is less a spontaneous effusion of the popular soul than a formation created in large part by ideology and technique; so that at bottom the mass obeys, generally without knowing it, decisions that transcend it."}, {"orig": "Con referencia al papel esencial del individuo en la evolución general de la vida y naturalmente en la evolución de la historia y del espíritu; papel, función del individuo como factor, fermento y núcleo de irradiación que no puede ser aniquilado sin provocar la propia aniquilación de la misma sociedad como sujeto histórico, escribe Lecomte de Nouy: \"La evolución progresiva se produce siempre a través de los individuos y gracias a ellos, como una melodía que se desprende de las notas aisladas que se borrara en el silencio mientras que solamente permanece el recuerdo. Hablando propiamente, es el individuo efímero quien constituye el elemento primordial de la evolución biológica del mismo modo que será más tarde el individuo psicológico quien constituirá el elemento esencial de la evolución del espíritu. Hasta prueba en contrario se puede decir que la evolución natural busca o trata de evadirse del imperio estadístico que dominaba en el universo inorgánico, y prepara la vida al advenimiento de la libertad humana\".", "trans": "With reference to the essential role of the individual in the general evolution of life, and naturally in the evolution of history and of the spirit — the role and function of the individual as a factor, ferment, and nucleus of irradiation that cannot be annihilated without provoking the annihilation of society itself as historical subject — Lecomte de Noüy writes: \"Progressive evolution always takes place through individuals and thanks to them, like a melody that arises from isolated notes that would fade into silence while only the memory remains. Properly speaking, it is the ephemeral individual who constitutes the primordial element of biological evolution in the same way as it will be later the psychological individual who will constitute the essential element of the evolution of the spirit. Until proof to the contrary, one may say that natural evolution seeks or tries to escape from the statistical empire that dominated the inorganic universe, and prepares life for the advent of human freedom.\""}, {"orig": "Cabe pues afirmar que ni las totalidades cerradas a las que tienden ciertos movimientos contemporáneos, ni la creciente importancia de la masa corresponden a la verdadera vocación histórica de la vida humana, fundada, naturalmente, en la índole radical del ser del hombre. En efecto, por una propensión natural de su ser, el hombre prefiere la libertad al orden y la inseguridad henchida de posibilidad y de riesgo a un tipo de vida que excluya, por modo absoluto, al par que el azar y la aventura, las condiciones de un verdadero destino personal. Por cuya razón es legítimo inferir que los estados de intención o de constitución totalitaria y las formaciones de naturaleza impersonal, sólo representan momentos transitorios y no logros definitivos del devenir histórico.", "trans": "It may therefore be affirmed that neither the closed totalities toward which certain contemporary movements tend, nor the growing importance of the mass, correspond to the true historical vocation of human life — a vocation grounded, naturally, in the radical character of man's being. In fact, by a natural propensity of his being, man prefers freedom to order and insecurity filled with possibility and risk to a type of life that would exclude, in absolute fashion, along with chance and adventure, the conditions for a genuine personal destiny. For which reason it is legitimate to infer that states of totalitarian intention or constitution, and formations of an impersonal nature, represent only transitory moments and not definitive achievements of historical becoming."}, {"orig": "Llegados a este punto debemos preguntarnos: ¿Cuál es el significado del devenir histórico y hacia dónde va?. Quizá el objeto intencional de esta pregunta se esclarezca si nos referimos a la enumeración que hace Jaspers de las posibilidades de atribución de una meta a la historia, sobre la base de considerar el sentido como la unidad que confiere significación a lo que sin ella no sería sino diversidad y dispersión.", "trans": "Having reached this point, we must ask ourselves: what is the meaning of historical becoming and where is it going? Perhaps the intentional object of this question will be clarified if we refer to the enumeration that Jaspers makes of the possibilities of attributing a goal to history, on the basis of considering meaning as the unity that confers signification upon what without it would be nothing but diversity and dispersion."}, {"orig": "Y estas posibilidades serían las siguientes: 1) Se considera como sentido de la historia la civilización y la humanización del hombre; 2) Se considera como meta de la historia la libertad y la conciencia de libertad; 3) Se entiende como meta de la historia el tipo superior del hombre, la creación de la cultura y del espíritu, la producción de la cultura en estados colectivos, el genio; 4) La revelación del ser en el hombre, la revelación de la Divinidad.", "trans": "And these possibilities would be the following: 1) The civilization and humanization of man is considered as the meaning of history; 2) Freedom and the consciousness of freedom is considered as the goal of history; 3) The superior type of man, the creation of culture and of the spirit, the production of culture in collective states, genius, is understood as the goal of history; 4) The revelation of being in man, the revelation of the Divinity."}, {"orig": "Jaspers considera estas posibilidades como irreductibles entre sí. Empero creemos que ellas pueden reducirse a dos: El sentido como ser y el sentido como libertad. Ser y libertad, dos entidades que, en realidad, pueden confundirse o mejor fundirse la una en la otra, ya que el ser es aquello que se manifiesta y expresa en el devenir de la aparición histórica y la libertad es este mismo ser en cuanto inexhaustible creatividad, infinitud. Equivalencia que Novalis enunciaba en ecuación iluminadora: \"Ser es en suma ser libre\". \"Alles Sein, Sein überhaupt ist nichts als Freisein\".", "trans": "Jaspers regards these possibilities as irreducible to one another. We believe, however, that they can be reduced to two: meaning as being and meaning as freedom. Being and freedom — two entities that in reality may be confused or better fused the one into the other, since being is that which manifests and expresses itself in the becoming of historical appearing, and freedom is this same being in so far as it is inexhaustible creativity, infinitude. An equivalence that Novalis stated in an illuminating equation: \"Being is in sum to be free\" [\"Alles Sein, Sein überhaupt ist nichts als Freisein\" — All being, being in general, is nothing but being free]."}, {"orig": "Sin olvidar la significación metafísica de la ecuación de Novalis, y fijándonos principalmente en el devenir histórico como incontenible movilidad e inagotable riqueza, estimamos que el verdadero sentido de la historia es la revelación y la realización de la libertad. Y ésta no es una mera inducción resultante de la empiria; es una condición inherente a la historicidad entendida como condición ontológica de la realidad humana. La historia, en cua
