nto aparición con sentido es al par que revelación y vocación de libertad, revelación y vocación de interioridad, de espontaneidad creadora. Lo cual nos ayuda a comprender en una sola realidad vital, las dos acepciones del sentido a que nos referimos en el comienzo de este estudio, ya que puede afirmarse que el sentido eterno de los movimientos y de las configuraciones históricas, se da en el propio sucederse de los momentos en que el fondo anímico y espiritual de la vida se revela y en cierto modo se enriquece y se crea.", "trans": "Without forgetting the metaphysical significance of Novalis's equation, and fixing our attention principally upon historical becoming as uncontainable mobility and inexhaustible richness, we consider that the true meaning of history is the revelation and realization of freedom. And this is not a mere induction resulting from empiria; it is a condition inherent in historicity understood as the ontological condition of human reality. History, as appearing endowed with meaning, is at once revelation and vocation of freedom, revelation and vocation of interiority, of creative spontaneity. This helps us to comprehend in a single vital reality the two acceptations of meaning to which we referred at the beginning of this study, since it may be affirmed that the eternal meaning of historical movements and configurations is given in the very succession of moments in which the psychic and spiritual fund of life reveals itself and in a certain measure enriches and creates itself."}, {"orig": "Afirmar que la libertad es el sentido de la historia, es sin duda una respuesta legítima a la cuestión que la provoca. Pero en otra perspectiva deja el problema abierto el sentido dinámico de la historia porque si la libertad supone imprevisibilidad es evidente que su institución como sentido de la historia hace imposible la predeterminación del fin material, digamos más concretamente: de la configuración final económica, política o espiritual de la historia. En fin quizá esta indeterminación inherente a la libertad y en el fondo a la realidad humana, constituye el verdadero horizonte de esperanza de la vida histórica. Y así, repitiendo con una significación diferente la fórmula de Kant, diríamos que la finalidad y en el fondo el verdadero sentido dinámico de la historia es una \"finalidad\" sin fin: un perseguir eterno, algo que no se alcanza totalmente nunca.", "trans": "To affirm that freedom is the meaning of history is without doubt a legitimate response to the question that provokes it. But from another perspective it leaves open the problem of the dynamic meaning of history, because if freedom presupposes unpredictability it is evident that its institution as the meaning of history makes impossible the predetermination of the material end — let us say more concretely: of the final economic, political, or spiritual configuration of history. And perhaps this indetermination inherent in freedom, and at bottom in human reality, constitutes the true horizon of hope of historical life. And so, repeating with a different significance the formula of Kant, we might say that the finality, and at bottom the true dynamic meaning, of history is a \"finality\" without end [Zweckmäßigkeit ohne Zweck]: an eternal pursuit, something that is never fully attained."}, {"orig": "Pero aquí llegamos a una aparente paradoja, puesto que estamos formulando una conclusión inconclusa, en la cual, por lo demás, aludimos a la esencia infinita del ser que se revela en el devenir de la historia. Y por eso se nos ocurre asociar, a la vez por semejanza y por contraste, la música de la historia a la conocida obra inacabada de Franz Schubert, y decir que la sinfonía histórica es inconclusa, no porque sea trunca como la obra del músico alemán, sino porque en su ser está el no acabar, el no poder encerrarse jamás sobre si mismo como puro pasado.", "trans": "But here we arrive at an apparent paradox, since we are formulating an inconclusive conclusion — in which, moreover, we allude to the infinite essence of the being that reveals itself in the becoming of history. And for this reason it occurs to us to associate, simultaneously by resemblance and by contrast, the music of history with the well-known unfinished work of Franz Schubert, and to say that the historical symphony is unfinished — not because it is truncated like the work of the German musician, but because in its very being it is constituted by the impossibility of ending, of ever enclosing itself upon itself as pure past."}, {"orig": "En realidad el problema del sentido en la historia es el problema del sentido de la vida ampliamente considerada. ¿Qué expresa la vida?. ¿Hacia dónde va la vida?. Colocados en el interior mismo de la historia sólo podemos decir que en ella encontramos la expresión de nosotros mismos, aún en las manifestaciones del acontecer humano que a primera vista parecen extrañas a nuestra perspectiva personal. Y en eso se diferencia la historia de las ciencias de la naturaleza, las cuales sólo nos enseñan lo que es, empero no lo que significa el aparecer, es decir lo que en el aparecer se conecta con nuestra propia esencia anímica, o sea el sentido. La historia es así un lenguaje y, como tal supone estas dos cosas: alteridad y participación. Son otros los hombres, son otras las épocas, son otras las vivencias según los lugares y los tiempos. En su concreción, en su integridad indescomponible nada se repite, por lo cual hay así una tragedia inherente a la incontenible abolición de lo que adviene, luce y pasa. El \"fue\", lo \"sido\" derivan su estatus ontológico, precisamente, de que no son. Pero tienen aún una vigencia: o nos atraen hacia sí, o somos nosotros los que atraemos hacia la intimidad de nuestra contemplación reanimándolos con nuestra inquietud o con esa sed de resurgimiento espiritual que es la apetencia histórica. Y así participamos en lo pasado por virtud de la contemplación penetrada de amorosa curiosidad; participamos en su ser que no es. Y en esa participación que vive el pasado sin desvirtuarse ni anular su propia esencia —que es justamente ser pasado— consiste en definitiva la historicidad de la historia, el sentido de la vocación humana que la estudia y comprende.", "trans": "In reality the problem of meaning in history is the problem of the meaning of life broadly considered. What does life express? Where is life going? Situated in the very interior of history, we can only say that in it we find the expression of ourselves — even in the manifestations of human happening that at first sight seem alien to our personal perspective. And herein history differs from the natural sciences, which teach us only what is, but not what the appearing signifies — that is, what in the appearing is connected with our own psychic essence, or in other words, meaning. History is thus a language and, as such, presupposes two things: otherness and participation. Other are the men, other are the epochs, other the lived experiences according to times and places. In their concreteness, in their undecomposable integrality, nothing is repeated — whence there is a tragedy inherent in the uncontainable abolition of what comes into being, shines, and passes. The \"was,\" the \"having been,\" derives its ontological status precisely from the fact that it is not. But it retains still a vitality: either it attracts us toward itself, or it is we who draw it toward the intimacy of our contemplation, reanimating it with our restlessness or with that thirst for spiritual resurgence that is the historical appetite. And so we participate in the past by virtue of contemplation penetrated with loving curiosity; we participate in its being that is not. And in that participation — which lives the past without distorting it or annulling its own essence, which is precisely to be past — consists in the final analysis the historicity of history, the meaning of the human vocation that studies and comprehends it."}, {"orig": "Si prescindiendo de la psicología individual en que la existencia de estructuras con sentido es evidente, nos planteamos el problema del sentido en procesos o configuraciones extra o supra-individuales, cósmicas o históricas, nos encontramos inevitablemente con la siguiente alternativa: O la atribución del sentido a los procesos o configuraciones de la realidad cósmica o histórica es un acto meramente subjetivo del contemplador o intérprete. O los hechos, a lo menos algunos de ellos, tienen un sentido objetivo que el contemplador capta como algo existente \"en sí\".", "trans": "If, setting aside individual psychology, in which the existence of structures endowed with meaning is evident, we pose the problem of meaning in extra- or supra-individual, cosmic or historical processes or configurations, we inevitably encounter the following alternative: either the attribution of meaning to the processes or configurations of cosmic or historical reality is a purely subjective act of the contemplator or interpreter, or the facts — at least some of them — have an objective meaning that the contemplator grasps as something existing \"in itself.\""}, {"orig": "Si optamos por el primer extremo de este dilema, caemos en el puro subjetivismo; podemos llegar a un idealismo solipsista o a un agnosticismo radical que se abstenga de aspirar a un conocimiento verdaderamente interno y digamos ontológico del acontecer. Posiciones ambas que, en el hecho no se concilian con el empeño positivo del historiador que no se atribuye a sí mismo ninguna función inventiva, sino que meramente aspira a una visión auténtica del acontecer \"tal como es o como fue\".", "trans": "If we opt for the first horn of this dilemma, we fall into pure subjectivism; we may arrive at a solipsistic idealism or at a radical agnosticism that refrains from aspiring to a truly internal and, let us say, ontological knowledge of the happening. Both positions, which in fact are not reconcilable with the positive endeavor of the historian, who attributes to himself no inventive function whatsoever but merely aspires to an authentic vision of the happening \"as it is or as it was.\""}, {"orig": "Si optamos por el segundo extremo, nos será forzoso profesar un cierto espiritualismo o animismo en el fondo de las cosas, desde que sólo el espíritu o el alma encierran la posibilidad del sentido. De tal suerte, por ejemplo que cuando conferimos un sentido al cosmos, en realidad lo estamos incorporando en la historia del espíritu. Si, por ahora nos concretamos al mundo histórico super individual y le atribuimos sentido, tendremos que admitir en su más esencial realidad estructuras y fuerzas de la misma naturaleza, aún mas: idénticas a las que actúan en la economía del comportamiento individual, que desbordan, empero, el ámbito de la mera conciencia personal y que actúan con cierta autonomía como si en ella se depositara algo así como una voluntad histórica, como un \"sino\" que las grandes individualidades descubren, realizan, contrarían, o acaso, finalmente derogan, pero siempre dentro de la atmósfera envolvente de significaciones y posibilidades en que se nutre, incluso para la rebeldía, el espíritu individual.", "trans": "If we opt for the second horn, we shall be compelled to profess a certain spiritualism or animism at the base of things, since only the spirit or soul encloses the possibility of meaning. So that, for example, when we confer a meaning upon the cosmos, we are in reality incorporating it into the history of the spirit. If, for the present, we confine ourselves to the historical supra-individual world and attribute meaning to it, we shall have to admit in its most essential reality structures and forces of the same nature — indeed identical to those that operate in the economy of individual behavior — which nonetheless overflow the domain of mere personal consciousness and act with a certain autonomy, as though something like a historical will were deposited in them, like a \"fate\" that great individualities discover, fulfill, contravene, or perhaps ultimately abrogate, but always within the enveloping atmosphere of significations and possibilities in which the individual spirit nourishes itself — even in rebellion."}, {"orig": "Llamamos histórico al ente que reune estas dos condiciones: a) Estar sujeto al cambio; b) Que su cambio o mejor sus cambios constituyan en sí mismos y contengan por su conjunto una figura de significación, o de expresión.", "trans": "We call historical the entity that satisfies these two conditions: a) being subject to change; b) that its change — or better its changes — constitutes in itself, and contains in its totality, a figure of signification or of expression."}, {"orig": "Se diría que la vocación histórica persigue como su finalidad esencial, transponer a una especie de espacialidad panorámica la sucesión temporal de los hechos.", "trans": "One might say that the historical vocation pursues, as its essential finality, the transposition into a kind of panoramic spatiality of the temporal succession of facts."}];
const container = document.getElementById('paras');
const root = document.documentElement;

// ── Font size control ──────────────────────────────────────────────────────
let fontSize = 15.5;
function setFontSize(px) {
  fontSize = Math.max(11, Math.min(22, px));
  root.style.setProperty('--fs', fontSize + 'px');
}
document.getElementById('fontDown').addEventListener('click', () => setFontSize(fontSize - 1));
document.getElementById('fontUp').addEventListener('click',   () => setFontSize(fontSize + 1));

// ── Paragraph rendering ────────────────────────────────────────────────────
function isHeader(s) {
  return s.length < 80 && s === s.toUpperCase() && /[A-ZÁÉÍÓÚÑÜ]/.test(s);
}
function pageMark(num) {
  const span = document.createElement('span');
  span.className = 'page-mark';
  span.textContent = ' [' + num + '] ';
  return span;
}
function snapToWord(text, pos) {
  if (pos <= 0) return 0;
  if (pos >= text.length) return text.length;
  if (text[pos] === ' ') return pos;
  let lo = pos - 1, hi = pos + 1;
  while (lo > 0 && text[lo] !== ' ') lo--;
  while (hi < text.length && text[hi] !== ' ') hi++;
  return (pos - lo <= hi - pos) ? lo : hi;
}

DATA.forEach((d) => {
  if (isHeader(d.orig)) {
    const div = document.createElement('div');
    div.className = 'section-div';
    div.innerHTML =
      '<div class="s-orig">' + d.orig + '</div>' +
      '<div class="s-trans">' + d.trans + '</div>';
    container.appendChild(div);
    return;
  }

  const row = document.createElement('div');
  row.className = 'row';
  const orig  = document.createElement('p');
  const trans = document.createElement('p');

  if (d.page_mid) {
    const offset = d.mid_offset;
    const ratio = offset / d.orig.length;
    const tOff = snapToWord(d.trans, Math.round(d.trans.length * ratio));
    orig.append(d.orig.slice(0, offset),  pageMark(d.page_mid), d.orig.slice(offset));
    trans.append(d.trans.slice(0, tOff),  pageMark(d.page_mid), d.trans.slice(tOff));
  } else {
    orig.textContent  = d.orig;
    trans.textContent = d.trans;
  }

  row.appendChild(orig);
  row.appendChild(trans);
  container.appendChild(row);

  if (d.page_after) {
    const nums = Array.isArray(d.page_after) ? d.page_after : [d.page_after];
    nums.forEach((num) => {
      const marker = document.createElement('div');
      marker.className = 'page-row';
      marker.appendChild(pageMark(num));
      container.appendChild(marker);
    });
  }
});

// ── Theme toggle ───────────────────────────────────────────────────────────
const themeBtn = document.getElementById('themeBtn');
let dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme(isDark) {
  root.setAttribute('data-theme', isDark ? 'dark' : 'light');
  themeBtn.textContent = isDark ? 'light' : 'dark';
  themeBtn.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
}
applyTheme(dark);
themeBtn.addEventListener('click', () => { dark = !dark; applyTheme(dark); });
</script>
