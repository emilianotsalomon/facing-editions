<title>Homogeneity and Division</title>

<style>
/* ── Design tokens ─────────────────────────────────────────────────────── */
:root {
  --bg:         #ffffff;
  --bg-alt:     #f5f5f5;
  --text:       #1E2529;
  --text-muted: #6B7C78;
  --accent:     #3D7A70;
  --rule:       #B8C9C5;
  --fs:         15.5px;
  --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#141C1E; --bg-alt:#1A2426; --text:#DDE8E4; --text-muted:#7A9490;
    --accent:#5A9E93; --rule:#2E4240;
  }
}
:root[data-theme="light"] {
  --bg:#ffffff; --bg-alt:#f5f5f5; --text:#1E2529; --text-muted:#6B7C78;
  --accent:#3D7A70; --rule:#B8C9C5;
}
:root[data-theme="dark"] {
  --bg:#141C1E; --bg-alt:#1A2426; --text:#DDE8E4; --text-muted:#7A9490;
  --accent:#5A9E93; --rule:#2E4240;
}

/* ── Reset & base ───────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--serif); line-height: 1.72;
  padding: 0 0.5rem 5rem;
}

/* ── Masthead ───────────────────────────────────────────────────────────── */
.masthead {
  max-width: 820px; margin: 0 auto; padding: 3.5rem 0 0; text-align: center;
}
.main-title {
  font-family: var(--serif); font-size: clamp(1.35rem, 3vw, 1.9rem);
  font-weight: normal; font-style: italic; line-height: 1.3;
  color: var(--text); letter-spacing: 0.01em;
}
.wave-rule {
  display: block; width: 100%; max-width: 320px;
  margin: 1.6rem auto 1.8rem; overflow: visible;
}

/* ── Column header bar ─────────────────────────────────────────────────── */
.col-bar {
  max-width: 1180px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1fr;
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  padding: 0.45rem 0;
}
.col-label {
  font-family: var(--sans); font-size: 10.5px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted);
  padding: 0 1.5rem;
}
.col-label:last-child { text-align: right; }

/* ── Paragraph grid with single vertical divider ────────────────────────── */
/* The divider is one ::before pseudo-element on .paras running top-to-bottom,
   positioned at exactly 50% (the column boundary). No horizontal rules. */
.paras {
  max-width: 1180px; margin: 0 auto;
  position: relative;
}
.paras::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0; bottom: 0;
  width: 1px;
  background: var(--rule);
  pointer-events: none;
}
.row {
  display: grid; grid-template-columns: 1fr 1fr;
  padding: 0.85rem 0;
  align-items: start;
}
.row p {
  margin: 0; font-size: var(--fs); line-height: 1.74; hyphens: auto;
  padding: 0 1.5rem;
}
.row p:last-child { opacity: 0.88; }

/* ── Section dividers (short all-caps paragraphs) ───────────────────────── */
.section-div {
  display: grid; grid-template-columns: 1fr 1fr;
  margin-top: 2.4rem; position: relative;
}
.section-div .s-orig,
.section-div .s-trans {
  font-family: var(--sans); font-size: 10px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent);
  padding: 0.55rem 1.5rem; border-top: 1.5px solid var(--accent);
}

/* ── Page markers ───────────────────────────────────────────────────────── */
.page-row { max-width: 1180px; margin: 0 auto; text-align: center; padding: 0.35rem 0; }
.page-mark {
  color: var(--text-muted); font-size: 11px;
  font-family: var(--sans); font-style: normal;
}

/* ── Controls (font size + theme) ───────────────────────────────────────── */
.controls {
  position: fixed; top: 1rem; right: 1rem;
  display: flex; gap: 0.35rem; align-items: center; z-index: 100;
}
.ctrl-btn {
  background: var(--bg-alt); border: 1px solid var(--rule);
  color: var(--text-muted); border-radius: 4px;
  padding: 0.28rem 0.55rem; cursor: pointer;
  font-family: var(--sans); font-size: 11px; font-weight: 600;
  letter-spacing: 0.04em; transition: border-color 0.15s, color 0.15s;
  line-height: 1;
}
.ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
.theme-btn {
  background: var(--bg-alt); border: 1px solid var(--rule);
  color: var(--text-muted); border-radius: 4px;
  padding: 0.28rem 0.55rem; cursor: pointer;
  font-family: var(--sans); font-size: 11px; font-weight: 600;
  letter-spacing: 0.04em; transition: border-color 0.15s, color 0.15s;
  line-height: 1; margin-left: 0.15rem;
}
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Responsive ─────────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  .col-bar, .row, .section-div { grid-template-columns: 1fr; }
  .paras::before { display: none; }
  .row p:first-child {
    border-bottom: 1px solid var(--rule); padding-bottom: 0.6rem;
  }
  .row p:last-child { opacity: 1; padding-top: 0.6rem; }
  .col-bar { display: none; }
  .section-div .s-trans { border-top: none; padding-top: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<script>
const DATA = [{"orig": "HOMOGENEIDAD Y DIVISIÓN", "trans": "HOMOGENEITY AND DIVISION"}, {"orig": "Una característica dominante en el movimiento de la civilización moderna, característica acentuada enormemente en el curso de los dos últimos siglos, es la tendencia a la universal homogeneidad, la misma que, interpretada desde un punto de vista netamente histórico, puede ser considerada como la creciente occidentalización del mundo, a lo menos en el aspecto intelectual y técnico. En efecto, a partir de comienzos del siglo XVI, y obedeciendo a razones de expansión económica, de proselitismo religioso, o al prurito de dominación, ciertas potencias europeas de vocación imperial y marítima, van anexando a su dominio vastas zonas geográficas y humanas del planeta. Y así vemos cómo incorporadas definitivamente las Américas a la civilización occidental, aquellas potencias, unidas ahora a los Estados Unidos, extienden su influencia e imponen su prestigio en los demás continentes, y no sólo en comarcas sometidas directamente a la soberanía de las naciones colonialistas, sino en otras que imitan sus instituciones, aprovechan su técnica y soportan, con beneficio o sin él, su dominio económico. De otro lado, la cultura de la Europa occidental ejerce una verdadera fascinación en la alta intelectualidad Rusa del siglo XIX, produciendo el desgarramiento interno que se revela en la obra de los grandes escritores eslavos, principalmente en Dostoyeswki y Tolstoi y sembrando las simientes que, al amparo de circunstancias históricas favorables, habrían de producir el estallido de la revolución comunista de 1917, movimiento que, por una fatal contaminación se ha propagado más tarde a la China que acaba de someter por la violencia al Tibet, y a otras comarcas asiáticas y, según graves indicios, también a Norte América.", "trans": "A dominant characteristic in the movement of modern civilisation—a characteristic enormously accentuated in the course of the last two centuries—is the tendency toward universal homogeneity, which, interpreted from a strictly historical point of view, may be regarded as the growing westernisation of the world, at least in its intellectual and technical aspects. Indeed, from the beginning of the sixteenth century onwards, and impelled by motives of economic expansion, religious proselytism, or the itch for domination, certain European powers of imperial and maritime vocation began annexing to their domain vast geographical and human zones of the planet. And so we observe how, once the Americas had been definitively incorporated into Western civilisation, those powers, now joined by the United States, extended their influence and imposed their prestige upon the remaining continents—not only in regions directly subject to the sovereignty of the colonialist nations, but also in others that imitated their institutions, availed themselves of their technology, and endured, with benefit or without, their economic dominion. On the other side, the culture of Western Europe exercised a genuine fascination upon the higher Russian intelligentsia of the nineteenth century, producing that inner laceration which reveals itself in the work of the great Slavic writers, principally in Dostoevsky and Tolstoy, and sowing the seeds that, under the shelter of favourable historical circumstances, were to produce the explosion of the Communist Revolution of 1917—a movement which, by a fatal contagion, later spread to China, which has just subjected Tibet by violence, and to other Asiatic regions, and, according to grave indications, to North America as well."}, {"orig": "Con lo cual, tanto por la vía transcontinental y marítima, como por la vía continental, occidente exporta sus ideas, sus técnicas, sus inquietudes sociales al resto del mundo, en una como marea que quisiera anegar las particularidades locales para instaurar el reino de lo homogéneo anti tradicional y cuyas categorías dominantes serían estas: 1º predominio del sentido económico; 2º fe en la técnica científica a la que se supone capaz de solucionar todos los problemas y, consecuentemente; 3º pragmatismo, reglamentación, tendencia a reducir a reglas precisas la movilidad de la vida individual y social.", "trans": "By these means, whether by the transcontinental and maritime route or by the continental route, the West exports its ideas, its techniques, and its social anxieties to the rest of the world, in a tide that would engulf local particularities in order to establish the reign of the anti-traditional homogeneous, whose dominant categories would be the following: 1st, the predominance of the economic sense; 2nd, faith in scientific technique, which is supposed to be capable of resolving all problems, and consequently; 3rd, pragmatism, regulation, a tendency to reduce the mobility of individual and social life to precise rules."}, {"orig": "Pero esta homogeneidad no ha traido ni la armonía, ni el entendimiento, ni la paz. Al contrario, mientras por una parte se disuelven y pierden las formas locales y tradicionales de la vida, por otra surgen en forma violenta el sentimiento nacional y el ansia reivindicatoria en los países coloniales o de reciente ingreso a la plena soberanía política; y esto con la secuela inevitable de pretensiones hegemónicas, rivalidades y conjuras. Sentimientos a los que obedecen los movimientos de emancipación que han reducido considerablemente los imperios coloniales Francés y Británico en Asia y Africa y hecho desaparecer prácticamente el imperio ultramarino oriental de los Países Bajos y de Bélgica. A todo lo cual debemos añadir que no entra en el propósito de este estudio enjuiciar los movimientos coloniales y nacionales en referencia, toda vez que su objeto consiste únicamente en mostrar estos fenómenos que no son sino las fases de un mismo proceso: la inmigración a otras comarcas de ideas económicas, políticas y sociales de Europa y América, y la evolución de esas ideas hacia situaciones de beligerancia internacional cuyas expresiones más recientes son entre otras, la guerra de Corea, la guerra de Indochina, la reivindicación Egipcia del Canal de Suez, la tensión internacional del cercano Oriente, la tensión internacional provocada por la China, la guerra del Viet Nam, etc.", "trans": "Yet this homogeneity has brought neither harmony, nor understanding, nor peace. On the contrary, while on the one hand the local and traditional forms of life dissolve and are lost, on the other there arises with violent force the national sentiment and the yearning for redress in colonial countries or those of recent entry into full political sovereignty—and this with the inevitable sequel of hegemonic pretensions, rivalries, and conspiracies. These are the sentiments to which the emancipatory movements obey, movements that have considerably reduced the French and British colonial empires in Asia and Africa and have caused the practical disappearance of the overseas Eastern empire of the Netherlands and Belgium. To all of which we must add that it is not the purpose of this study to pass judgement upon the colonial and national movements in question, since its sole object consists in showing these phenomena as nothing other than phases of one and the same process: the migration to other regions of economic, political, and social ideas originating in Europe and America, and the evolution of those ideas toward situations of international belligerence, the most recent expressions of which are, among others, the Korean War, the Indochinese War, Egypt's claim to the Suez Canal, the international tension of the Near East, the international tension provoked by China, the Vietnam War, and so forth."}, {"orig": "Dentro de esa misma perspectiva encontramos que existe un conflicto más importante que las secesiones e insurrecciones locales. Ese conflicto que, en cierta medida explica y comprende aquellos movimientos, pero que los supera en peligrosidad, no es una mera división horizontal entre grupos y estados, sino vertical en el propio seno de las diversas comunidades nacionales. Podemos definirlo como la pugna entre dos opuestas concepciones de la relación entre el individuo y el estado, con implicaciones que afectan zonas muy profundas de la problemática humana. Y tales concepciones serían: de una parte la democracia liberal y de otra el comunismo, ambas de filiación occidental. No es necesario investigar minuciosamente en los orígenes para saber, en cuanto a la democracia liberal, que ella proviene de la práctica y de la filosofía política de Inglaterra y Francia, con antecedentes en la civilización Greco-Latina, y en cuanto al materialismo histórico —esqueleto teórico del comunismo—, es sabido que se constituye por la interpretación de la historia según el método dialéctico de Hegel. Filiación a que alude espiritualmente Valéry cuando, imitando el estilo del Génesis escribe: \"Kant qui genuit Hegel, qui genuit Marx, qui genuit......\" por eso, en su propia oposición, esas tendencias delatan su procedencia de la mentalidad Europea y, por lo menos, en el estado actual de su polémica, admiten ciertas importantes premisas comunes, por ejem.: la importancia del factor económico en la dinámica social y la vocación ya no meramente jurídica, sino esencialmente social del estado.", "trans": "Within that same perspective we find that there exists a conflict of greater importance than the local secessions and insurrections. This conflict, which in a certain measure explains and comprehends those movements, but surpasses them in dangerousness, is not a mere horizontal division between groups and states, but a vertical one within the very bosom of the various national communities. We may define it as the struggle between two opposed conceptions of the relationship between the individual and the state, with implications affecting very profound zones of human problematic. And those conceptions would be: on the one side, liberal democracy, and on the other, communism—both of Western lineage. It is unnecessary to investigate the origins minutely to know that liberal democracy derives from the political practice and philosophy of England and France, with antecedents in Graeco-Latin civilisation, and that historical materialism—the theoretical skeleton of communism—is known to be constituted by the interpretation of history according to Hegel's dialectical method. This is the lineage to which Valéry alludes in a spiritual manner when, imitating the style of Genesis, he writes: \"Kant qui genuit Hegel, qui genuit Marx, qui genuit......\" [Kant who begat Hegel, who begat Marx, who begat......]. And thus, in their very opposition, these tendencies betray their descent from the European mentality and, at least in the present state of their polemic, admit certain important common premises—for example, the importance of the economic factor in social dynamics, and the vocation of the state, no longer merely juridical but essentially social."}, {"orig": "Nos encontramos pues frente a un fenómeno de división del occidente universal. Hecho que como todo lo histórico, tiene múltiples causas, las que no pensamos enumerar, porque para el propósito de este ensayo, sólo nos interesa señalar la que consiste en que los elementos ideológicos del antiguo occidente, importados en regiones extrañas y separados de su contexto cultural, obran por decirlo así, por cuenta propia y, al amparo de determinadas coyunturas históricas, adquieren un extraordinario dinamismo de resistencia o de agresión contra las situaciones consolidadas a título consuetudinario o convencional. Y ello tanto en el interior de países de reciente formación como en el seno de vastas comunidades nacionales despertadas de un sueño secular; todo lo que suscita inquietud y aún situaciones de violencia en el ámbito interno y en la esfera internacional.", "trans": "We find ourselves, then, confronted with a phenomenon of division within the universal West. A fact which, like everything historical, has multiple causes, which we do not propose to enumerate, since for the purpose of this essay we are concerned only with pointing to the one that consists in this: that the ideological elements of the old West, imported into alien regions and separated from their cultural context, act, so to speak, on their own account, and, under the shelter of certain historical conjunctures, acquire an extraordinary dynamism of resistance or of aggression against situations consolidated by custom or convention. And this both within countries of recent formation and within vast national communities awakened from a centuries-long slumber—all of which gives rise to unrest and even situations of violence in the domestic sphere and in the international arena."}, {"orig": "Es curioso. Los hombres que pretendieron levantar la torre de Babel tuvieron que desistir de su propósito a consecuencia de la confusión de lenguas. Ahora se diría que la confusión aumenta en razón directa de la creciente unificación idiomática. En efecto, todos pronuncian y comprenden las grandes palabras de este tiempo: nacionalismo, intervención, huelga, lockout, sabotaje, doping, etc. Y aún más: parece que el inglés se convertirá a breve plazo en la lengua universal.", "trans": "It is curious. The men who attempted to raise the tower of Babel were compelled to abandon their purpose as a consequence of the confusion of tongues. Now one might say that the confusion increases in direct proportion to the growing unification of language. Indeed, all pronounce and understand the great words of the present age: nationalism, intervention, strike, lockout, sabotage, doping, and so forth. And more than this: it appears that English will within a short time become the universal tongue."}, {"orig": "Y sin embargo, insistimos, el desacuerdo surge justamente en el seno de esa ilimitada posibilidad de transmisión verbal. Ante cuya situación cabe preguntar: ¿Existe relación de causalidad entre la comunidad del habla y la división entre pueblos, razas y clases?. Sería aventurado afirmarlo. Pero el fenómeno en sí es interesante como aspecto de la tendencia general a la homogeneidad, que por una parte propaga signos, formas, modas, y por otra parte, pone de manifiesto, con sus proyecciones más peligrosas las intenciones, pasiones e intereses antagónicos que los términos de curso forzoso, a la vez que expresan, propagan y estimulan.", "trans": "And yet, we insist, disagreement arises precisely within the bosom of this unlimited possibility of verbal transmission. Confronted with which situation, one may well ask: does a causal relationship exist between the community of speech and the division among peoples, races, and classes? It would be rash to affirm it. But the phenomenon in itself is interesting as an aspect of the general tendency toward homogeneity, which on the one hand propagates signs, forms, and fashions, and on the other brings to light, through its more dangerous projections, the antagonistic intentions, passions, and interests that the terms of compulsory currency at once express, propagate, and stimulate."}, {"orig": "Con más eficacia que el lenguaje, la ciencia contribuye sobre todo por sus aplicaciones técnicas a la homogeneización universal. La ciencia es una admirable creación de occidente, y entre los valores de su vocación esencial está el de propender a la armonía humana mediante la constitución de una comunidad espiritual al servicio desinteresado del saber. Pero ocurre que la ciencia, o mejor sus hallazgos, de preferencia en el terreno de la física nuclear, son empleados principalmente como instrumentos de la rivalidad internacional y utilizados para la fabricación de armas destructivas de incalculable poder.", "trans": "With greater efficacy than language, science contributes—above all through its technical applications—to universal homogenisation. Science is an admirable creation of the West, and among the values of its essential vocation is that of tending toward human harmony through the constitution of a spiritual community in the disinterested service of knowledge. But it so happens that science—or rather its discoveries, preferably in the field of nuclear physics—is employed principally as an instrument of international rivalry and utilised for the manufacture of destructive weapons of incalculable power."}, {"orig": "Junto con sus ideologías, su lenguaje y sus técnicas el occidente ha exportado otros modos de conducta y propuesto otros motivos y móviles a la acción de hombres y pueblos antes sustraidos a su influjo. Revolución, pasión política y nacional pueden ser las designaciones que califiquen estas influencias de tipo afectivo y dinámico. Las mismas que han transportado al oriente modalidades psicológicas que nos parecían exclusivas del hombre occidental: el prurito revolucionario, la pasión política y el sentimiento de la nacionalidad. El prurito revolucionario, la idea de que es posible, deseable en ocasiones provocar una transformación total de situaciones sociales o políticas es exclusivamente occidental, como lo es la ambición apasionada de poder político y como lo es igualmente el sentimiento de la nacionalidad, entendida ésta como una entidad dinámica y sintética que, por esencia, busca la expansión y el dominio. El oriente imita y exagera estas ideas con las tendencias que les son inherentes y así, por un lado se convulsiona y anarquiza y por otro se erige en adversario resentido de los pueblos que, comunicándole un nuevo sentimiento de la vida, lo han despertado de su sueño de siglos.", "trans": "Together with its ideologies, its language, and its techniques, the West has exported other modes of conduct and proposed other motives and impulses to the action of men and peoples previously withdrawn from its influence. Revolution, political passion, and national passion may serve as designations to qualify these influences of an affective and dynamic character—the same that have transported to the East psychological modes that seemed to us exclusive to Western man: the revolutionary itch, political passion, and the sentiment of nationality. The revolutionary itch—the idea that it is possible and at times desirable to provoke a total transformation of social or political situations—is exclusively Western, as is the passionate ambition for political power, and as is equally the sentiment of nationality, understood as a dynamic and synthetic entity that seeks by its very essence expansion and dominion. The East imitates and exaggerates these ideas with the tendencies inherent to them, and thus on the one hand convulses and anarchises itself, and on the other erects itself as an aggrieved adversary of the peoples who, by communicating to it a new sense of life, have awakened it from its centuries-long slumber."}, {"orig": "Lo malo es que parece que el occidente primordial, representado de modo eminente por la madre Europa, se fascinara con el espectáculo de su propia disminución, o más bien con la imagen empobrecida de sus propias creaciones una vez despojadas de su dimensión en profundidad, de su auténtica filiación cultural: una justicia social sin cristianismo, un arte deshumanizado, abstracto, una sociabilidad cosmopolita y frívola, etc. Panorama de la vida moderna en que la ciencia exacta representa sin duda un timbre de gloria, sólo que ella pretende con peligroso exceso, asumir sin restricciones la representación del universo y la dirección del mundo. Con todo lo cual está en vías de constituirse more geometrica, un mundo de cálculos, de definiciones y de fórmulas en cierto modo autónomas, independiente de los presupuestos espirituales y anímicos que condicionaron el pasado y cuyos habitantes serían verdaderos déracinés, hombres del puro presente sin espesor temporal ni lejanía.", "trans": "The trouble is that the primordial West, represented eminently by mother Europe, seems to become fascinated with the spectacle of its own diminution—or rather with the impoverished image of its own creations once stripped of their depth dimension, of their authentic cultural lineage: a social justice without Christianity, a dehumanised and abstract art, a cosmopolitan and frivolous sociability, and so forth. A panorama of modern life in which exact science represents without doubt a badge of glory, except that it claims with perilous excess to assume without restriction the representation of the universe and the direction of the world. With all of which there is in progress the constitution, more geometrico [in the geometric manner], of a world of calculations, definitions, and formulae that are in some measure autonomous, independent of the spiritual and psychic presuppositions that conditioned the past, and whose inhabitants would be true déracinés [the uprooted]—men of the pure present, without temporal depth or distance."}, {"orig": "La división dicotómica oriente-occidente, pierde su viejo y profundo sentido simbólico que es lo que queda al este de la llamada cortina de hierro, occidente, lo que queda al oeste. Ha desaparecido la relación que antes existía entre determinadas áreas geográficas y un cierto tipo de vida espiritual, dentro de cuyos marcos el oriente se caracterizaba por su tendencia a la contemplación y el occidente por su tendencia a la acción y a la aventura. El viejo cristianismo de Dostoyeswki está siendo suprimido o reprimido en la Rusia soviética en nombre de la concepción materialista de la historia y del ateismo que son las doctrinas oficiales y, en realidad obligatorias; la China se occidentaliza según el ejemplo ruso, y hasta la misma India que ejercía un cierto magisterio y una cierta atracción de misticismo, entra sin ningún mensaje propio, en la intriga internacional. Por lo cual, el antiguo diálogo oriente-occidente, susceptible de una síntesis, desaparece para ser reemplazado por una pugna entre dos concepciones políticas y económicas, si queremos, entre dos occidentes: uno que llamaremos auténtico, tradicional, de raigambre y filiación medievales que consagra el valor absoluto de la persona humana, el otro, desprendido y esquemático que condena el culto de la persona y erige el valor de lo colectivo y anónimo en el centro de su estimativa y en criterio de su economía y de su política. Analizando esta situación cultural desde su punto de vista Denis de Rougemont escribe estas luminosas palabras: \"En el momento mismo en que occidente sería capaz de instituir las condiciones para todos, se empobrece espiritualmente, mientras que el oriente se lanza sobre nuestras técnicas y olvida sus valores propios, que serían aquellos de los cuales nosotros tenemos la más grande necesidad\". De donde se concluye, en resumen, que mientras el occidente abandona el sentido de sus orígenes y gana en extensión lo que pierde en profundidad, el oriente, por su parte renuncia a los valores de su vocación tradicional y adopta, con fanatismo a veces, los resultados o las derivaciones extremas de una evolución histórica que le es extraña.", "trans": "The dichotomous division East–West loses its old and profound symbolic sense: what remains to the east of the so-called Iron Curtain is West, and what remains to the west is also West. The relationship that formerly existed between certain geographical areas and a certain type of spiritual life has disappeared—within whose framework the East was characterised by its tendency to contemplation and the West by its tendency to action and adventure. The old Christianity of Dostoevsky is being suppressed or repressed in Soviet Russia in the name of the materialist conception of history and of atheism, which are its official and, in practice, obligatory doctrines; China westernises itself after the Russian model; and even India herself, which exercised a certain magisterium and certain attraction of mysticism, enters the international intrigue without any message of her own. Wherefore the ancient dialogue between East and West, susceptible of a synthesis, disappears, to be replaced by a struggle between two political and economic conceptions—if we will, between two Wests: one, which we shall call authentic, traditional, of medieval root and lineage, which consecrates the absolute value of the human person; the other, detached and schematic, which condemns the cult of the person and erects the value of the collective and the anonymous at the centre of its estimation and as the criterion of its economy and its politics. Analysing this cultural situation from his own point of view, Denis de Rougemont writes these luminous words: \"At the very moment when the West would be capable of establishing the conditions for all, it impoverishes itself spiritually, while the East flings itself upon our techniques and forgets its own values—values that are precisely those of which we stand in greatest need.\" From which it may be concluded, in sum, that while the West abandons the sense of its origins and gains in extension what it loses in depth, the East, for its part, renounces the values of its traditional vocation and adopts, sometimes with fanaticism, the results or extreme derivations of a historical evolution that is alien to it."}, {"orig": "Tres son a mi entender las grandes características del occidente profundo, las mismas que no han excitado el instinto mimético del oriente geográfico a saber: 1) Valor absoluto de la personalidad individual; sentimiento indeclinable de la autonomía interior que preserva al individuo de la absorción social y, principalmente de la absorción por el estado; 2) amor filial por el pasado, que no es una entidad abolida sino presente y viva, cuya riqueza alimenta la particularidad anímica del pueblo y según cuyas grandes tendencias se define el sentido histórico de la nación; 3) sentimiento cristiano de la vida, que como una biósfera penetra y condiciona la actividad creativa y sitúa las relaciones humanas en un plano muy superior a las consideraciones utilitarias y a las exclusiones y oposiciones de partido o de clase.", "trans": "Three are, in my understanding, the great characteristics of the deep West—the same characteristics that have not excited the mimetic instinct of the geographical East, namely: 1) the absolute value of individual personality; the indefeasible sentiment of inner autonomy that preserves the individual from social absorption and, principally, from absorption by the state; 2) filial love for the past, which is not an abolished entity but one present and living, whose richness nourishes the particular soul of the people and according to whose great tendencies the historical sense of the nation is defined; 3) the Christian sense of life, which, like a biosphere, penetrates and conditions creative activity and situates human relations on a plane far superior to utilitarian considerations and to the exclusions and oppositions of party or class."}, {"orig": "Estos sentimientos, estas tendencias constituyen el yo profundo del occidente primordial, siendo de deplorar que este fondo dinámico se vea reducido cada vez más por la expansión y petrificación de las capas exteriores, únicas que despiertan en otras regiones geográficas y espirituales el prurito mimético.", "trans": "These sentiments, these tendencies constitute the deep self of the primordial West, and it is to be deplored that this dynamic fund should find itself ever more reduced by the expansion and petrification of the outer layers—the only ones that awaken in other geographical and spiritual regions the mimetic itch."}, {"orig": "En Europa conservan esta preciosa reserva los grandes pueblos creadores de la cultura: Latinos, Germanos, fuera de Europa la poseen las Américas, principalmente la nuestra, por su filiación católica e hispánica; a lo que debe agregarse en el caso del Perú una profundidad en el tiempo que encierra posibilidad y latencia. En esta interioridad y, por lo tanto, en los pueblos que la poseen como entidades culturales e históricas, reside el secreto de la resurrección del alma, la posibilidad de un nuevo humanismo que infunda en las formas de una civilización mecanizada y dividida, el verdadero espíritu de la vida, que es espíritu de los orígenes, original y creador.", "trans": "In Europe this precious reserve is preserved by the great peoples who are creators of culture: the Latins and the Germans; outside Europe it is possessed by the Americas, principally our own, by virtue of its Catholic and Hispanic lineage—to which must be added, in the case of Peru, a depth in time that encloses possibility and latency. In this interiority, and therefore in the peoples who possess it as cultural and historical entities, resides the secret of the resurrection of the soul, the possibility of a new humanism that will infuse into the forms of a mechanised and divided civilisation the true spirit of life—which is the spirit of the origins, original and creative."}, {"orig": "Spencer define la evolución como el paso de lo homogéneo a la heterogéneo, y Bergson, no obstante su oposición al evolucionismo del pensador inglés, profesa en el fondo una tesis semejante al concebir la evolución creadora como la diversificación del élan vital. Pero ahora resulta que la humanidad, después de tantos trabajos y logros, parece encaminarse hacia una homogeneidad final que contradice el sentido de la evolución tal como la conciben tan ilustres filósofos. Y de tal suerte este fenómeno plantea un problema que requiere un tratamiento especial, pero cuya solución podemos vislumbrar si pensamos que la esencia del hombre es la libertad —la cual implica originalidad irreductible— y que por consiguiente, la homogeneidad sólo constituye un estado precario que deberá ser superado por la múltiple diversidad, a la vez creadora y reveladora, de la auténtica vida espiritual.", "trans": "Spencer defines evolution as the passage from the homogeneous to the heterogeneous, and Bergson, notwithstanding his opposition to the evolutionism of the English thinker, professes at bottom a similar thesis when he conceives of creative evolution as the diversification of the élan vital [vital impulse]. But now it turns out that humanity, after so many labours and achievements, seems to be making its way toward a final homogeneity that contradicts the sense of evolution as conceived by such illustrious philosophers. And in this fashion the phenomenon poses a problem requiring special treatment, though its solution may be glimpsed if we reflect that the essence of man is freedom—which implies irreducible originality—and that consequently homogeneity constitutes only a precarious state that must be surpassed by the manifold diversity, at once creative and revelatory, of authentic spiritual life."}, {"orig": "La homogeneidad implica el empobrecimiento de la vida, pero no por eso elimina el instinto de discordia; al contrario lo excita porque le proporciona, gracias a la generalización de la técnica, nuevos medios de satisfacción. Y así como dice Jaeger: \"Sólo tiene una medida quien posee la tradición\" resultará que en una humanidad sin raigambre campeará por doquier la desmesura. Y así tendremos que la humanidad contemporánea se constituye como el mundo de Demócrito, o sea como un mundo compuesto de átomos iguales o tan sólo diversos por el volumen o el peso y sobre cuyos choques no impera el logos de Heráclito, único capaz de transformar en armonía la discordia de las tensiones opuestas.", "trans": "Homogeneity implies the impoverishment of life, but does not for that reason eliminate the instinct of discord; on the contrary, it excites it, since it furnishes it, through the generalisation of technology, with new means of satisfaction. And just as Jaeger says—\"Only he who possesses the tradition has measure\"—it will result that in a humanity without roots, excess will hold sway everywhere. And so we shall find that contemporary humanity constitutes itself as the world of Democritus—that is to say, as a world composed of equal atoms, or ones differing only in volume or weight, over whose collisions the logos of Heraclitus holds no sway, the logos alone being capable of transforming into harmony the discord of opposed tensions."}, {"orig": "Toda situación histórica crea una exigencia en la conducta de los hombres conscientes. Exigencia que no constituye necesariamente un imperativo de aceptación o de adaptación, que implicaría una cierta teodicea que santificaría y justificaría dogmáticamente el fatum histórico, o supondría una especie de darwinismo inadmisible en el dominio del espíritu. En el caso presente, esta exigencia es la de mantenerla ajena de los valores del occidente primordial, y dentro de ese cuadro la de defender y preservar el acervo tradicional, la idiosincrasia de la propia nación contra la marea de la igualación cosmopolita. Con ello, no sólo seguiremos la causa del particularismo; trabajaremos, en el fondo al servicio de una finalidad más general y de mayor significación, consistente en que la viviente unidad de lo diverso, prevalezca sobre la desértica uniformidad de lo mismo.", "trans": "Every historical situation creates an exigency in the conduct of conscious men. An exigency that does not necessarily constitute an imperative of acceptance or adaptation, which would imply a certain theodicy that would sanctify and dogmatically justify the historical fatum [fate], or would suppose a kind of Darwinism inadmissible in the domain of the spirit. In the present case, this exigency is that of maintaining fidelity to the values of the primordial West, and within that framework, of defending and preserving the traditional heritage, the idiosyncrasy of one's own nation, against the tide of cosmopolitan levelling. By so doing, we shall not merely serve the cause of particularism; we shall work, at bottom, in the service of a more general and more significant end—that the living unity of the diverse shall prevail over the desert uniformity of the same."}, {"orig": "Para terminar diremos, aunque quizá resulte innecesario, que esta descripción tiene algo de esquemático; que adolece de cierta exageración estilística la cual, empero, no invalida ni el sentido que atribuimos a los hechos ni la conclusión que deducimos de su observación. En todo estudio de complejos históricos es inevitable un trabajo de simplificación abstractiva que permita seguir sin desviaciones las grandes líneas de una estructura dinámica, que haga posible configurarla en unos cuantos rasgos expresivos, de suerte que ese abstracto se convierta en el concreto de su aprehensión global y su valoración, como modo a la vez irrepetible y significativo del devenir humano.", "trans": "In conclusion, we shall say—though perhaps it is unnecessary—that this description has something schematic about it; that it suffers from a certain stylistic exaggeration, which, however, does not invalidate either the meaning we attribute to the facts or the conclusion we deduce from our observation of them. In every study of historical complexes, an abstractive work of simplification is inevitable—one that allows the great lines of a dynamic structure to be followed without deviation, that makes it possible to configure them in a few expressive features, so that the abstract is transformed into the concrete of its global apprehension and its evaluation as a mode of human becoming at once unrepeatable and significant."}];
const container = document.getElementById('paras');
const root = document.documentElement;

// ── Font size control ──────────────────────────────────────────────────────
let fontSize = 15.5;
function setFontSize(px) {
  fontSize = Math.max(11, Math.min(22, px));
  root.style.setProperty('--fs', fontSize + 'px');
}
document.getElementById('fontDown').addEventListener('click', () => setFontSize(fontSize - 1));
document.getElementById('fontUp').addEventListener('click',   () => setFontSize(fontSize + 1));

// ── Paragraph rendering ────────────────────────────────────────────────────
function isHeader(s) {
  return s.length < 80 && s === s.toUpperCase() && /[A-ZÁÉÍÓÚÑÜ]/.test(s);
}
function pageMark(num) {
  const span = document.createElement('span');
  span.className = 'page-mark';
  span.textContent = ' [' + num + '] ';
  return span;
}
function snapToWord(text, pos) {
  if (pos <= 0) return 0;
  if (pos >= text.length) return text.length;
  if (text[pos] === ' ') return pos;
  let lo = pos - 1, hi = pos + 1;
  while (lo > 0 && text[lo] !== ' ') lo--;
  while (hi < text.length && text[hi] !== ' ') hi++;
  return (pos - lo <= hi - pos) ? lo : hi;
}

DATA.forEach((d) => {
  if (isHeader(d.orig)) {
    const div = document.createElement('div');
    div.className = 'section-div';
    div.innerHTML =
      '<div class="s-orig">' + d.orig + '</div>' +
      '<div class="s-trans">' + d.trans + '</div>';
    container.appendChild(div);
    return;
  }

  const row = document.createElement('div');
  row.className = 'row';
  const orig  = document.createElement('p');
  const trans = document.createElement('p');

  if (d.page_mid) {
    const offset = d.mid_offset;
    const ratio = offset / d.orig.length;
    const tOff = snapToWord(d.trans, Math.round(d.trans.length * ratio));
    orig.append(d.orig.slice(0, offset),  pageMark(d.page_mid), d.orig.slice(offset));
    trans.append(d.trans.slice(0, tOff),  pageMark(d.page_mid), d.trans.slice(tOff));
  } else {
    orig.textContent  = d.orig;
    trans.textContent = d.trans;
  }

  row.appendChild(orig);
  row.appendChild(trans);
  container.appendChild(row);

  if (d.page_after) {
    const nums = Array.isArray(d.page_after) ? d.page_after : [d.page_after];
    nums.forEach((num) => {
      const marker = document.createElement('div');
      marker.className = 'page-row';
      marker.appendChild(pageMark(num));
      container.appendChild(marker);
    });
  }
});

// ── Theme toggle ───────────────────────────────────────────────────────────
const themeBtn = document.getElementById('themeBtn');
let dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme(isDark) {
  root.setAttribute('data-theme', isDark ? 'dark' : 'light');
  themeBtn.textContent = isDark ? 'light' : 'dark';
  themeBtn.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
}
applyTheme(dark);
themeBtn.addEventListener('click', () => { dark = !dark; applyTheme(dark); });
</script>
