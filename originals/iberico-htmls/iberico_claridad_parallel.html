<div class="wrap">
  <div class="title">Concepto y sentido de la claridad en la filosofía del siglo XVII</div>

  <div class="col-headers">
    <span>Español, original</span>
    <span>English, translation</span>
  </div>

  <div id="paras"></div>
</div>

<script>
const DATA = [{"orig": "Hay una idea que, en cierto sentido, dirige y orienta la especulación de los filósofos del siglo XVII, a lo menos de los más representativos, Descartes, Spinoza y Leibniz, y es la idea de \"claridad\", que no sólo tiene una importancia gnoseológica, puesto que la claridad y la distinción de los conocimientos son una garantía de su verdad, sino una significación que podríamos llamar axiológica, dado que en la jerarquía de las acciones y de los sentimientos se considera como los más dignos y elevados aquellos cuyas razones y fundamentos se perciben con mayor claridad, aquellos placeres que Leibniz llamaba con expresión a la vez técnica y poética \"placeres luminosos\". Y más aún: esta idea de claridad, con el verdadero culto espiritual que se le rendía, implicaba en el fondo toda una metafísica, puesto que su admisión como criterio de certeza y su instauración como guía de la vida moral suponían una verdadera adecuación ontológica entre la claridad de la intuición conciente y la estructura más profunda de la realidad y del ser. De aquí que revista un vivo interés especulativo e histórico el estudio de esa idea.", "trans": "There is an idea that, in a certain sense, guides and orients the speculation of the seventeenth-century philosophers, at least the most representative ones — Descartes, Spinoza, and Leibniz — and that is the idea of \"clarity,\" which holds not only a gnoseological importance, since the clarity and distinctness of knowledge serve as a guarantee of its truth, but also a significance that we might call axiological: in the hierarchy of actions and feelings, those whose reasons and foundations are perceived with the greatest clarity are considered the most worthy and elevated — those pleasures that Leibniz called, in an expression at once technical and poetic, \"luminous pleasures.\" And more still: this idea of clarity, with the genuine spiritual cult devoted to it, implied at its core an entire metaphysics, since its admission as a criterion of certainty and its establishment as a guide for the moral life presupposed a true ontological adequation between the clarity of conscious intuition and the deepest structure of reality and being. It is for this reason that the study of that idea holds a vivid speculative and historical interest."}, {"orig": "Naturalmente que en estas cortas páginas no pretendemos exponer en su integridad la filosofía de los grandes pensadores a quienes consideramos como los filósofos representativos del siglo XVII, ni nos proponemos tampoco discutir a fondo el valor del principio que asienta la verdad de las ideas o proposiciones claras y evidentes, principio que unos críticos rechazan sosteniendo que la claridad de las ideas no revela sino al contrario encubre la efectiva complejidad y misteriosidad de lo real y que otros combaten parcialmente admitiendo su validez en cuanto concierne a la verdad formal —lógica y matemática— pero negándosela en cuanto atañe a la verdad material o sea a la adecuación de las cosas en sí al intelecto. Nuestro intento se limita a mostrar, en la concepción y desarrollo del principio de la claridad, —cuyo sentido trataremos de fijar— una cierta forma típica del pensamiento metafísico que, ampliando y elevando la significación de esa idea, la promueve hasta asumir no sólo la representación del ser sino la suprema representación de la perfección y de la divinidad.", "trans": "Naturally, in these brief pages we do not claim to expound in full the philosophy of the great thinkers we consider the representative philosophers of the seventeenth century, nor do we propose to examine in depth the value of the principle that grounds the truth of clear and evident ideas or propositions — a principle that some critics reject, maintaining that the clarity of ideas does not reveal but rather conceals the effective complexity and mysteriousness of the real, while others contest it only partially, granting its validity with regard to formal truth — logical and mathematical — but denying it with regard to material truth, that is, the adequation of things in themselves to the intellect. Our aim is limited to showing, in the conception and development of the principle of clarity — whose meaning we shall attempt to fix — a certain typical form of metaphysical thought that, by broadening and elevating the significance of that idea, promotes it until it assumes not merely the representation of being but the supreme representation of perfection and divinity."}, {"orig": "En otras palabras, nos proponemos contemplar brevemente el admirable destino de una idea que llegó a contener en sí no sólo toda una filosofía sino, en cierto modo, a representar y estimular una forma de contemplación de Dios que, por la elevación y la pureza espiritual que le son propias, podría con justicia llamarse mística.", "trans": "In other words, we propose to contemplate briefly the admirable destiny of an idea that came to contain within itself not only an entire philosophy but, in a certain way, to represent and stimulate a form of contemplation of God that, by virtue of the elevation and spiritual purity proper to it, could with justice be called mystical."}, {"orig": "¿Acaso bajo el nombre de claridad se encubre sencillamente la idea de razón? Quizá, siempre que se considere la razón no como un simple mecanismo de deducción, como mera actividad discursiva, sino como visión indubitable, como intuición directa de la presencia del ser al alma. En todo caso, hay más de intuición intelectual que de mecanismo deductivo en la idea de claridad que, bajo la influencia de Descartes, utilizan los filósofos del siglo XVII, y algo como una erótica que busca en la presencia sin sombras de los objetos intelectuales una satisfacción que no es del mero conocer, sino que atañe a las más altas y más nobles formas de la afectividad.", "trans": "Could it be that beneath the name of clarity one finds simply the idea of reason? Perhaps — provided that reason is considered not as a mere mechanism of deduction, a bare discursive activity, but as indubitable vision, as direct intuition of the presence of being to the soul. In any case, there is more of intellectual intuition than of deductive mechanism in the idea of clarity that, under the influence of Descartes, the philosophers of the seventeenth century employ, and something like an erotics that seeks in the shadowless presence of intellectual objects a satisfaction that belongs not to mere knowing but to the highest and most noble forms of affectivity."}, {"orig": "Mirando con más detenimiento encontramos que la instauración de la claridad como criterio, como la sustancia misma de la certidumbre, como piedra de toque a cuyo contacto los pensamientos y las ideas revelan su verdad y su adecuación, quería decir en esencia lo siguiente:", "trans": "Looking more carefully, we find that the establishment of clarity as a criterion — as the very substance of certainty, as a touchstone at whose contact thoughts and ideas reveal their truth and their adequation — amounted in essence to the following:"}, {"orig": "1. Es verdadero lo que la mente comprende o, mejor, lo que la mente percibe con precisión, distinción y plenitud. Aquello que no comprende porque es oscuro, confuso, es un error o encierra elementos de error que, como tales, según la expresión de Descartes, participan de la nada.", "trans": "1. What is true is what the mind comprehends, or rather, what the mind perceives with precision, distinctness, and fullness. That which it does not comprehend because it is obscure or confused is an error, or contains elements of error that, as such, in Descartes's expression, partake of nothingness."}, {"orig": "2. La claridad no es sino el nombre de la intuición directa de la verdad y del ser, y no puede ser engañosa porque tiene en sí misma la condición interna de su validez. La claridad es el fundamento de la evidencia y por consiguiente es un criterio absoluto y último, ya que la propia veracidad divina a que Descartes recurría para garantizar la verdad de nuestras ideas claras y evidentes, no era en el fondo sino un atributo deducido de la idea de perfección cuya percepción clara y distinta fundamentaba la prueba más decisiva de la existencia de Dios.", "trans": "2. Clarity is none other than the name for the direct intuition of truth and being, and it cannot be deceptive because it carries within itself the internal condition of its own validity. Clarity is the foundation of evidence and is consequently an absolute and ultimate criterion, since the very divine veracity to which Descartes appealed in order to guarantee the truth of our clear and evident ideas was, at bottom, merely an attribute derived from the idea of perfection whose clear and distinct perception constituted the most decisive proof of the existence of God."}, {"orig": "3. La claridad no es pues la mera fe en la lógica. Es eso y algo más: es la admisión de que existe algo así como una vocación o necesidad metafísica de revelación, de exhibición en el fondo más profundo de lo real.", "trans": "3. Clarity is not, then, mere faith in logic. It is that and something more: it is the admission that there exists something like a metaphysical vocation or necessity of revelation, of self-disclosure in the deepest ground of the real."}, {"orig": "4. Finalmente, utilizando la que podríamos llamar versión de Husserl sobre la evidencia cartesiana —que no es otra cosa que el criterio de claridad— podríamos decir que la claridad no es en el fondo sino la presencia misma, total y explícita del objeto del conocimiento a la mirada de la mente, del ego. La claridad es, formalmente, la propiedad de una visión que percibe directamente el objeto con todo lo que le es inherente y con las articulaciones que, al par que lo distinguen, lo relacionan con otros contenidos de la mente. Y así, en cuanto evidencia que, por encima de toda duda, establece la certeza absoluta y la necesidad formal de las estructuras mentales, la claridad viene a ser algo así como la forma o la conciencia misma de la apodicticidad.", "trans": "4. Finally, invoking what we might call Husserl's reading of Cartesian evidence — which is nothing other than the criterion of clarity — we might say that clarity is, at bottom, nothing less than the total and explicit presence of the object of knowledge to the gaze of the mind, of the ego. Clarity is, formally, the property of a vision that perceives the object directly with all that is inherent to it, and with the articulations that simultaneously distinguish it from and relate it to other contents of the mind. And thus, as evidence that, above all doubt, establishes the absolute certainty and formal necessity of mental structures, clarity comes to be something like the form or the consciousness itself of apodicticity."}, {"orig": "Desde un punto de vista histórico, la ecuación claridad-verdad determina todo el destino de la especulación cartesiana y de la de sus grandes continuadores Spinoza y Leibniz. Asentada la equivalencia o inherencia de la claridad racional a la verdad y de la verdad al ser, ya no faltaba nada para encumbrar la claridad hasta constituir ya no un simple atributo sino en cierto modo la esencia constitutiva del propio Dios, como el summum esse. Con lo cual el sentimiento metafísico y la meditación teológica se transfiguraban en un como éxtasis místico ante la luminosidad de las ideas y ante la suprema armonía del orden intelectual del mundo.", "trans": "From a historical point of view, the equation clarity-truth determines the entire destiny of Cartesian speculation and that of its great continuators Spinoza and Leibniz. Once the equivalence or inherence of rational clarity in truth, and of truth in being, was established, nothing remained to prevent clarity from being elevated until it constituted not merely a simple attribute but, in a certain way, the constitutive essence of God himself, as the summum esse. With this, metaphysical feeling and theological meditation were transfigured into something like a mystical ecstasy before the luminosity of ideas and before the supreme harmony of the intellectual order of the world."}, {"orig": "Y así la filosofía de estos grandes pensadores era una filosofía diurna; se extasiaba ante la armonía de las ideas, ante el orden admirable que creía descubrir en el mundo. Y en el amor intelectual de Dios, que no era sino la visión clara de la eternidad, ponía la suprema elevación del alma tanto en el orden del conocimiento como en la esfera de la perfección espiritual y de la beatitud. Pero en esa filosofía diurna —salvo acaso en Leibniz— no existe la noche o, mejor, la noche, la oscuridad, sólo se darían como formas inferiores de lo que esos filósofos llamaban, con intención desvalorativa, la pasión. Y de este modo esta filosofía desconocía o no estudiaba la acción de los elementos nocturnos en la dinámica de la vida interior.", "trans": "And thus the philosophy of these great thinkers was a diurnal philosophy; it stood in ecstasy before the harmony of ideas, before the admirable order it believed it could discover in the world. And in the intellectual love of God — which was nothing other than the clear vision of eternity — it placed the supreme elevation of the soul, both in the order of knowledge and in the sphere of spiritual perfection and beatitude. But in that diurnal philosophy — with the possible exception of Leibniz — night does not exist; or rather, night and obscurity could arise only as inferior forms of what those philosophers called, with a devaluing intent, passion. And in this way that philosophy disregarded or failed to study the action of nocturnal elements in the dynamics of the inner life."}, {"orig": "Sabemos que a Heráclito de Efeso llamábanle el oscuro. Ello podría deberse a una de estas dos causas o a las dos juntamente. Oscuro podía llamársele a Heráclito a causa de que alguna o algunas de sus fórmulas eran o parecían de comprensión difícil. Quizá era una de ellas la que se encierra en el fragmento 52 que dice: \"El tiempo es un niño que se entretiene jugando a los dados: es el reino del niño\". Oscuro podría también llamársele aludiendo a la oscuridad de la propia intuición heracliteana de las cosas, a su sentido de lo misterioso, nocturno e insondable de la realidad. Y acaso entre otros, justificaría esta calificación y este juicio el fragmento 45 que dice: \"No intentes recorrer los límites del alma; ella es muy honda\".", "trans": "We know that Heraclitus of Ephesus was called \"the Obscure.\" This could be attributed to one or both of two causes. He might have been called obscure because some of his formulas were or seemed difficult to understand. Perhaps one of them is encapsulated in Fragment 52, which says: \"Time is a child at play, moving pieces on a board: the kingdom of the child.\" He might also have been called obscure in reference to the darkness of Heraclitus's own intuition of things, to his sense of the mysterious, nocturnal, and unfathomable character of reality. And perhaps, among others, the judgment would be justified by Fragment 45, which says: \"Do not try to traverse the limits of the soul; it is very deep.\""}, {"orig": "De todos modos Heráclito es oscuro, es \"el oscuro\". Y he aquí que esta relación entre Heráclito y la oscuridad, al par que nos instruye sobre el sentido de la concepción heracliteana, nos sirve para determinar los que podrían considerarse como aspectos negativos de la filosofía de la claridad, principalmente desde el punto de vista gnoseológico.", "trans": "In any case, Heraclitus is obscure — he is \"the Obscure.\" And this relation between Heraclitus and obscurity, while instructing us about the character of the Heraclitean conception, also serves to determine what might be considered the negative aspects of the philosophy of clarity, principally from the gnoseological point of view."}, {"orig": "La concepción heracliteana es una filosofía del devenir y de la oposición, y es oscura porque sus intuiciones no se recortan ni se fijan como figuras geométricas en el espacio de la mente. Más que visiones reductibles a fórmulas eidéticas o conceptuales son intuiciones de inmersión, expresables solamente en formas simbólicas y que, en sí mismas, están llenas de un sentimiento de insondabilidad y de misterio. Y acaso son oscuras porque desafían el principio de no contradicción y violan —si puede hablarse así— el principio de identidad.", "trans": "The Heraclitean conception is a philosophy of becoming and of opposition, and it is obscure because its intuitions do not stand out or fix themselves like geometrical figures in the space of the mind. Rather than visions reducible to eidetic or conceptual formulas, they are intuitions of immersion, expressible only in symbolic forms and filled, in themselves, with a feeling of unfathomability and mystery. And perhaps they are obscure because they challenge the principle of non-contradiction and violate — if one may speak thus — the principle of identity."}, {"orig": "Si la filosofía del devenir y de la oposición es la filosofía de la oscuridad, la filosofía del ser y de la identidad es por esencia la filosofía de la claridad. La intuición de lo que es estáticamente, tiene por necesidad que ser clara para ser admitida como válida. La intuición de lo que es no puede ser confusa porque si lo fuera no nos daría la noción de lo que contiene. La concepción o intuición de lo inmóvil debe ser clara y acabada porque de lo contrario no sería una inmóvil percepción de lo eterno sino una inquietud, un conato, una oscura insatisfacción contraria al objeto en sí de la filosofía y opuesta a la aspiración ética, religiosa y estética dirigida a alcanzar en el reposo la pura contemplación de ese objeto.", "trans": "If the philosophy of becoming and opposition is the philosophy of obscurity, then the philosophy of being and identity is by essence the philosophy of clarity. The intuition of what exists statically must of necessity be clear in order to be accepted as valid. The intuition of what is cannot be confused, because if it were, it would not yield to us the notion of what it contains. The conception or intuition of the immovable must be clear and complete, because otherwise it would not be an immobile perception of the eternal but a restlessness, a striving — a dark dissatisfaction contrary to philosophy's proper object and opposed to the ethical, religious, and aesthetic aspiration to attain, in repose, the pure contemplation of that object."}, {"orig": "Estas aproximaciones y distinciones pueden ayudarnos a alcanzar el objeto final de estas páginas que no consiste en formular una apreciación crítica integral sobre la filosofía del siglo XVII sino en fijar el sentido de la idea que le sirvió de norte con los alcances y limitaciones que le eran propios.", "trans": "These approximations and distinctions may help us attain the final aim of these pages, which consists not in formulating an exhaustive critical assessment of seventeenth-century philosophy but in fixing the meaning of the idea that served it as a guiding star, with the scope and limitations proper to it."}, {"orig": "Desde luego la filosofía de la claridad, que marca con un signo de inadmisibilidad todo contenido intelectual o intuitivo que no sea claro, explícito y no contradictorio, carece del sentido de la dinámica interna y, principalmente, de la insondabilidad de lo real. Lo insondable es por esencia oscuro, ya que en la intuición y en la experiencia que le son propias, el objeto intencional no es algo que inmediatamente se ve o se percibe, sino algo que está más allá, como una ausencia que es a la vez una presencia pero indefinible y oscura.", "trans": "To be sure, the philosophy of clarity, which marks with a sign of inadmissibility every intellectual or intuitive content that is not clear, explicit, and non-contradictory, lacks any sense of internal dynamics and, above all, of the unfathomability of the real. The unfathomable is by essence obscure, since in the intuition and experience proper to it, the intentional object is not something immediately seen or perceived but something that lies beyond, like an absence that is at the same time a presence, yet indefinable and obscure."}, {"orig": "Naturalmente que toda aspiración al conocimiento contiene la tendencia a alcanzar la posesión intelectual de su objeto, más propiamente, a su definición conceptual. Pero eso no justifica la descalificación sistemática de todo contenido de conocimiento que resista a una nítida configuración intelectual. Recordemos las verdades del corazón de que habla Pascal y que no pertenecen únicamente a la esfera de la experiencia mística, sino a otras esferas de conocimiento y de vida espiritual como son las de la filosofía y de la contemplación estética.", "trans": "Naturally, every aspiration toward knowledge contains the tendency to achieve intellectual possession of its object — or, more precisely, its conceptual definition. But this does not justify the systematic disqualification of every cognitive content that resists a clear intellectual configuration. Let us recall the truths of the heart of which Pascal speaks, which belong not only to the sphere of mystical experience but to other spheres of knowledge and spiritual life, such as those of philosophy and aesthetic contemplation."}, {"orig": "El principio de la claridad se ha demostrado fecundo y útil como principio metodológico porque combate la pereza, incita al rigor y estimula la honradez y la veracidad intelectuales. Como principio gnoseológico es un principio de apodicticidad que fundamenta la evidencia de las conexiones esenciales. Se ha demostrado pedagógicamente eficaz al promover la elevación espiritual y la iluminación contemplativa de la conducta. Pero es gratuito en cuanto postula una como vocación metafísica de lo real hacia la claridad conceptual, y estrecho en cuanto conduce a la descalificación de las zonas oscuras de la experiencia mística y estética. Finalmente es en exceso abstractivo y dogmático en cuanto inspira la concepción psicológica y ética de la vida afectiva, que tiene sus propios modos de aprehensión, irreductibles a la claridad intelectual.", "trans": "The principle of clarity has proved fruitful and useful as a methodological principle because it combats laziness, encourages rigor, and stimulates intellectual honesty and truthfulness. As a gnoseological principle it is a principle of apodicticity that grounds the evidence of essential connections. It has proved pedagogically effective in promoting spiritual elevation and the contemplative illumination of conduct. But it is gratuitous insofar as it postulates something like a metaphysical vocation of the real toward conceptual clarity, and narrow insofar as it leads to the disqualification of the obscure zones of mystical and aesthetic experience. Finally, it is excessively abstractive and dogmatic insofar as it inspires the psychological and ethical conception of the affective life, which has its own modes of apprehension, irreducible to intellectual clarity."}];

const container = document.getElementById('paras');

function pageMark(num) {
  const span = document.createElement('span');
  span.className = 'page-mark';
  span.textContent = ' [' + num + '] ';
  return span;
}

function snapToWord(text, pos) {
  if (pos <= 0) return 0;
  if (pos >= text.length) return text.length;
  if (text[pos] === ' ') return pos;
  let lo = pos - 1, hi = pos + 1;
  while (lo > 0 && text[lo] !== ' ') lo--;
  while (hi < text.length && text[hi] !== ' ') hi++;
  return (pos - lo <= hi - pos) ? lo : hi;
}

DATA.forEach((d) => {
  const row = document.createElement('div');
  row.className = 'row';

  const orig = document.createElement('p');
  const trans = document.createElement('p');

  if (d.page_mid) {
    const offset = d.mid_offset;
    const origPre  = d.orig.slice(0, offset);
    const origPost = d.orig.slice(offset);
    const ratio = offset / d.orig.length;
    const transOffset = snapToWord(d.trans, Math.round(d.trans.length * ratio));
    const transPre  = d.trans.slice(0, transOffset);
    const transPost = d.trans.slice(transOffset);
    orig.append(origPre, pageMark(d.page_mid), origPost);
    trans.append(transPre, pageMark(d.page_mid), transPost);
  } else {
    orig.textContent  = d.orig;
    trans.textContent = d.trans;
  }

  row.appendChild(orig);
  row.appendChild(trans);
  container.appendChild(row);

  if (d.page_after) {
    const nums = Array.isArray(d.page_after) ? d.page_after : [d.page_after];
    nums.forEach((num) => {
      const marker = document.createElement('div');
      marker.className = 'page-row';
      marker.appendChild(pageMark(num));
      container.appendChild(marker);
    });
  }
});
</script>
