<style>

<script>
const DATA = [{"orig": "III", "trans": "III"}, {"orig": "LENGUAJE Y METAFÍSICA", "trans": "LANGUAGE AND METAPHYSICS"}, {"orig": "Si en alguna esfera de la experiencia, el arcano metafísico de la realidad se hace visible, en cierto modo, sin perder su carácter enigmático, es sin duda en el fenómeno del lenguaje. En el lenguaje, en efecto, podemos aislar tres cosas, a saber: un elemento sensible (audible), un sentido suprasensible al cual, por constituir una forma de existencia en la mente y por oponerse como entidad subsistente y en sí a la apariencia sensible, le llamamos elemento ontológico y por último, una relación entre ambos mediante la cual el fundamento ontológico se hace aprehensible a través de la palabra, del verbo. Si pensamos ahora en qué, al fin y al cabo, el problema metafísico por excelencia consiste en comprender, en intuir la relación entre el ser como fundamento y sentido de la realidad y el aparecer como su expresión, tendremos que concluir que el lenguaje es, en verdad, un fenómeno representativo de la más profunda y misteriosa estructura de la existencia.", "trans": "If there is any sphere of experience in which the metaphysical arcanum of reality becomes visible — in a certain way, without losing its enigmatic character — it is without doubt in the phenomenon of language. In language, indeed, we can isolate three things: a sensible element (audible); a supra-sensible meaning which, by constituting a form of existence in the mind and by opposing itself as a subsistent entity in itself to the sensible appearance, we call the ontological element; and finally, a relation between the two by means of which the ontological ground becomes apprehensible through the word, through the verb. If we now reflect that the metaphysical problem par excellence consists, when all is said and done, in comprehending and intuiting the relation between being as the ground and meaning of reality and appearing as its expression, we must conclude that language is, in truth, a phenomenon representative of the deepest and most mysterious structure of existence."}, {"orig": "Este carácter que llamaríamos ejemplar o representativo del lenguaje por relación al fenómeno del aparecer universal, puede acaso servirnos para inferir, más allá del mero esquematismo de ser y aparecer, mediante la experiencia psicológica de los planos de la apariencia y gracias al estudio del enlace entre sentido y expresión, algo sobre el tránsito del ser al aparecer. El movimiento que va del sentido a la expresión verbal es un movimiento centrífugo. La expresión supone un movimiento centrífugo que va desde una cierta idea o sentimiento del alma a la exterioridad sensible de la palabra. Es un movimiento centrífugo y evolutivo. La comprensión es un movimiento inverso, involutivo y centrípeto, por el cual, más allá de la expresión se busca el sentido originario, el fundamento interior, que nosotros llamamos ontológico de la palabra. Y la dificultad de describir esos movimientos consiste en que aunque contrarios, esos movimientos son complementarios y simultáneos. El hablante se interpreta a sí mismo, se entiende, se oye. El oyente se expresa, en cierta medida a sí mismo en las palabras del hablante. Y así, la emanación del sentido de donde brota la palabra y el retorno al sentido que constituye la comprensión, son por su naturaleza misma y por la profundidad y dificultad de las cuestiones que suscitan, comparables si no idénticos a los pasos metafísicos opuestos e inseparables que la intuición neoplatónica penetró tan profundamente y que no son otros que los de la implicación y la explicación genética de lo real.", "trans": "This character that we would call exemplary or representative of language in relation to the universal phenomenon of appearing may perhaps serve us to infer, beyond the mere schematism of being and appearing, through the psychological experience of the planes of appearance and by means of the study of the link between meaning and expression, something about the passage from being to appearing. The movement from meaning to verbal expression is a centrifugal movement. Expression supposes a centrifugal movement that goes from a certain idea or feeling of the soul to the sensible exteriority of the word. It is a centrifugal and evolutionary movement. Comprehension is the inverse movement — involutive and centripetal — by which, beyond expression, one seeks the originary meaning, the interior ground that we call the ontological foundation of the word. The difficulty in describing these movements lies in the fact that, though contrary, they are complementary and simultaneous. The speaker interprets himself, understands himself, hears himself. The listener, to a certain degree, expresses himself in the speaker's words. And thus the emanation of the meaning from which the word springs and the return to meaning that constitutes comprehension are, by their very nature and by the depth and difficulty of the questions they raise, comparable if not identical to the opposed and inseparable metaphysical steps that Neoplatonic intuition penetrated so profoundly — steps that are none other than the implication and the genetic explanation of the real."}, {"orig": "Mediante la consideración de dos ejemplos nos pondremos en camino de descubrir los tipos generales de enlace entre las significaciones y los signos y luego, junto con la base para una concepción de conjunto sobre la expresión en el lenguaje, la posibilidad de realizar algunas inferencias legítimas sobre el maravilloso fenómeno del aparecer universal.", "trans": "By considering two examples we will set out to discover the general types of link between meanings and signs, and then, together with the basis for an overall conception of expression in language, the possibility of making some legitimate inferences about the marvelous phenomenon of universal appearing."}, {"orig": "Supongamos que nos proponemos aislar el sentido de la estrofa de Jorge Manrique que dice:", "trans": "Let us suppose that we propose to isolate the meaning of the stanza by Jorge Manrique that reads:"}, {"orig": "Nuestras vidas son los rios Que van a dar a la mar Que es el morir.", "trans": "Nuestras vidas son los rios Que van a dar a la mar Que es el morir. [Our lives are the rivers / That flow toward the sea / Which is dying.]"}, {"orig": "Si dijéramos que el sentido de esta estrofa es que \"nuestras vidas terminan con la muerte\" cometeríamos un error, puesto que si Jorge Manrique hubiera querido decir únicamente que nuestras vidas terminan en la muerte, lo habría expresado en esa forma y no fué así, sino que el poeta pensó la vida y el \"morir\" bajo las especies de los ríos y del mar. Vió nuestras vidas como los ríos que van al mar, que es el morir. Sólo en esta forma pudo expresarse su sentimiento de la vida y de la muerte, y de tal modo que no podía cambiar ni quitar una palabra sin que quedase trunco y en consecuencia inexpresado el sentido de la estrofa. De donde concluímos que el sentido no se adhiere exteriormente a la palabra ni se deposita en ella como el vino en la copa, sino que la penetra e informa comunicándose a la totalidad de la expresión y componiendo con ella, por infusión, una sola e indivisible realidad. Se diría que sentido y expresión son dos ideas categoriales que se emplean, respectivamente, para indicar la unidad por relación a la variedad, lo invisible y sólo imaginable por relación a lo visible, lo permanente por relación a lo que puede cambiar. El sentido sería así la unidad, lo invisible, lo permanente, es decir aquello que tiene las calidades que ordinariamente se predican del ser. La expresión sería lo que está sujeto al cambio, lo que al fin y al cabo está incluso en el incontenible fluir de la vida. Y así a la luz de este ejemplo, podríamos afirmar al propio tiempo la distinción lógica y la inseparabilidad de la expresión y del sentido.", "trans": "If we were to say that the meaning of this stanza is that \"our lives end with death,\" we would be making an error, for if Jorge Manrique had wanted to say only that our lives end in death, he would have expressed it in that way; but he did not. Rather, the poet thought of life and \"dying\" under the guise of rivers and the sea. He saw our lives as the rivers that flow to the sea, which is dying. Only in this form could his feeling about life and death be expressed, and in such a way that not a single word could be changed or removed without leaving the stanza truncated and, consequently, its meaning unexpressed. From this we conclude that meaning does not adhere externally to the word, nor is it deposited in it like wine in a cup; rather it penetrates and informs the word, communicating itself to the totality of the expression and composing with it, by infusion, a single and indivisible reality. One might say that meaning and expression are two categorial ideas employed, respectively, to indicate the unity in relation to the variety, the invisible and only imaginable in relation to the visible, the permanent in relation to what can change. Meaning would thus be unity, the invisible, the permanent — that which has the qualities ordinarily predicated of being. Expression would be what is subject to change, what is ultimately caught even in the unstoppable flow of life. And so, in the light of this example, we could affirm simultaneously the logical distinction and the inseparability of expression and meaning."}, {"orig": "Lo que hemos dicho a propósito de la estrofa de Jorge Manrique no basta empero, ni siquiera para el objeto de presentar con claridad al propio tiempo que la distinción esencial, el enlace entre el sentido y la expresión. Porque hay un tipo de expresiones a las que no conviene la descripción que hemos intentado. Tomemos por ejemplo la formula F = ma. Aquí nos damos cuenta de que el sentido hubiese podido ser expresado en otra forma, con otras expresiones. Y que la fórmula, lejos de emanar directamente de un cierto movimiento del alma, implica una operación intelectual dirigida a esquematizar en términos de la más rigurosa simplicidad toda la posible variedad de la experiencia. Y de tal modo estos ejemplos nos hacen presumir que en el lenguaje se dan dos clases de operaciones, equivalentes a dos diversas actitudes intelectuales o más propiamente anímicas: un acto emanatístico o hipostático correspondiente de modo principal a la expresión poética y en el cual se difunde la unidad primitiva del sentido en la varia multiplicidad de la apariencia, y un acto que llamaremos demiúrgico y que reduce a la organización, al esquema, al sistema de formas conceptuales, la incoherente, la caótica e inmediata multiplicidad de las apariencias. Operaciones que acaso corresponden a los dos géneros de energía que Klages descubre en la actividad de la palabra: la simbólica, indicativa de naturaleza cinética y la delimitante, conceptual de naturaleza potencial.", "trans": "What we have said apropos of Manrique's stanza does not suffice, however, even for the purpose of presenting with clarity both the essential distinction and the link between meaning and expression. For there is a type of expression to which the description we have attempted does not apply. Let us take, for example, the formula F = ma. Here we realize that the meaning could have been expressed in another form, with other expressions. And that the formula, far from emanating directly from a certain movement of the soul, implies an intellectual operation directed at schematizing in terms of the most rigorous simplicity all the possible variety of experience. And in this way these examples lead us to presume that in language there occur two kinds of operations, equivalent to two different intellectual — or more properly, psychic — attitudes: an emanatistic or hypostatic act, corresponding chiefly to poetic expression, in which the primitive unity of meaning diffuses itself into the varied multiplicity of appearance; and an act we shall call demiurgic, which reduces the incoherent, chaotic, and immediate multiplicity of appearances to organization, to schema, to a system of conceptual forms. These operations perhaps correspond to the two kinds of energy that Klages discovers in the activity of the word: the symbolic, indicative in nature and kinetic in character, and the delimiting, conceptual and potential in nature."}, {"orig": "Ocupémonos primeramente de la que llamamos operación demiúrgica, reservando para más adelante el estudio de la operación hipostática a la que, por otra parte, concederemos mayor importancia y significación metafísicas.", "trans": "Let us first consider what we call the demiurgic operation, reserving for later the study of the hypostatic operation, to which, moreover, we shall grant greater metaphysical importance and significance."}, {"orig": "La operación demiúrgica, a la que calificamos de este modo recordando al dios platónico que convirtió el caos en cosmos, guiado por la visión de las ideas, realiza una función abstractiva y de estabilización en el dominio heterogéneo y cambiante de la experiencia inmediata. En la multiplicidad cualitativa y variable que llena así el mundo de las imágenes objetivas como el mundo interior de nuestra sensibilidad, la palabra establece ciertas formas comunes, ciertas denominaciones generales que al propio tiempo que sirven a la sistematización teorética, son instrumentos de acción, formas designativas de comunicación y universal inteligibilidad. Los nombres que convienen a una multiplicidad de imágenes o de estados afectivos internos, borran lo que cada una de esas imágenes o de estados tiene de irreductible y único para no retener sino sus caracteres comunes; por otra parte en el incesante, irreversible fluir de la vida interior, el lenguaje fija para siempre, en la forma relativamente invariable del nombre, ciertos modos de ser del alma y les confiere una falsa solidez. Y así puede decir Bergson, en sentencia inatacable desde su punto de vista: \"Luego la palabra de contornos bien definidos, la palabra brutal, que almacena lo que hay de estable, de común y por consiguiente de impersonal en las impresiones de la humanidad, aplasta o por lo menos recubre las impresiones delicadas y fugitivas de nuestra conciencia individual. Para luchar con armas iguales éstas deberían expresarse por palabras precisas; pero estas palabras, apenas formadas, se volverían contra la sensación que les dió nacimiento, e inventadas para certificar que la sensación es inestable, le impondrían su propia estabilidad\".", "trans": "The demiurgic operation — so named in recollection of the Platonic god who turned chaos into cosmos, guided by the vision of the Ideas — performs an abstractive and stabilizing function in the heterogeneous and changing domain of immediate experience. In the qualitative and variable multiplicity that fills both the world of objective images and the interior world of our sensibility, the word establishes certain common forms, certain general designations which, while serving theoretical systematization, are at the same time instruments of action, designative forms of communication and universal intelligibility. The names that apply to a multiplicity of images or internal affective states erase what each of those images or states has that is irreducible and unique, retaining only their common characters; moreover, in the incessant, irreversible flow of inner life, language fixes forever, in the relatively invariable form of the name, certain modes of being of the soul and confers upon them a false solidity. And so Bergson can say, in a sentence unassailable from his point of view: \"Thus the word with well-defined outlines, the brutal word, which stores up what is stable, common, and consequently impersonal in the impressions of humanity, overwhelms, or at least covers over, the delicate and fugitive impressions of our individual consciousness. To struggle with equal weapons, these should be expressed by precise words; but these words, as soon as they are formed, would turn against the sensation that gave them birth, invented as they were to certify that the sensation is unstable, they would impose their own stability upon it.\""}, {"orig": "Esta función clasificatoria y estabilizadora del lenguaje obedece, ora a una necesidad pragmática de carácter eminentemente social, ora a una intención teorética. La necesidad de comunicación interindividual impone sin duda una cierta despersonalización del contenido anímico que se comunica y requiere la creación de signos capaces de circular como la moneda. La intención teorética persigue, en primer término un ideal de claridad y distinción y por eso introduce en la materia más o menos confusa y caótica de las apariencias, separaciones y agrupamientos susceptibles de denominaciones simples, y en segundo término, la intención teorética, al buscar los fundamentos o las esencias efectúa un trabajo de reducción que elimina las particularidades accidentales para retener únicamente lo sustancial, que designa con un nombre. Hay filósofos para quienes, genéticamente, la actitud pragmática es anterior a la actitud especulativa, y según los cuales los conceptos (y en consecuencia los términos que los expresan) se darían primitivamente más como direcciones para la actividad práctica que como referencias a la estructura ontológica de lo real. Sea lo que fuere, la actitud demiúrgica al propio tiempo que ordena, inmoviliza; y en cualquiera de sus direcciones, pragmática o especulativa, es siempre programática, impersonal y hostil a la variedad concreta y a la movilidad creadora de la vida.", "trans": "This classificatory and stabilizing function of language obeys, on one hand, a pragmatic need of an eminently social character, and on the other, a theoretical intention. The need for inter-individual communication doubtless imposes a certain depersonalization of the psychic content that is communicated and requires the creation of signs capable of circulating like currency. The theoretical intention pursues, in the first place, an ideal of clarity and distinction, and for this reason introduces into the more or less confused and chaotic material of appearances separations and groupings susceptible to simple designations; and in the second place, the theoretical intention, in seeking grounds or essences, performs a work of reduction that eliminates accidental particularities in order to retain only the substantial, which it designates with a name. There are philosophers for whom, genetically speaking, the pragmatic attitude is prior to the speculative attitude, and according to whom concepts (and consequently the terms that express them) would originally arise more as directions for practical activity than as references to the ontological structure of the real. Be that as it may, the demiurgic attitude, at the same time as it orders, immobilizes; and in any of its directions, pragmatic or speculative, it is always schematic, impersonal, and hostile to the concrete variety and creative mobility of life."}, {"orig": "La tendencia del lenguaje, en este aspecto de su actividad, es al esquematismo más extremado y a la economía más rigurosa en la expresión, todo lo cual conduce a la instauración de un absoluto convencionalismo en la adopción y en el manejo de los signos. Basta pensar en el lenguaje matemático para darse cuenta así de la tendencia como de los resultados de este tipo de actividad en el lenguaje. Y si se quiere mayor ilustración, piénsese en algunas fórmulas lógicas como, por ejemplo, en las famosas combinaciones verbales Bárbara, Celarent, Darii, Ferio etc. Hasta en la disciplina del derecho se tiende a una especie de figuración algebraica de las relaciones jurídicas. El esquematismo y la economía que caracteriza este tipo de actividad lingüística han originado la tendencia moderna a formar palabras que condensan una frase o una serie de nombres mediante la unión de sus iniciales, resultando a veces horribles combinaciones que generalmente adquieren circulación internacional y que así revelan la tendencia cosmopolita del lenguaje conceptual, al que acaso con cierta impropiedad pero justificadamente en el fondo hemos llamado demiúrgico. Ejemplos: SCIPA, COSACH, FIFA. Es la paradógica orgía del esquema y del convencionalismo, o, si se prefiere, la tiranía del signo bajo cuyo imperio la realidad concreta de las cosas y de las imágenes se disipa y se pierde.", "trans": "The tendency of language, in this aspect of its activity, is toward the most extreme schematism and the most rigorous economy in expression, all of which leads to the establishment of an absolute conventionalism in the adoption and handling of signs. One need only think of mathematical language to perceive both the tendency and the results of this type of linguistic activity. And for greater illustration, consider some logical formulas — for example, the famous verbal combinations Barbara, Celarent, Darii, Ferio, etc. Even in the discipline of law there is a tendency toward a kind of algebraic figuration of legal relations. The schematism and economy that characterize this type of linguistic activity have given rise to the modern tendency to form words that condense a phrase or a series of names by joining their initials, resulting at times in horrible combinations that generally acquire international currency and thus reveal the cosmopolitan tendency of conceptual language — which we have, with some impropriety but not without justification, called demiurgic. Examples: SCIPA, COSACH, FIFA. It is the paradoxical orgy of schema and conventionalism, or, if one prefers, the tyranny of the sign under whose sway the concrete reality of things and images dissipates and is lost."}, {"orig": "Lo cual no atañe empero ni a la importancia intrínseca del lenguaje conceptual ni a su significación en el ámbito de la gnoseología y de la lógica. En efecto el lenguaje, ejercitándose en la dirección conceptual no sólo delimita, fija y por decirlo así, acuña los signos trasmisibles del pensamiento, sino que gracias a sus leyes morfológicas y a las que rigen las relaciones entre el sentido y la expresión, pone en transparencia, dibuja, hace sensible la estructura, el esqueleto formal de la inteligencia, y revela, además, las posibilidades de referencia intencional entre el pensamiento y los objetos.", "trans": "This, however, does not diminish the intrinsic importance of conceptual language nor its significance in the domains of epistemology and logic. For language, operating in the conceptual direction, not only delimits, fixes, and — so to speak — mints the transmissible signs of thought; it also, thanks to its morphological laws and those governing the relations between meaning and expression, renders transparent, draws, makes sensible the structure, the formal skeleton of intelligence, and reveals, moreover, the possibilities of intentional reference between thought and objects."}, {"orig": "Las profundas investigaciones de Husserl sobre la significación y sobre las leyes a priori que rigen el enlace de las significaciones cuando se organizan en una unidad de sentido, se refieren al tipo de actividad lingüística que denominamos demiúrgica y que conviene al aspecto meramente intelectual, lógico y abstractivo del espíritu.", "trans": "Husserl's profound investigations into signification and the a priori laws that govern the linking of significations when they are organized into a unity of meaning refer to the type of linguistic activity we call demiurgic, which is proper to the merely intellectual, logical, and abstractive aspect of the mind."}, {"orig": "Las significaciones en su enlace, obedecen a leyes derivadas de la propia esencia del significar y que, con prescindencia de la materia significada, se fundan en la forma o sea en el papel, en la categoría gramatical de la significación. De donde se deriva según Husserl \"el gran problema igualmente fundamental para la lógica y para la gramática de establecer esta constitución a priori que envuelve el reino de las significaciones y de investigar, 'en una morfología de las significaciones' el sistema a priori de las estructuras formales, esto es de las estructuras que prescinden de toda particularidad material de la significación\".", "trans": "Significations in their linkage obey laws derived from the very essence of signifying which, setting aside the signified matter, are grounded in form — that is, in the role, in the grammatical category of signification. From this is derived, according to Husserl, \"the great problem equally fundamental for logic and for grammar: to establish the a priori constitution that governs the realm of significations and to investigate, 'in a morphology of significations,' the a priori system of formal structures, that is, of structures that dispense with every material particularity of signification.\""}, {"orig": "En este empeño llega Husserl a la concepción de una lógica-gramática pura que establecería algo así como el \"esquema ideal\" del lenguaje y sería el común fundamento esencial y no empírico de todas las lenguas. Síntesis a priori, morfología de las figuras, no accidentales ni locales sino esenciales y necesarias del enlace de las significaciones en unidad de sentido.", "trans": "In this endeavor Husserl arrives at the conception of a pure logical grammar that would establish something like the \"ideal schema\" of language, which would be the common essential and non-empirical foundation of all languages. An a priori synthesis, a morphology of forms — not accidental or local, but essential and necessary — of the linking of significations in a unity of meaning."}, {"orig": "En el curso de sus admirables desarrollos Husserl dice lo siguiente que, por su proyección extralógica, interesa de modo especial al objeto de nuestro estudio: \"La esfera de la significación es mucho más amplia que la de la intuición, esto es, que la esfera total de los cumplimientos posibles\", es decir, aclaramos nosotros, que la esfera de los correlatos objetivos, reales de las significaciones. Prolongando este pensamiento a la esfera ontológica diríamos que es como si la apariencia se desprendiese del ser de los objetos y se constituyese en un mundo vacío, en un mundo de ilaciones falaces cuyos miembros aluden sin duda a los objetos de la intuición pero que, en su conjunto, forman complejos sin sentido unitario, algo menos que absurdos pero que se dan dentro de las normas de la legalidad sintáctica. A este conjunto de formas desprovistas de sentido unitario creemos que le corresponde propiamente la categoría de irrealidad y no, como suele sostenerse, contrariando el profundo sentido de la tradición platónica, al mundo de los objetos ideales.", "trans": "In the course of his admirable developments, Husserl says the following which, by its extra-logical projection, is of special interest to our study: \"The sphere of signification is much wider than that of intuition, that is, than the total sphere of possible fulfillments\" — meaning, we clarify, the sphere of the objective, real correlates of significations. Extending this thought to the ontological sphere, we would say it is as if appearance were to detach itself from the being of objects and constitute itself in an empty world, in a world of fallacious inferences whose members no doubt allude to the objects of intuition but which, taken together, form complexes without unitary meaning — something less than absurd, yet occurring within the norms of syntactic legality. To this set of forms devoid of unitary meaning we believe the category of unreality properly belongs — not, as is usually maintained, in contradiction of the deep sense of the Platonic tradition, to the world of ideal objects."}, {"orig": "En resumen el lenguaje, en cuanto instrumento de conceptualización, desempeña en la economía del mundo anímico el mismo papel que representan en el torrente del devenir universal, las fuerzas de estabilización, que instituyen ciertas constancias, ciertas uniformidades. Y como sintaxis el lenguaje es sin duda una manifestación particular del imperio universal de la forma, es decir de todas las posibilidades de la energía a configurarse y a organizarse según modos de coherencia y de inteligibilidad. Por todo lo cual, acaso, Platón en el Cratilo, atribuía al legislador la obra de nombrar los objetos con nombres que al propio tiempo que expresasen (imitasen) su esencia, indicasen su función en el sistema de relaciones que constituyen el mundo y la vida.", "trans": "In summary, language, as an instrument of conceptualization, plays the same role in the economy of the psychic world as do the forces of stabilization in the torrent of universal becoming — forces that institute certain constancies, certain uniformities. And as syntax, language is without doubt a particular manifestation of the universal empire of form, that is, of all the possibilities for energy to configure and organize itself according to modes of coherence and intelligibility. For all these reasons, it was perhaps that Plato in the Cratylus attributed to the lawgiver the work of naming objects with names that, at the same time as they expressed (imitated) their essence, would indicate their function in the system of relations that constitute the world and life."}, {"orig": "Llamamos operación hipostática aquella en que el sentido en sí mismo invisible, suprasensible desciende a encarnarse y configurarse en la palabra. Y la llamamos así por analogía con el paso metafísico que los neoplatónicos denominaban emanación hipostática y en el cual el Uno, sin dejar de ser uno, se transladaba a la alteridad intelectual, y la inteligencia universal se comunicaba y transfundía en el alma. Así el sentido se realiza a través de los distintos planos de la expresión y, sin dejar de ser lo que es, se configura y aparece. Con esto quizá reanudamos una antiquísima tradición, ya que algunos viejos cosmólogos, para aludir a la inteligencia que ordena, gobierna y configura el universo, hablaban de la sintaxis cósmica, expresando así con una sola palabra la estructura sintética y la calidad expresiva de la actividad universal.", "trans": "We call hypostatic operation that in which meaning — in itself invisible, supra-sensible — descends to incarnate and configure itself in the word. We call it so by analogy with the metaphysical step that the Neoplatonists called hypostatic emanation, in which the One, without ceasing to be one, transferred itself to intellectual otherness, and universal intelligence communicated and transfused itself into the soul. Thus meaning is realized through the distinct planes of expression and, without ceasing to be what it is, configures itself and appears. In this we perhaps renew a most ancient tradition, since some early cosmologists, to allude to the intelligence that orders, governs, and configures the universe, spoke of cosmic syntax, expressing in a single word both the synthetic structure and the expressive quality of universal activity."}, {"orig": "Pero quizá esta analogía puede ser desarrollada con beneficio para la comprensión del gran misterio del lenguaje. La serie de hipóstasis o de emanaciones hipostáticas que van del Uno a la inteligencia y de ésta al alma la cual a su vez configura e informa el mundo material, se integra con un movimiento inverso que vuelve por la vía de la negación y de la eminencia al ser y al Uno. Procesión y retorno se llaman respectivamente estos movimientos y son comparables a los movimientos de expresión y captación de sentido en el lenguaje. Pero hay algo más, porque la procesión y el retorno cósmicos que no son movimientos separados sino complementarios aunque opuestos, nos dan la concepción metafísica en que mejor se expresa, sin duda, la relación de implicación y oposición de la aparición y del sentido.", "trans": "But perhaps this analogy may be developed with profit for understanding the great mystery of language. The series of hypostases or hypostatic emanations that go from the One to intelligence and from the latter to the soul — which in turn configures and informs the material world — is integrated with an inverse movement that returns by way of negation and eminence to being and to the One. Procession and return are the names respectively given to these movements, and they are comparable to the movements of expression and apprehension of meaning in language. But there is something more: because the cosmic procession and return, which are not separate but complementary though opposite movements, give us the metaphysical conception in which the relation of implication and opposition between appearance and meaning is, without doubt, best expressed."}, {"orig": "Estudiando esta que llamamos operación hipostática, vemos que el lenguaje no tiene por única función la de transmitir o entender órdenes, o la de clasificar los objetos, o la de dirigir como un semáforo el tránsito en medio de la confusa movilidad de la vida. Parece por el contrario, que el lenguaje tiene además la función de manifestar sin intención ordinatoria ni utilitaria, el contenido interior del alma. Manifestar, es decir revelar el contenido implícito de la vida no sólo a los demás sino a los propios ojos de la propia conciencia, como un destello, o una fulguración o un reflejo particular del fenómeno universal del aparecer.", "trans": "Studying what we call the hypostatic operation, we see that language does not have as its sole function the transmitting or comprehending of orders, or the classifying of objects, or the directing of traffic — like a traffic light — in the midst of the confused mobility of life. It appears, on the contrary, that language has also the function of manifesting, without any ordinative or utilitarian intention, the interior content of the soul. To manifest — that is, to reveal the implicit content of life not only to others but to the very eyes of one's own consciousness — as a flash, a radiance, or a particular reflection of the universal phenomenon of appearing."}, {"orig": "Tratemos ahora, de aproximarnos al proceso en que este contenido interno que es el sentido, se configura en la palabra.", "trans": "Let us now seek to approach the process by which this internal content, which is meaning, configures itself in the word."}, {"orig": "Conocemos pocos intentos verdaderamente profundos de descripción del tránsito del sentido a la imagen y de la imagen a la palabra. Acaso porque esta descripción es por todo extremo difícil y tal vez imposible ya que estas categorías: sentido, imagen, palabra, más que momentos históricos, etapas separadas de la procesión expresiva son momentos ideales, aspectos de una realidad indivisible. El sentido es a la vez anterior y final. Precede y preside las fases de la evolución expresiva y también las corona, porque aparece como un resultado, como un brote supra-sensible de la expresión acabada. Y es inmanente y trascendente. Es inmanente, interno y hasta consustancial a todos los elementos de la frase o del discurso. Pero los trasciende, y por encima de ellos existe y subsiste en sí aunque no sea posible definirlo. Como el ser que no se agota ni disuelve en la infinita variedad de las apariencias, pero que no podemos aprehender ni definir en la pura, absoluta desnudez de su esencia.", "trans": "We know of few truly profound attempts to describe the passage from meaning to image and from image to word. Perhaps because this description is in every respect extremely difficult and perhaps even impossible, since these categories — meaning, image, word — are less historical moments, separate stages of the expressive procession, than ideal moments, aspects of an indivisible reality. Meaning is at once prior and final. It precedes and presides over the phases of expressive evolution and also crowns them, for it appears as a result, as a supra-sensible sprout of the finished expression. And it is both immanent and transcendent. It is immanent, internal, and even consubstantial with all the elements of the phrase or discourse. But it transcends them, and above them it exists and subsists in itself, even though it cannot be defined. Like being, which neither exhausts nor dissolves itself in the infinite variety of appearances, yet which we cannot apprehend or define in the pure, absolute nakedness of its essence."}, {"orig": "Para hablar en lenguaje aristotélico diremos que hay una forma final que precede, preside, orienta y al fin se encarna en el movimiento configurativo de la mente, del mismo modo que la forma final de la flor y del fruto preside las fases del devenir biológico de la planta. No debemos olvidar sin embargo una cosa a saber: Que el movimiento configurador del lenguaje es creador en el sentido de que la expresión no sólo manifiesta y traduce sino que también suscita y produce. La forma y el acto preexisten en cierta medida pero algo nuevo e imprevisible surge luego en cours de route. Sin que nada empero rompa la filiación del todo por respecto a la primitiva entidad del sentido.", "trans": "To speak in Aristotelian language: there is a final form that precedes, presides over, orients, and at last incarnates itself in the configurative movement of the mind, in the same way that the final form of the flower and the fruit presides over the phases of the biological development of the plant. We must not forget one thing, however: that the configurative movement of language is creative in the sense that expression not only manifests and translates but also evokes and produces. Form and act pre-exist to a certain degree, but something new and unforeseeable emerges later en cours de route, without anything, however, breaking the filiation of the whole with respect to the primitive entity of meaning."}, {"orig": "Las finas y profundas observaciones de Bergson en \"L'Intuition Philosophique\" sobre la simplicidad de las intuiciones primordiales de los grandes filósofos y la complicación más o menos considerable del aparato verbal, configurativo y técnico en que esa intuición simple se traduce, perdiéndose a veces y reencontrándose otras en el zigzag de la exposición, nos ilustran sobre la tensión entre la intención de sentido y la expresión, y la doctrina bergsoniana del esquema dinámico, aristotélica en el fondo, nos instruye sobre el proceso evolutivo del contenido psíquico que tiende a exteriorizarse mediante la palabra. El tránsito del sentido a la expresión aparece en estos estudios como algo comparable a la proyección luminosa en la cual, a partir de un foco donde existen las figuras de la aparición como meras virtualidades, se expande y difunde el sentido encarnándose en formas cada vez más definidas hasta llegar al plano final en que, como en la pantalla de los cinematógrafos, adquieren realidad y aparecen las figuras implicadas en la intención originaria.", "trans": "Bergson's subtle and profound observations in \"L'Intuition Philosophique\" on the simplicity of the primordial intuitions of the great philosophers and the more or less considerable complication of the verbal, configurative, and technical apparatus in which that simple intuition is translated — sometimes losing itself and at other times rediscovering itself in the zigzag of exposition — illuminate the tension between the intentionality of meaning and expression. The Bergsonian doctrine of the dynamic schema, Aristotelian at bottom, instructs us on the evolutionary process of psychic content that tends to exteriorize itself through the word. The passage from meaning to expression appears in these studies as something comparable to a luminous projection in which, from a focal point where the figures of appearing exist as mere virtualities, meaning expands and diffuses itself, incarnating in ever more defined forms until it reaches the final plane where, as on the cinema screen, the figures implied in the original intention acquire reality and appear."}, {"orig": "En esta primera aproximación nos hemos ocupado del lenguaje, principalmente, como expresión del contenido representativo de la mente: ideas, imágenes y sus relaciones. No hemos considerado el lenguaje como signo expresivo de la emoción. No sólo de aquellas emociones que se acompañan de signos somáticos, como el miedo o la cólera, sino de aquellas otras más vagas, acaso más profundas, más sutiles y delicadas, que parecen rebeldes a toda definición y en consecuencia a toda expresión. No nos hemos ocupado de la poesía que es por excelencia el órgano expresivo de la emoción, ya que en ella se manifiestan los más sutiles, los más subjetivos, los más delicados matices de la vida afectiva; se manifiestan y propagan como si el configurarse no fuera únicamente un acto destinado a la comprensión y captación del sentido por el oyente, sino un medio de transmisión y de contagio destinado a hacer que el oyente no sólo comprenda sino que participe en una cierta onda, en una cierta corriente o marea de la vida del alma.", "trans": "In this first approach we have occupied ourselves with language principally as expression of the representative content of the mind: ideas, images, and their relations. We have not considered language as an expressive sign of emotion — not only of those emotions that are accompanied by somatic signs, such as fear or anger, but of those others more vague, perhaps deeper, more subtle and delicate, that seem resistant to all definition and consequently to all expression. We have not dealt with poetry, which is par excellence the expressive organ of emotion, for in it are manifested the most subtle, the most subjective, the most delicate nuances of affective life — they are manifested and propagated as if the act of configuring were not solely an act destined for the listener's comprehension and apprehension of meaning, but a means of transmission and contagion intended to make the listener not merely understand but participate in a certain wave, a certain current or tide of the life of the soul."}, {"orig": "Y he aquí como esta propiedad del lenguaje —como vehículo y expresión de la vida afectiva— nos conduce a formular algunas breves consideraciones sobre la fantasía poética, entendida como la actividad del alma encaminada por modo principal, a configurar, transmitir, y continuar la corriente emocional de la vida.", "trans": "And this is how this property of language — as vehicle and expression of affective life — leads us to formulate some brief considerations on poetic imagination, understood as the activity of the soul directed principally toward configuring, transmitting, and sustaining the emotional current of life."}, {"orig": "Si un hombre entusiasta dice: \"¡que admirable!\" o si un novelista escribe \"Juan tuvo miedo\", todo el mundo capta de inmediato el sentido de estas frases, pero es evidente que si se prescinde de las circunstancias en un caso y del contexto en el otro estas frases contienen una significación meramente abstracta. Indican que los sujetos de ambas oraciones experimentan una cierta emoción, cuya esencia universal es definible conceptualmente y, por lo tanto, la misma para todos los seres humanos. Ni expresan la admiración concreta de X ni el miedo intransferible de Juan, y además no nos permiten participar emocionalmente en estos estados anímicos ni con la participación real que Scheler llamaría Einsfühlung, ni con la participación estética que Lipps llamaría Einfühlung.", "trans": "If an enthusiastic person exclaims \"how admirable!\" or if a novelist writes \"John was afraid,\" everyone immediately grasps the meaning of these phrases; but it is evident that if one disregards the circumstances in the one case and the context in the other, these phrases contain a merely abstract signification. They indicate that the subjects of both sentences experience a certain emotion whose universal essence is conceptually definable and therefore the same for all human beings. They express neither the concrete admiration of X nor the non-transferable fear of John, and moreover they do not allow us to participate emotionally in these psychic states — neither with the real participation that Scheler would call Einsfühlung, nor with the aesthetic participation that Lipps would call Einfühlung."}, {"orig": "¿Qué condiciones debe llenar la expresión para ser realmente la expresión de un sentimiento, de una emoción del alma, y para suscitar, junto con la participación afectiva, el misterioso encanto de la poesía que no es al fin y al cabo sino el encanto de la expresión lograda o más exactamente de la expresión que a través de la magia de su color o de su música, nos entrega vivo y palpitante el sentido?", "trans": "What conditions must expression fulfill in order truly to be the expression of a feeling, of an emotion of the soul, and in order to evoke — along with affective participation — the mysterious enchantment of poetry, which is, when all is said and done, nothing other than the enchantment of achieved expression, or more precisely of expression that, through the magic of its color or its music, delivers meaning to us vivid and palpitating?"}, {"orig": "Nos parece que estas condiciones son de tres clases: imaginativas, sintácticas y fonéticas.", "trans": "It seems to us that these conditions are of three kinds: imaginative, syntactic, and phonetic."}, {"orig": "Parece ser que la primera condición de la poesía consiste en que el sentimiento se encarne en imágenes. Lo cual no significa que la imágen sea un signo indirecto de la emoción sino al contrario, que comparable al gesto expresivo, sea su cuerpo visible, de tal modo que el sentimiento expresado y la imágen expresiva aparezcan como la única apariencia posible de la emoción manifestada. Las imágenes, y en general las formas expresivas, pueden expresar el sentimiento de dos maneras: o bien la imágen es una hipóstasis directa, inmediata del sentimiento, o bien es algo así como la proyección cinética de la emoción. Ejemplo del primer caso pueden ser los versos tan conocidos de Verlaine:", "trans": "It would appear that the first condition of poetry consists in the feeling's being incarnated in images. This does not mean that the image is an indirect sign of the emotion; on the contrary, comparable to the expressive gesture, it is the emotion's visible body, in such a way that the expressed feeling and the expressive image appear as the only possible appearance of the manifested emotion. Images, and in general expressive forms, can express feeling in two ways: either the image is a direct, immediate hypostasis of the feeling, or it is something like the kinetic projection of the emotion. Examples of the first kind are the well-known lines by Verlaine:"}, {"orig": "Il pleure dans mon coeur Comme il pleut sur la ville.", "trans": "Il pleure dans mon coeur Comme il pleut sur la ville. [It weeps in my heart / As it rains over the city.]"}, {"orig": "O los versos de Nietzsche:", "trans": "Or the lines by Nietzsche:"}, {"orig": "Tag meines Lebens' Gen Abend geht's...", "trans": "Tag meines Lebens' Gen Abend geht's... [The day of my life / Moves toward evening...]"}, {"orig": "Para aclarar lo que acabamos de decir cuando hablamos de proyección cinética del sentimiento como forma expresiva de la emoción, pensemos en el \"no\" que proferimos ante una noticia desagradable. Este es un no que no niega la existencia del suceso ingrato sino que lo rechaza. Otro ejemplo: el famoso soneto atribuido a Santa Teresa de Ávila expresa el amor como causa y a la vez como efecto de los movimientos del alma suscitados por la visión del sacrificio y la muerte de Jesús.", "trans": "To clarify what we have just said when we speak of the kinetic projection of feeling as an expressive form of emotion, let us think of the \"no\" we utter in response to an unpleasant piece of news. This is a no that does not deny the existence of the unwelcome event but rejects it. Another example: the famous sonnet attributed to Saint Teresa of Ávila expresses love as both the cause and the effect of the movements of the soul aroused by the vision of Christ's sacrifice and death."}, {"orig": "Considerando ahora el aspecto meramente verbal de la expresión afectiva se presentan a nuestra atención dos aspectos del lenguaje que se conjugan convergen y conspiran a la eficacia de la manifestación comunicativa del sentimiento, a saber: el aspecto sintáctico y el aspecto fonético de la expresión.", "trans": "Considering now the purely verbal aspect of affective expression, two aspects of language present themselves to our attention: they converge and conspire toward the effectiveness of the communicative manifestation of feeling, namely the syntactic aspect and the phonetic aspect of expression."}, {"orig": "En cuanto al aspecto sintáctico, gramáticos y lingüistas asientan en primer término que en el lenguaje afectivo se perturba o desaparece el orden lógico, la estructura estrictamente gramatical de la expresión o de la frase. Es el anacoluto, desórden aparente; es la interrupción, repercusión cinética de la violencia interna. Según Vendryes mientras en la lengua escrita —que se supone no afectiva— el orden es de subordinación, en la hablada —afectiva— es de yuxtaposición. De yuxtaposición en las cláusulas, con acentuación en los movimientos dominantes y atenuación u oscurecimiento de las relaciones meramente conceptuales o lógicas. Los lingüistas señalan la reduplicación o repetición de las palabras como medio de acentuar la ascensión de la onda afectiva. Repetición, reiteración en que se anuncia ya el gran fenómeno universal y poético del ritmo. En fin, hablan (Bally) de los juegos, transposiciones y figuras gramaticales en que se transparenta la actividad a la vez intelectual e ilógica del lenguaje afectivo.", "trans": "As regards the syntactic aspect, grammarians and linguists establish first of all that in affective language the logical order — the strictly grammatical structure of the expression or phrase — is disturbed or disappears. It is the anacolutha, apparent disorder; it is interruption, the kinetic repercussion of internal violence. According to Vendryes, while in the written language — presumed non-affective — the order is one of subordination, in spoken language — affective — it is one of juxtaposition. Juxtaposition in clauses, with emphasis on the dominant movements and attenuation or obscuring of merely conceptual or logical relations. Linguists point to the reduplication or repetition of words as a means of accentuating the rise of the affective wave — repetition, reiteration, in which the great universal and poetic phenomenon of rhythm already announces itself. Finally, (Bally) speaks of the plays, transpositions, and grammatical figures in which the simultaneously intellectual and illogical activity of affective language becomes transparent."}, {"orig": "En lo que se refiere al aspecto fonético hay una evidente relación de continuidad vital entre el sonido de la palabra y el fondo emocional y la imagen cargada de afectividad que ella expresa. Una relación misteriosa en la cual influye sin duda, en cierta medida, el hecho de que el hábito establezca una cierta asociación automática entre un determinado sonido y una significación más o menos precisa; pero en la que hay algo más: una indefinible acción mágica de la palabra sobre el alma, acción a cuyo influjo se suscita en el oyente un movimiento afín o idéntico al movimiento verbal que hiere las cuerdas de su sensibilidad. \"Como el sonido de una lira, diría Plotino, que hace vibrar simpáticamente otra lira\". Por lo cual afirmamos que existe una eficacia del sonido verbal que no se reduce ni a la asociación habitual entre el signo y la cosa ni tampoco al efecto de las llamadas asociaciones ideofónicas, o sea a la analogía acústica entre la palabra y las características físicas del objeto representado. Debiendo tenerse en cuenta a este respecto que la llamada armonía imitativa u onomatopeya reproduce, según la observación de Klages, más bien ruidos que sonidos propiamente dichos.", "trans": "Regarding the phonetic aspect, there is an evident relation of vital continuity between the sound of the word and the emotional ground and the affectively charged image it expresses. A mysterious relation in which is doubtless operative, to some degree, the fact that habit establishes a certain automatic association between a given sound and a more or less precise signification; but in which there is something more: an indefinable magical action of the word upon the soul, an action whose influence arouses in the listener a movement kindred to or identical with the verbal movement that strikes the chords of their sensibility. \"Like the sound of a lyre,\" Plotinus would say, \"that makes another lyre vibrate sympathetically.\" We therefore affirm that there exists an efficacy of verbal sound that is reducible neither to the habitual association between sign and thing, nor to the effect of so-called ideo-phonic associations — that is, the acoustic analogy between word and the physical characteristics of the object represented. It must be borne in mind in this regard that what is called imitative harmony or onomatopoeia reproduces, according to Klages's observation, sounds that are more like noises than sounds properly so called."}, {"orig": "La eficacia del sonido como vehículo y suscitador de emoción es mucho más sutil e indefinible. Deriva de alguna relación inexplorada entre la vibración física y el alma, relación en que a ciertos sonidos corresponden ciertas actitudes o estados anímicos, independientemente de la semejanza entre el sonido verbal y el sonido natural que representa. Se diría que existe una armonía preestablecida entre la melodía de las palabras y la oscilación de la vida interior.", "trans": "The efficacy of sound as a vehicle and evoker of emotion is far more subtle and indefinable. It derives from some unexplored relation between physical vibration and the soul — a relation in which certain sounds correspond to certain attitudes or psychic states, independently of any resemblance between the verbal sound and the natural sound it represents. One might say that there exists a pre-established harmony between the melody of words and the oscillation of interior life."}, {"orig": "Tomándolo de un viejo libro de literatura y modificándolo al influjo de observaciones personales, presentamos el siguiente esquema de correlación anímico-fonética de las vocales:", "trans": "Drawing from an old book of literary criticism and modifying it in the light of personal observation, we present the following schema of psychic-phonetic correlation among the vowels:"}, {"orig": "La A expresa y suscita sentimientos de calma, de plenitud, de elevación y también de extático transporte ante lo sublime: casa, alma, ala, palabra, etc.", "trans": "A expresses and evokes feelings of calm, of fullness, of elevation, and also of ecstatic transport before the sublime: casa [house], alma [soul], ala [wing], palabra [word], etc."}, {"orig": "La O es una vocal que tiene un cierto aliento cósmico. Es la vocal del Todo, y en la melodía de las palabras suscita una sensación de abundancia, de grandeza, de inmensidad: sol, todo, globo, colmo, cosmos, etc.", "trans": "O is a vowel with a certain cosmic breath. It is the vowel of the Whole, and in the melody of words it evokes a sensation of abundance, grandeur, immensity: sol [sun], todo [all], globo [globe], colmo [fullness], cosmos, etc."}, {"orig": "La E es vocal estética y leve, esencialmente eufónica dicen los gramáticos. Comunica su dulzura a los nombres femeninos en que abunda: Elena, Ester, etc.", "trans": "E is an aesthetic and light vowel, essentially euphonic, say the grammarians. It communicates its sweetness to feminine names in which it abounds: Elena, Ester, etc."}, {"orig": "La I es vocal aguda, dinámica; expresa impulso, exceso con una tendencia a lo agudo y estridente como grito, chillido o ilimitada posibilidad como infinito y también sutileza, delicada pequeñez como en hilo y cierta precisión cortante como en incidente, incisivo etc.", "trans": "I is a sharp, dynamic vowel; it expresses impulse, excess, with a tendency toward the acute and strident — as in grito [cry], chillido [shriek] — or unlimited possibility, as in infinito [infinite]; and also subtlety, delicate smallness, as in hilo [thread], and a certain cutting precision, as in incidente [incident], incisivo [incisive], etc."}, {"orig": "La U es vocal oscura y profunda. Viene del misterioso abismo metafísico. Es ontológica y mística: profundo, tumba, túmulo, duda. Y por ser abismática y profunda, es humilde con la profunda humildad del humus que es la tierra vegetal, la eterna y maternal posibilidad de la vida. Si quisiéramos fantasear un poco, diríamos que la U es órfica, porque en la hondura de su sonido parece que se reunieran los extremos polares de la vida y de la muerte: la cuna y la tumba. Es interesante igualmente recordar a propósito de la U las palabras alemanes de tan hondo sentido: Ur, Grund y Ursprung.", "trans": "U is a dark and deep vowel. It comes from the mysterious metaphysical abyss. It is ontological and mystical: profundo [deep], tumba [tomb], túmulo [tumulus], duda [doubt]. And being abysmal and deep, it is humble with the profound humility of humus — the vegetable earth, the eternal and maternal possibility of life. If we were to allow ourselves a flight of fancy, we would say that U is Orphic, because in the depth of its sound the polar extremes of life and death seem to gather: the cradle and the tomb. It is also interesting to recall, in connection with U, those German words of such deep resonance: Ur, Grund, and Ursprung."}, {"orig": "Según Hermann Wirth, en el cosmos y en el hombre la vocal A nacería del asombro ante el advenimiento primaveral; en el verano, saludando el apogeo de la luz estival, surgirían apasionadamente la E y la I; en el otoño la O y en el invierno la U con que el hombre y el mundo se reintegran al seno de lo oscuro y profundo. Y de esta suerte a la luz de estos ejemplos podría quizá afirmarse que en el mero sonido, en los simples fonemas como tales existiría una cierta alusión al fondo metafísico de las cosas y al esplendor del aparecer. Y así finalmente se diría que el sonido de la expresión hablada constituye la primera zona de confluencia o de interpenetración entre las potencias de la naturaleza y la conmoción interior del alma.", "trans": "According to Hermann Wirth, in the cosmos and in the human being the vowel A would be born from wonder at the advent of spring; in summer, hailing the apex of the estival light, E and I would arise passionately; in autumn O; and in winter U, with which the human being and the world reintegrate themselves into the womb of the dark and the deep. And in this light, from these examples, one might perhaps affirm that in mere sound, in simple phonemes as such, there would exist a certain allusion to the metaphysical ground of things and to the splendor of appearing. And so one would say, finally, that the sound of spoken expression constitutes the first zone of confluence or interpenetration between the powers of nature and the interior commotion of the soul."}, {"orig": "Y aquí hagamos un alto que nos permita una visión de conjunto en el trabajo de la fantasía poética, que estamos tomando como una experiencia ejemplar, y diríamos metodológica, para llegar a la comprensión metafísica.", "trans": "And here let us pause to allow ourselves an overview of the work of poetic imagination — which we are taking as an exemplary, and one might say methodological, experience for arriving at metaphysical comprehension."}, {"orig": "Hay en el trabajo de la fantasía poética instantes que podríamos llamar de convocación de las palabras. El poeta solicita la palabra que debe encarnar una cierta intención de forma, y la palabra predestinada acude, emerge desde el fondo ignorado de la subconsciencia individual o desde el oscuro acervo universal de las formas. Entonces el poeta la reconoce, cual si por un efecto de reminiscencia recordara haberla encontrado en un cierto pasado metafísico donde contempló su propia obra en toda su plenitud y perfección. Y sólo entonces, es decir, sólo cuando suena la palabra expresiva en el espacio poético, conoce el artista su verdadera emoción, su verdadera intención de forma, como si ella naciera con el cuerpo que le da la palabra. Las posibilidades ignoradas de la vida interior podrían compararse a las almas de que habla Plotino en las Enéadas y que sólo se encarnan en los cuerpos que por su forma responden a su aspiración más esencial. Y así podríamos decir, utilizando las palabras de Bergson, quien emplea este símil neoplatónico para explicar la actualización de los recuerdos: \"Que los cuerpos se elevan hacia las almas que les comunicarían la vida completa, y el alma mirando el cuerpo en que cree ver el reflejo de sí misma, se deja atraer, se inclina y cae\". Y de esta suerte por último, nos parece que podemos aproximarnos a la comprensión de este fenómeno diciendo que hay una cierta preexistencia de la forma final y perfecta en el trabajo, lleno a veces de vehemente ansiedad, con que el poeta busca la expresión.", "trans": "In the work of poetic imagination there are moments we might call the summoning of words. The poet calls for the word that must incarnate a certain formal intention, and the predestined word comes, emerging from the unknown depths of the individual subconscious or from the dark universal storehouse of forms. The poet then recognizes it, as if by an effect of reminiscence, recalling having encountered it in a certain metaphysical past where they contemplated their own work in all its fullness and perfection. And only then — that is, only when the expressive word sounds in the poetic space — does the artist know their true emotion, their true formal intention, as if it were born with the body given to it by the word. The unknown possibilities of interior life might be compared to the souls Plotinus speaks of in the Enneads, which incarnate only in those bodies that, by their form, respond to their most essential aspiration. And so we might say, using the words of Bergson — who employs this Neoplatonic simile to explain the actualization of memories: \"That bodies rise toward the souls that would communicate complete life to them, and the soul, looking at the body in which it believes it sees the reflection of itself, lets itself be attracted, inclines, and falls.\" And in this way, finally, it seems to us that we can approach the comprehension of this phenomenon by saying that there is a certain pre-existence of the final and perfect form in the work — filled at times with vehement anxiety — with which the poet seeks expression."}, {"orig": "Así el lenguaje por su poder, por su capacidad de expresión, de evocación, de conmoción interior del alma nos ilustra sobre la heterogeneidad concreta y la totalidad orgánica y creadora de lo real. La palabra es un sonido, una vibración física, pero en ella se contiene y lo que es más, en ella aparece un sentido, irreductible a la simple materialidad de la expresión aunque unido a ella por modo indisoluble. De esta suerte para hablar en lenguaje pascaliano, diríamos que el lenguaje es una forma de la extensión en que se diversifica y expresa la unidad del pensamiento. Y aún más, diríamos que ambos aspiran al orden de la gracia en que tanto el sonido como el sentido se elevan sobre la pura materia y el mero pensamiento, a la emoción, a la intuición, a la erótica contemplación de lo absoluto y divino.", "trans": "Thus language, through its power, its capacity for expression, for evocation, for the inner commotion of the soul, illuminates us about the concrete heterogeneity and the organic and creative totality of the real. The word is a sound, a physical vibration; but within it is contained and — what is more — within it appears a meaning, irreducible to the simple materiality of expression yet united to it indissolubly. In this way, to speak in Pascalian terms, we might say that language is a form of extension in which the unity of thought diversifies and expresses itself. And more than that: we would say that both aspire to the order of grace in which both sound and meaning rise above pure matter and mere thought, to emotion, to intuition, to the erotic contemplation of the absolute and divine."}, {"orig": "Pero hay una función eminente, a la vez de la fantasía y del lenguaje, que interesa por igual a la ontología y a la estética. Y es la función metafórica que nosotros consideramos comprendida en la que llamamos revelación hipostática en el fenómeno de la expresión.", "trans": "But there is one eminent function, simultaneously of imagination and of language, that is of equal interest to ontology and aesthetics. It is the metaphorical function, which we consider encompassed within what we call hypostatic revelation in the phenomenon of expression."}, {"orig": "Se suele creer que se explica el proceso de formación de la metáfora considerándola como el resultado de una mera asociación por semejanza. Pero esa es una explicación insuficiente. Porque la semejanza, tomada en abstracto, es una cualidad formal que puede relacionar las imágenes o las apariencias cualesquiera que sean, según los innumerables puntos de vista desde los cuales son suceptibles de ser contempladas o comparadas. La semejanza como mera calidad formal, no constituye pues una verdadera ley, y así lo ha demostrado de una manera concluyente Bergson en Materia y Memoria. Entre las apariencias que se juntan en la metáfora hay sin duda semejanza, pero hay algo más. Entre el sentido propio de la expresión metafórica y su sentido figurado hay un vínculo anímico más profundo, un cierto vínculo emocional, el sentimiento de que la metáfora es verdaderamente la expresión y no la simple máscara de un contenido natural o interno.", "trans": "It is commonly believed that the process of metaphor formation is explained by regarding metaphor as the result of a mere association by resemblance. But this is an insufficient explanation. For resemblance, taken in the abstract, is a formal quality that can relate images or appearances of any kind whatsoever, according to the innumerable points of view from which they may be contemplated or compared. Resemblance as a mere formal quality does not, therefore, constitute a true law — as Bergson has demonstrated conclusively in Matter and Memory. Between the appearances that come together in the metaphor there is no doubt resemblance, but there is something more. Between the proper meaning of the metaphorical expression and its figurative meaning there is a deeper psychic bond, a certain emotional link — the feeling that the metaphor is truly the expression and not the simple mask of a natural or internal content."}, {"orig": "No intentamos ofrecer una teoría completa sobre la metáfora — en cuyo problema van envueltos las difíciles cuestiones relativas al origen y a la significación del mito y del arte. Nos limitaremos a decir, en síntesis, que la metáfora aparece a la vez, como la forma natural de expresión del sentimiento y como la zona o el punto de convergencia entre el yo y el no yo, el espíritu y la materia, la naturaleza y el alma.", "trans": "We do not intend to offer a complete theory of metaphor — a problem that implicates the difficult questions concerning the origin and significance of myth and art. We will limit ourselves to saying, in synthesis, that the metaphor appears at once as the natural form of expression of feeling and as the zone or point of convergence between the self and the not-self, the spirit and matter, nature and the soul."}, {"orig": "No haremos tampoco ni la exposición ni la crítica detallada de las numerosas teorías sobre la metáfora, la mayor parte derivadas de la concepción psicoanalítica o de doctrinas afines a ella, y que, por lo general, consideran la metáfora como una emanación de la subconciencia, como una figura en que, por virtud del principio de ambivalencia, a la vez se descubre, se realiza y elude, el deseo escondido, la tendencia instintiva y oculta.", "trans": "Nor will we undertake either the exposition or the detailed critique of the numerous theories of metaphor, most of them derived from the psychoanalytic conception or from related doctrines, which in general regard metaphor as an emanation of the subconscious, as a figure in which, by virtue of the principle of ambivalence, the hidden desire — the instinctive and concealed tendency — is at once discovered, realized, and evaded."}, {"orig": "Lo que nos parece válido en todas estas teorías es que consideran la metáfora como una corporificación de tendencias profundas del alma que en la imagen metafórica, a la vez que se expresan, en cierto modo se disimulan y encubren. Lo que es discutible es el empeño de algunas escuelas por establecer conclusiones que podríamos llamar mecánicas, nomenclaturas de símbolos con sus correspondientes significaciones; como si la actividad metafórica o de simbolización se ejercitase según leyes rígidas, como si fuera posible reducir abstractivamente a esquemas los innumerables e imponderables elementos humanos y cósmicos que se integran en la producción de la imagen simbólica: la metáfora.", "trans": "What seems to us valid in all these theories is that they regard metaphor as a corporification of the deep tendencies of the soul which, in the metaphorical image, are at once expressed and in a certain way disguised and concealed. What is debatable is the effort of some schools to establish conclusions that we might call mechanical — nomenclatures of symbols with their corresponding significations — as if metaphorical or symbolizing activity were exercised according to rigid laws, as if it were possible to reduce abstractively to schemas the innumerable and imponderable human and cosmic elements that go into the production of the symbolic image: the metaphor."}, {"orig": "Llamando lenguaje afectivo al lenguaje que sirve de expresión a los contenidos anímicos en que predominan la sensibilidad o la emoción sobre el esquematismo abstractivo o lógico, puede afirmarse en forma general, que el lenguaje afectivo es metafórico, es decir que los contenidos anímicos de esa calidad tienden siempre a ser configurados mediante imágenes tomadas del mundo sensible, o también que las imágenes sensibles directamente captadas por los sentidos se expresan con palabras que aluden o se refieren a los sentimientos del alma. La metáfora expresa el alma con formas materiales y la materia con las formas del alma. Por lo cual la metáfora crea una zona de existencia en que el mundo interior y el externo se transfiguran por un como efecto de endósmosis o para emplear el lenguaje de Jaspers, en que el uno se inflama en el otro.", "trans": "Calling affective language that which serves as expression for the psychic contents in which sensibility or emotion predominates over abstractive or logical schematism, one can affirm in general that affective language is metaphorical — that is, that psychic contents of that kind always tend to be configured through images taken from the sensible world, or also that sensible images directly apprehended by the senses are expressed with words that allude to or refer to the feelings of the soul. The metaphor expresses the soul with material forms and matter with the forms of the soul. For this reason the metaphor creates a zone of existence in which the interior and the exterior world are transfigured by something like an effect of endosmosis, or — to use the language of Jaspers — in which the one becomes inflamed in the other."}, {"orig": "La metáfora constituye una zona de identificación o interpenetración entre la naturaleza y el alma. En ella las formas visibles y tangibles de la materia aparecen como la expresión de un sentido espiritual, y algo más, como algo que al mismo tiempo retiene y exhala el alma. Materialización del alma y espiritualización de la materia. Doble y opuesta virtualidad de la imagen que al propio tiempo encubre y revela el enigma del hombre y del mundo, y en que la metáfora como forma universal de la fantasía y del mundo simboliza, según lo ha visto con profunda intuición H. Pongs, la ambivalencia de la existencia, en que la estructura antinómica del mundo objetivo y la estructura antinómica del mundo subjetivo, de los sentimientos, se corresponden e integran.", "trans": "The metaphor constitutes a zone of identification or interpenetration between nature and the soul. In it the visible and tangible forms of matter appear as the expression of a spiritual meaning, and something more: as something that simultaneously retains and exhales the soul. Materialization of the soul and spiritualization of matter. The double and opposed virtuality of the image that simultaneously conceals and reveals the enigma of man and the world — and in which metaphor, as the universal form of imagination, symbolizes, as H. Pongs has seen with profound intuition, the ambivalence of existence, in which the antinomic structure of the objective world and the antinomic structure of the subjective world of feelings correspond to and integrate with each other."}, {"orig": "Como encarnación de lo subconciente y expresión de la vida afectiva, como contenido prelógico, mítico de la vida anímica, la metáfora pertenece al mundo del sueño — tomando esta palabra \"sueño\" en su generalidad más significativa, como una proyección de la vida del alma, más allá del mero esquematismo intelectual o práctico. Y en este sentido es interesante revisar aunque sea en forma muy sumaria, las explicaciones e interpretaciones sobre las imágenes del sueño que son, por esencia, imágenes metafóricas. Las escuelas psicoanalíticas, principalmente las que siguen la dirección freudiana interpretan los sueños, o mejor las imágenes del sueño, como expresiones indirectas en que a la vez se disimulan y se realizan los instintos. Hay empero otra actitud, u otra dirección de las tendencias innatas, actitud que algunos psicólogos llaman anagógica del griego ἀναγωγικός y que no se encubre como los instintos reprimidos, sino que más bien se ejerce como una actividad de orientación, de crítica y de elevación ideal, opuesta a la mera proyección instintiva.", "trans": "As an incarnation of the subconscious and expression of affective life, as pre-logical, mythical content of psychic life, metaphor belongs to the world of dream — taking the word \"dream\" in its most significant generality, as a projection of the life of the soul beyond mere intellectual or practical schematism. And in this sense it is interesting to review, even if very summarily, the explanations and interpretations of dream images, which are, in essence, metaphorical images. The psychoanalytic schools, principally those following the Freudian direction, interpret dreams — or rather the images of dreams — as indirect expressions in which instincts are at once disguised and realized. But there is another attitude, another direction of innate tendencies — an attitude that some psychologists call anagogic, from the Greek ἀναγωγικός — which does not conceal itself like repressed instincts, but rather acts as an activity of orientation, of criticism, and of ideal elevation, opposed to mere instinctive projection."}, {"orig": "Enunciando al propio tiempo el alcance cósmico de la metáfora y su sentido de elevación espiritual escribe Pongs: \"Es ahí, en la esfera imaginada de los grandes fenómenos cósmicos, donde se justifica esta perspectiva por la cual todo poeta auténtico vuelve a encontrar en el Universo y en el yo, una misma y grande unidad divina. Las imágenes que se ofrecen a él vienen del fondo mismo de las cosas y son capaces de expresar los rasgos principales de su concepción del Universo.\"", "trans": "Stating at the same time the cosmic scope of metaphor and its sense of spiritual elevation, Pongs writes: \"It is there, in the imagined sphere of the great cosmic phenomena, that this perspective is justified — the perspective by which every authentic poet finds again in the Universe and in the self one and the same great divine unity. The images that offer themselves to them come from the very depths of things and are capable of expressing the principal features of their conception of the Universe.\""}, {"orig": "La actitud anagógica puede colaborar antinómicamente con la proyección instintiva. Al sueño meramente instintivo de alcance y significación subjetiva, se antepone el sueño anagógico, y por su unificación resulta el sueño integral de los grandes poetas, cuyas imágenes expresan no sólo la personalidad subjetiva del poeta sino su concepción cósmica y lo que es más: su relación primitiva con la vida cósmica. (Hölderlin, Goethe). En el sueño anagógico las imágenes no huyen, no se evaden, no contienen reticencias, sino que aceptan y exaltan la realidad oculta de las cosas. No mienten, anuncian. Y así dice Pongs a propósito de Hölderlin estas palabras aplicables a todo gran poeta: \"El poeta viene a ser un mediador cuyas imágenes reflejan lo divino, velándolo, así como en el culto religioso lo divino se refleja y se comunica en el sacramento. En la creación imaginativa del poeta, lo verdadero revelado viene a ser lo verdadero comunicable\".", "trans": "The anagogic attitude can collaborate antinomically with the instinctive projection. To the merely instinctive dream of subjective scope and significance, the anagogic dream is opposed; and from their unification results the integral dream of the great poets, whose images express not only the subjective personality of the poet but their cosmic conception and — what is more — their primordial relation to cosmic life. (Hölderlin, Goethe.) In the anagogic dream the images do not flee, do not e
