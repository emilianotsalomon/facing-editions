vade, do not contain reticences; rather they accept and exalt the hidden reality of things. They do not lie; they announce. And so Pongs says of Hölderlin these words applicable to every great poet: \"The poet comes to be a mediator whose images reflect the divine, veiling it, just as in religious worship the divine is reflected and communicated in the sacrament. In the imaginative creation of the poet, the revealed truth comes to be the communicable truth.\""}, {"orig": "La unidad significativa de la metáfora poética constituye su transrealidad, que no es irrealidad sino proyección (anagógica) de la visión y de la imagen a una nueva dimensión de lo real.", "trans": "The significative unity of the poetic metaphor constitutes its trans-reality — which is not unreality but rather the (anagogic) projection of vision and image toward a new dimension of the real."}, {"orig": "Y he aquí que la poesía plantea y a la vez resuelve la gran cuestión de saber porqué en el mismo movimiento en que se expresa la emoción y en que se exhala el fondo subjetivo, musical diría Schiller, del alma parece también manifestarse, en el sonido de la palabra y en la materialidad más sutil de la imagen el sentido inmaterial de la naturaleza y de la vida. Es como si el lirismo trascendiese de sí mismo y, elevándose sobre la mera confidencia sentimental y efímera, asumiera el carácter de verdadero lenguaje del ser, lenguaje que, brotado del fondo metafísico de las cosas está destinado a propagar en el espacio y en el tiempo el esplendor y el amor del sentido.", "trans": "And here poetry poses and at the same time resolves the great question of understanding why, in the very movement in which emotion is expressed and in which the subjective ground of the soul — musical, as Schiller would say — is exhaled, there seems also to manifest itself, in the sound of the word and in the subtler materiality of the image, the immaterial meaning of nature and of life. It is as if lyricism were to transcend itself and, rising above mere sentimental and ephemeral confidences, assume the character of true language of being — a language that, sprung from the metaphysical ground of things, is destined to propagate in space and time the splendor and the love of meaning."}, {"orig": "Pero todavía no podemos terminar este estudio.", "trans": "But we cannot yet conclude this study."}, {"orig": "En todo lo anterior hemos considerado el lenguaje y más especialmente la palabra —ora al estudiar la operación demiúrgica, en que el lenguaje ordena el mundo sensible para su interpretación teórica o para su utilización práctica, ora al describir la que llamamos emanación hipostática— como la manifestación de un sentido preexistente, como el resultado de un movimiento centrífugo, en suma como algo en que venía a expirar la onda expresiva y comunicativa del alma.", "trans": "In all the foregoing we have considered language — and more especially the word — now in studying the demiurgic operation, in which language orders the sensible world for its theoretical interpretation or practical use; now in describing what we call hypostatic emanation: in both cases as the manifestation of a pre-existent meaning, as the result of a centrifugal movement, in short as something in which the expressive and communicative wave of the soul comes to expire."}, {"orig": "Lo hemos aludido sin duda, pero no hemos estudiado explícitamente otro modo de actuación del lenguaje, acaso decisivo para la evolución espiritual del hombre. Es la función creadora o más exactamente formativa y constructiva del lenguaje, operación que siguiendo la dirección impresa por Humboldt a las investigaciones lingüísticas, ha estudiado Ernst Cassirer con singular penetración y cuyos aspectos principales contemplaremos a continuación en la medida en que ellos interesen a la intención central de este trabajo.", "trans": "We have indeed alluded to it, but we have not explicitly studied another mode of operation of language, perhaps decisive for the spiritual evolution of mankind. It is the creative, or more precisely the formative and constructive, function of language — an operation that, following the direction impressed by Humboldt on linguistic investigations, has been studied by Ernst Cassirer with singular penetration; its principal aspects we shall now contemplate insofar as they are relevant to the central intention of this work."}, {"orig": "Según Cassirer el lenguaje no es un simple resultado, un mero producto sin acción propia en el contenido o en la actividad de la conciencia. Así como la representación objetiva, no es una simple copia de la realidad externa sino que ella se debe en gran parte al ejercicio de la función sintética de la mente, así las palabras son actos de la mente que al propio tiempo recogen, configuran y crean el contenido de la experiencia interna y externa. \"El lenguaje, escribe Cassirer, no entra en un mundo de percepciones objetivas acabadas, para añadir solamente a objetos individuales dados y claramente delimitados los unos por relación a los otros, 'nombres' que serían signos puramente exteriores y arbitrarios, sino que es él mismo un mediador en la formación de los objetos; es, en un sentido, el mediador por excelencia, el instrumento más importante y preciso para la conquista y para la construcción de un verdadero mundo de objetos.\"", "trans": "According to Cassirer, language is not a simple result, a mere product without proper action in the content or activity of consciousness. Just as objective representation is not a simple copy of external reality but owes itself in large measure to the exercise of the synthetic function of the mind, so words are acts of the mind that at once collect, configure, and create the content of internal and external experience. \"Language,\" writes Cassirer, \"does not enter a world of completed objective perceptions, simply to add to individual objects, already given and clearly delimited from one another, 'names' that would be purely external and arbitrary signs; rather it is itself a mediator in the formation of objects; it is, in a sense, the mediator par excellence, the most important and precise instrument for the conquest and construction of a true world of objects.\""}, {"orig": "Esta tesis se ilustra por las observaciones de la psicología infantil, relativas a la formación del lenguaje, de las cuales aparece que el nombre actúa en el espíritu del niño no como un mero signo adherido exteriormente a las cosas, sino como un factor decisivo en la fijación y consolidación de los objetos. Con lo cual, superando la infinita heterogeneidad de los fenómenos, permite llegar a una nueva sinópsis intelectual de lo múltiple.", "trans": "This thesis is illustrated by the observations of child psychology relative to the formation of language, from which it appears that the name acts in the child's mind not as a mere sign adhered externally to things, but as a decisive factor in the fixing and consolidation of objects — and thereby, transcending the infinite heterogeneity of phenomena, enables a new intellectual synopsis of the manifold."}, {"orig": "El lenguaje actúa así mismo como un factor importantísimo en la formación del mundo emocional y en la organización de la voluntad. El lenguaje con su orientación hacia la reflexión contiene en cierto sentido y domina la fuerza primitiva de la emoción. \"La organización vocal y verbal de la emoción impide su explosión prematura y puramente motriz y el abandono sin límites y sin resistencia a su impulsión.\" Verdad que conocieron muy bien los moralistas griegos cuando predicaron la subordinación de las pasiones a la ley y a las órdenes del Logos, cuyo sentido íntimo y profundo se relaciona de modo esencial con el lenguaje. De este modo el lenguaje nos abre la vía a la dominación del mundo interior como lo había hecho en el mundo exterior mediante la formación de los objetos. El lenguaje constituye la \"perspectiva\" interna y externa en que podemos ser dueños de nosotros mismos y de las cosas. \"A la tendencia, al apetito, a la pasión que van directamente a las cosas el lenguaje opone siempre otra dirección, afectada de un signo contrario. En él coexisten siempre atracción y repulsión, que permanecen en una especie de equilibrio ideal. Puesto que a la necesidad de atraer inmediatamente las cosas a sí y de incorporarlas simplemente a la esfera del yo se opone aquí otra necesidad, la de alejarlas del yo, de ponerlas fuera de él a fin de volverlas 'representables' y de convertirlas en objetos, por el acto mismo que las pone fuera de sí. La fuerza de atracción está balanceada por la fuerza de abstracción.\" Conjunción de dos procesos que hace posible la apropiación intelectual del mundo en la manera propia del lenguaje.", "trans": "Language likewise acts as a vitally important factor in the formation of the emotional world and in the organization of the will. Language, with its orientation toward reflection, in a certain sense contains and masters the primitive force of emotion. \"The vocal and verbal organization of emotion prevents its premature and purely motor explosion and the limitless and unresisting surrender to its impulse.\" A truth well known to the Greek moralists when they preached the subordination of the passions to the law and the orders of the Logos, whose intimate and profound meaning is essentially related to language. In this way language opens to us the path toward mastery of the inner world, as it had already done in the outer world through the formation of objects. Language constitutes the internal and external \"perspective\" in which we can be masters of ourselves and of things. \"To the tendency, the appetite, the passion that go directly toward things, language always opposes another direction, bearing a contrary sign. In it there always coexist attraction and repulsion, which remain in a kind of ideal equilibrium. For to the need to draw things immediately to oneself and incorporate them simply into the sphere of the self, there is here opposed another need — that of distancing them from the self, of placing them outside it in order to make them 'representable' and to convert them into objects, by the very act that places them outside the self. The force of attraction is balanced by the force of abstraction.\" A conjunction of two processes that makes possible the intellectual appropriation of the world in the manner proper to language."}, {"orig": "La importancia del lenguaje en la formación del mundo de la pura imaginación (juegos de ilusión, fábula, humanización cósmica) no es menos notable. Para darse cuenta de ello, piénsese que existe tanto en el niño como en el hombre primitivo una \"concrescencia\" inicial entre la imagen y la cosa, de la realidad y la apariencia, concrescencia en que el lenguaje y la actividad mítica desempeñan un papel solidario y verdaderamente inseparable. A este respecto dice Cassirer, se puede aventurar esta paradoja: \"el niño no habla a las cosas porque las mira como animadas sino al contrario, las mira como animadas porque habla con ellas.\" El lenguaje y la animación universal son así dos funciones primitivamente unidas, y cuya posterior separación hace que el universo, las cosas, los objetos caigan a la categoría de la pura materia muda — y en consecuencia inánime.", "trans": "The importance of language in the formation of the world of pure imagination (games of illusion, fable, cosmic humanization) is no less notable. To appreciate this, one should consider that there exists, both in the child and in primitive man, an initial \"concrescence\" between image and thing, between reality and appearance — a concrescence in which language and mythical activity play a solidary and truly inseparable role. In this regard Cassirer ventures the paradox: \"the child does not speak to things because it regards them as animated; on the contrary, it regards them as animated because it speaks with them.\" Language and universal animation are thus two primitively united functions, whose subsequent separation makes the universe, things, and objects fall into the category of pure mute matter — and consequently inanimate."}, {"orig": "En el juego infantil puede observarse con singular relieve esta unión, esta reciprocidad entre el lenguaje y la actividad de animación. Hablar en el niño es transferir a los objetos su propia animación interior, y constituye un elemento fundamental del juego; la fabulación es inseparable del juego infantil. La palabra es sugerida por la imagen, y la imagen por la palabra de tal modo que ambas viven, obran, existen la una para la otra. Por lo cual puede concluírse que el lenguaje es un medio específico de humanización, de antropogonía.", "trans": "In children's play this union — this reciprocity between language and the activity of animation — may be observed with singular relief. To speak, for a child, is to transfer to objects one's own inner animation, and it constitutes a fundamental element of play; fabulation is inseparable from children's play. The word is suggested by the image and the image by the word, in such a way that both live, act, and exist for each other. From which we may conclude that language is a specific means of humanization, of anthropogony."}, {"orig": "Finalmente en la poesía alcanza el lenguaje el apogeo de su poder constructivo y expresivo. En la poesía el lenguaje supera ese como eterno anatema que parece condenarlo a oscurecer aquello mismo que el lenguaje muestra, a tejer un velo de Maya entre los hombres y la realidad. En la expresión de la poesía, la palabra parece superar las críticas que en todo tiempo se han levantado contra el lenguaje acusándolo de oscurecer, deformar y desfigurar las cosas que él nos muestra, y que acaso podrían ser condensadas en los versos de Schiller:", "trans": "Finally in poetry language reaches the apogee of its constructive and expressive power. In poetry language transcends what seems like an eternal curse condemning it to obscure the very thing it shows — to weave a veil of Maya between human beings and reality. In the expression of poetry, the word seems to surpass the criticisms that have been raised at all times against language, accusing it of obscuring, deforming, and disfiguring the things it shows us — criticisms perhaps condensed in Schiller's verses:"}, {"orig": "Warum kann der lebendige Geist dem Geist nicht erscheinen? Spricht die Seele, so spricht, ach schon die Seele nicht mehr.", "trans": "Warum kann der lebendige Geist dem Geist nicht erscheinen? Spricht die Seele, so spricht, ach schon die Seele nicht mehr. [Why can the living spirit not appear to the spirit? / When the soul speaks, alas, the soul speaks no more.]"}, {"orig": "En la poesía, en efecto, se efectúa la más alta síntesis: lo más individual adquiere trascendencia universal y lo más universal se configura en la apariencia más irreductible y única. La creación poética es única, nueva, y sin embargo resuena como si nos descubriese algo ignorado pero que sólo esperaba ser llamado por la palabra a la luz para surgir. Con lo cual la palabra poética no encubre sino descubre, y en su eterna novedad nos dá la verdadera eternidad, intimidad, profundidad de la vida. Ella no brota, como un simple resultado sino que en sí misma irradia, y por ella cobra nuevo y más viviente sentido el sentimiento del poeta.", "trans": "In poetry, indeed, the highest synthesis is achieved: what is most individual acquires universal transcendence and what is most universal configures itself in the most irreducible and unique appearance. Poetic creation is unique, new, and yet it resounds as if disclosing something unknown that was only waiting to be summoned by the word into the light, to emerge. Thus the poetic word does not conceal but reveals; and in its eternal novelty it gives us the true eternity, intimacy, and depth of life. It does not spring forth as a simple result, but radiates from within itself, and through it the poet's feeling acquires new and more living meaning."}, {"orig": "Como se ve por las indicaciones que preceden el lenguaje no es únicamente una actividad demiúrgica que ordena y delimita una materia dada, ni tampoco una mera actividad de revelación de un sentido preexistente. El lenguaje aparece como creador de sentido, como una actividad que no sólo extrae a la luz el contenido del alma, sino que al presentarlo lo transfigura y le confiere una nueva virtualidad de significación y de eficacia espiritual. El alma pronuncia la palabra en que se expresa, pero la palabra una vez pronunciada vuelve al alma con un nuevo y maravilloso coeficiente de sentido y de vida. Es la inagotable, la infinita virtualidad del verbo.", "trans": "As can be seen from the foregoing indications, language is not exclusively a demiurgic activity that orders and delimits a given matter, nor is it merely an activity of revealing a pre-existent meaning. Language appears as a creator of meaning, as an activity that not only brings to light the content of the soul but, in presenting it, transfigures it and confers upon it a new virtuality of signification and spiritual efficacy. The soul pronounces the word in which it is expressed, but the word, once pronounced, returns to the soul with a new and wonderful coefficient of meaning and life. It is the inexhaustible, the infinite virtuality of the verb."}, {"orig": "* * *", "trans": "* * *"}, {"orig": "Reuniendo ahora los hilos de nuestra disertación, creemos poder ordenar en la forma siguiente las conclusiones que derivan de una meditación sobre el lenguaje considerado como un fenómeno representativo y simbólico de la actividad universal de aparición.", "trans": "Gathering now the threads of our exposition, we believe we can set forth in the following form the conclusions that derive from a meditation on language considered as a representative and symbolic phenomenon of the universal activity of appearing."}, {"orig": "1° Así como en el fondo del pensamiento y del alma hay un sentido, algo que preexiste y domina, impregna y se manifiesta en la multiplicidad de las palabras, así en el fondo de la realidad, en el principio de la realidad, existe un algo, o mejor, una unidad que se despliega, sin perderse, en la multiplicidad de las apariencias. El esfuerzo especulativo del hombre consiste en encontrar, por la vía de la inteligencia, esa unidad, elevándose por encima de la diversidad. El anhelo místico aspira a anegar la propia esencia personal en la fuente sin nombre de donde todo mana, y por ello sigue la vía de la negación y de la eminencia que recomendaba el viejo e inmortal Plotino. La poesía vive el principio y su difusión en las formas sensibles; es, como el alma, la gran intermediaria entre la invisible universalidad de lo inteligible y de lo uno y la visible particularidad de los seres en que ellos se manifiestan y lucen.", "trans": "1° Just as in the depths of thought and of the soul there is a meaning — something that pre-exists and dominates, permeates and manifests itself in the multiplicity of words — so in the depths of reality, in the principle of reality, there exists a something, or better, a unity that unfolds, without losing itself, in the multiplicity of appearances. The speculative effort of human beings consists in finding, by way of intelligence, that unity, rising above diversity. The mystical longing aspires to annihilate one's own personal essence in the nameless source from which everything flows, and for this reason it follows the way of negation and eminence recommended by the old and immortal Plotinus. Poetry lives the principle and its diffusion in sensible forms; it is, like the soul, the great intermediary between the invisible universality of the intelligible and the One and the visible particularity of the beings in which they manifest themselves and shine."}, {"orig": "2° Ese sentido de la existencia, ese sentido unitario, sale de sí, y sin perder su esencia, sin dejar de ser lo que es —indivisible y uno— se manifiesta en la infinita variedad de las imágenes del alma y de las formas de la naturaleza. El mundo es así —ya se le considere en la armonía de su totalidad, ya en la rítmica y melódica sucesión de sus cambios, ya en la articulación de sus apariencias— un lenguaje. Los viejos cosmólogos hablaban de la \"sintaxis cósmica\" y los filósofos del idealismo alemán principalmente Novalis, consideraban la creación como un poema, cuyo sentido era el último sentido metafísico de la realidad. Según ellos la creación era un \"tropo del espíritu\".", "trans": "2° That meaning of existence — that unitary meaning — issues from itself and, without losing its essence, without ceasing to be what it is — indivisible and one — manifests itself in the infinite variety of the images of the soul and the forms of nature. The world is thus — whether considered in the harmony of its totality, or in the rhythmic and melodic succession of its changes, or in the articulation of its appearances — a language. The old cosmologists spoke of \"cosmic syntax\" and the German Idealist philosophers, principally Novalis, regarded creation as a poem whose meaning was the ultimate metaphysical meaning of reality. According to them, creation was a \"trope of the spirit.\""}, {"orig": "3° Del mismo modo que el lenguaje existe para que alguien lo entienda, el aparecer se da para que alguien lo contemple y comprenda. La palabra y su significado se reflejan en el oído y en la mente. El infinito mundo del aparecer se refleja en el espejo del alma. Así el reflejarse es como el objeto intencional del aparecer. Y así como el manifestarse sigue al ser, el reflejarse sigue al aparecer, y de este modo: Ser, aparecer y reflejo especular del aparecer se dan como las supremas categorías metafísicas.", "trans": "3° Just as language exists so that someone may understand it, appearing is given so that someone may contemplate and comprehend it. The word and its significance are reflected in the ear and the mind. The infinite world of appearing is reflected in the mirror of the soul. Thus the act of reflection is, as it were, the intentional object of appearing. And just as manifesting follows being, reflecting follows appearing; and in this way: Being, appearing, and the specular reflection of appearing are given as the supreme metaphysical categories."}, {"orig": "Todo ser sale de sí y tiende a ser contemplado. Y así aparece clara en su misterio esta sentencia de Plotino: \"Todo ser es contemplación, todo deriva de la contemplación\". Como si en el simple existir, como si en la mera posición del ser hubiese ya algo que desprendiéndose de él lo restituyese en imagen, en visión, en palabra que no solamente se pronuncia sino que también y principalmente se oye.", "trans": "All being issues from itself and tends to be contemplated. And thus this sentence of Plotinus becomes clear in its mystery: \"All being is contemplation, everything derives from contemplation.\" As if in the simple act of existing, as if in the mere positing of being, there were already something that, detaching itself from it, restored it in image, in vision, in a word that is not merely pronounced but also and principally heard."}, {"orig": "4° Hemos distinguido dos grandes direcciones, dos grandes horizontes en la actividad del lenguaje: la que llamamos función demiúrgica y que consiste en que el lenguaje —como la mente de la cual es al propio tiempo instrumento y factor— se ejercita ordenando el vario conjunto de los objetos, definiéndolos y delimitándolos. Es una función abstractiva que expresa, designa las especies y extrae las esencias. Y que actúa con cierta exterioridad sobre los contenidos que designa y fija. Y la que llamamos operación hipostática en que el lenguaje es propiamente hablando, expresión. Es el salir de sí del ser en sí. Es el lenguaje sintético de la afectividad y de la poesía.", "trans": "4° We have distinguished two great directions, two great horizons in the activity of language: what we call the demiurgic function, which consists in language — like the mind of which it is simultaneously instrument and factor — exercising itself by ordering the various ensemble of objects, defining and delimiting them. It is an abstractive function that expresses, designates species, and extracts essences. And it acts with a certain exteriority upon the contents it designates and fixes. And what we call the hypostatic operation, in which language is, properly speaking, expression — the going-out-from-itself of being-in-itself. It is the synthetic language of affectivity and poetry."}, {"orig": "Entre estas dos funciones o direcciones del lenguaje inherentes a las operaciones naturales de la mente se da una cierta oposición. La una es generalizadora, abstracta, esquemática. Corresponde a la función lógica. La otra —hasta en sus simbolizaciones más universales y significativas— es concreta, imaginativa, imaginifera. Es la función expresiva, poética. La una se aplica a los objetos, los delimita y ordena, la otra supone una emanación del interior, emanación que como un flúido se difunde en el espacio físico y anímico. Hay empero entre ellas, una íntima relación y el secreto de esa relación es sin duda, el gran secreto de la estructura más honda de lo real. El lenguaje es una emanación —del alma, del espíritu, del ser universal— pero el objeto intencional del lenguaje está más allá de él, como algo que la palabra al mismo tiempo y por el hecho de nombrar, pone, siempre, con subsistencia metafísica, fuera de sí.", "trans": "Between these two functions or directions of language, inherent in the natural operations of the mind, there is a certain opposition. The one is generalizing, abstract, schematic — it corresponds to the logical function. The other — even in its most universal and significant symbolizations — is concrete, imaginative, image-bearing. It is the expressive, poetic function. The one applies to objects, delimiting and ordering them; the other supposes an emanation from the interior, an emanation that like a fluid diffuses itself in physical and psychic space. Yet between them there is an intimate relation, and the secret of that relation is without doubt the great secret of the deepest structure of the real. Language is an emanation — from the soul, from the spirit, from universal being — but the intentional object of language lies beyond it, as something that the word, at the same time and by the very act of naming, always places, with metaphysical subsistence, outside itself."}, {"orig": "5° El lenguaje prolonga el movimiento interno y creador que le da nacimiento, y por ello nos presenta el ejemplo de un devenir cuyas fases están ligadas, sin duda, por una relación de filiación con la primitiva unidad de sentido pero que al mismo tiempo la enriquecen y transfiguran al revelarla. Con lo cual la poesía se da no como una mera imitación del modelo ideal sino como la expresión de una energía capaz de suscitar nuevas apariencias, formas inéditas que al par que manifiestan renuevan el sentido y lo transponen a planos cada vez más lejanos y extensos.", "trans": "5° Language prolongs the internal and creative movement that gives it birth, and thus presents us with the example of a becoming whose phases are linked, without doubt, by a relation of filiation with the primitive unity of meaning, but which at the same time enrich and transfigure that unity by revealing it. Poetry is therefore not a mere imitation of the ideal model but the expression of an energy capable of evoking new appearances — unprecedented forms that, while manifesting it, renew meaning and transpose it to ever more distant and extensive planes."}, {"orig": "6° El lenguaje como toda forma del aparecer, al propio tiempo que viene del ser tiene una proyección de retorno hacia el ser que es el sentido, y que a la vez que se da en el lenguaje, lo trasciende. El hablar es poner en acto estas dos categorías ontológicas inseparables y distintas: el aparecer y el ser. Algo se revela en la sonoridad de la palabra, algo que no es la palabra sino su objeto significado. Entender es deshacer la mera aparencialidad de la palabra para descubrir el sentido supraverbal, ontológico del verbo. Y así el hablar y el entender nos entregan en resúmen toda la polaridad metafísica de lo real.", "trans": "6° Language, like every form of appearing, at the same time as it comes from being, has a returning projection toward the being that is meaning — which, while it gives itself in language, transcends it. To speak is to enact these two ontological categories, inseparable yet distinct: appearing and being. Something is revealed in the sonority of the word — something that is not the word but its signified object. To understand is to undo the mere apparentiality of the word in order to discover the supra-verbal, ontological meaning of the verb. And thus speaking and understanding deliver to us, in summary, the entire metaphysical polarity of the real."}, {"orig": "Pero hay más, como bien se comprende, en todo lenguaje se da una proyección hacia la cosa en sí. Hablar y entender es sentir o intuir que más allá de la palabra existe algo que la palabra sin duda, expresa, manifiesta, pero que no se agota en la mera sonoridad de la expresión. Ese algo aunque no es posible separarlo de hecho como pura intuición sin expresión, es una cosa en sí. Y de este modo el lenguaje nos ilustra no sólo sobre la calidad que diríamos categorial de la cosa en sí, no sólo sobre la inevitabilidad de su presencia en todo fenómeno de expresión, sino sobre la realidad de su existencia que, de un modo o de otro, transparece, en todo fenómeno de visión o audición significativa.", "trans": "But there is more: as is well understood, in all language there is a projection toward the thing in itself. To speak and to understand is to sense or intuit that beyond the word there exists something that the word without doubt expresses and manifests, but which is not exhausted in the mere sonority of expression. This something, though it cannot in practice be separated as pure intuition without expression, is a thing in itself. And in this way language illuminates us not only about the categorical quality, as we might say, of the thing in itself, nor only about the inevitability of its presence in every phenomenon of expression, but about the reality of its existence — which, in one way or another, becomes transparent in every phenomenon of significant seeing or hearing."}, {"orig": "7° El lenguaje es la gran revelación metafísica: la clave. El lenguaje nos muestra la multiplicidad, la pluralidad de los seres. La alteridad es una condición a priori del lenguaje. ¿Qué objeto, qué significación metafísica tendría el lenguaje, qué papel representaría en la economía universal si sólo se diera como existente real la pura unidad? El lenguaje, pues, nos enseña la distinción y la separación. Pero también nos ofrece una enseñanza de signo contrario; porque nos revela la profunda unidad, la participación de todos los seres en una única realidad de sentido. ¿Cómo podría existir el lenguaje si no presupusiera la posibilidad de comprensión que deshace la separación y funde los opuestos interlocutores en la comunidad de lo que se dice y expresa? Lenguaje es comunicación, y comunicación es comunión, participación y unidad.", "trans": "7° Language is the great metaphysical revelation: the key. Language shows us the multiplicity, the plurality of beings. Alterity is an a priori condition of language. What object, what metaphysical significance would language have — what role would it play in the universal economy — if pure unity were the only real existent? Language, then, teaches us distinction and separation. But it also offers us a teaching of the opposite sign: because it reveals the profound unity, the participation of all beings in a single reality of meaning. How could language exist if it did not presuppose the possibility of comprehension that undoes separation and fuses opposing interlocutors in the community of what is said and expressed? Language is communication, and communication is communion, participation, and unity."}, {"orig": "Y bien, el cosmos ¿no es un lenguaje que viene de un yo, que se dirige a un yo? Y la comprensión de ese lenguaje ¿no es la vuelta del yo al yo a través del aparecer?", "trans": "And indeed — is not the cosmos a language that comes from a self, directed toward a self? And is not the comprehension of that language the return of the self to the self through appearing?"}];

const container = document.getElementById('paras');
const SKIP_IDXS = new Set([0, 1]);

const VERSE_TOKENS = ['Il pleure', 'Comme il pleut', 'Tag meines', 'Gen Abend', 'Warum kann', 'Spricht die', 'Nuestras vidas', 'Que van a dar', 'Que es el morir'];

function isVerse(t) { return VERSE_TOKENS.some(v => t.includes(v)); }
function isSectionBreak(t) { return t.trim() === '* * *'; }
function isConclusion(t) { return /^[1-7]°/.test(t.trim()); }

function pageNum(n) {
  const s = document.createElement('span');
  s.className = 'page-num';
  s.textContent = ' ' + n + ' ';
  s.setAttribute('aria-label', 'page ' + n);
  return s;
}

function snapToWord(text, pos) {
  if (pos <= 0) return 0;
  if (pos >= text.length) return text.length;
  if (text[pos] === ' ') return pos;
  let lo = pos - 1, hi = pos + 1;
  while (lo > 0 && text[lo] !== ' ') lo--;
  while (hi < text.length && text[hi] !== ' ') hi++;
  return (pos - lo <= hi - pos) ? lo : hi;
}

DATA.forEach((d, i) => {
  if (SKIP_IDXS.has(i)) return;

  const row = document.createElement('div');
  row.className = 'row';

  if (isSectionBreak(d.orig))      row.classList.add('is-section-break');
  else if (isVerse(d.orig) || isVerse(d.trans)) row.classList.add('is-verse');

  const orig  = document.createElement('p');
  const trans = document.createElement('p');

  if (d.page_mid) {
    const offset = d.mid_offset;
    const origPre  = d.orig.slice(0, offset);
    const origPost = d.orig.slice(offset);
    const ratio = offset / d.orig.length;
    const tOff = snapToWord(d.trans, Math.round(d.trans.length * ratio));
    const transPre  = d.trans.slice(0, tOff);
    const transPost = d.trans.slice(tOff);
    orig.append(origPre,  pageNum(d.page_mid), origPost);
    trans.append(transPre, pageNum(d.page_mid), transPost);
  } else {
    orig.textContent  = d.orig;
    trans.textContent = d.trans;
  }

  row.appendChild(orig);
  row.appendChild(trans);
  container.appendChild(row);

  if (d.page_after) {
    const nums = Array.isArray(d.page_after) ? d.page_after : [d.page_after];
    nums.forEach(n => {
      const div = document.createElement('div');
      div.className = 'page-row';
      div.appendChild(pageNum(n));
      container.appendChild(div);
    });
  }
});

// Font size
(function () {
  const MIN = 12, MAX = 28, STEP = 1;
  const root = document.documentElement;
  const label = document.getElementById('font-size-label');
  const stored = parseInt(localStorage.getItem('sbs-font-size'), 10);
  let size = Number.isFinite(stored) ? Math.min(MAX, Math.max(MIN, stored)) : 16;
  function apply() {
    root.style.setProperty('--font-size', size + 'px');
    label.textContent = size + 'px';
    localStorage.setItem('sbs-font-size', size);
  }
  document.getElementById('font-inc').addEventListener('click', () => { size = Math.min(MAX, size + STEP); apply(); });
  document.getElementById('font-dec').addEventListener('click', () => { size = Math.max(MIN, size - STEP); apply(); });
  apply();
})();
</script>
