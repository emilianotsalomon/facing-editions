<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mito y paisaje</title>
<style>
  /* ── Typography ─────────────────────────────────────────────────────────
     No external font import — uses the best available system serif on each
     platform: Palatino / Book Antiqua / Georgia / Times.  Fully offline.  */

  :root {
    --text-primary:   #1a1a1a;
    --text-muted:     #8a8a8a;
    --border:         #d8d5cc;
    --border-strong:  #b8b5ac;
    --page-bg:        #fdfcf9;
    --font-voice: Palatino Linotype, Palatino, Book Antiqua, Georgia,
                  'Times New Roman', serif;
    --font-sans:  -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --row-font-size: 16px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --text-primary:  #e8e5df;
      --text-muted:    #7a7870;
      --border:        #3a3730;
      --border-strong: #5a5750;
      --page-bg:       #1c1b18;
    }
  }

  :root[data-theme="light"] {
    --text-primary:  #1a1a1a;
    --text-muted:    #8a8a8a;
    --border:        #d8d5cc;
    --border-strong: #b8b5ac;
    --page-bg:       #fdfcf9;
  }
  :root[data-theme="dark"] {
    --text-primary:  #e8e5df;
    --text-muted:    #7a7870;
    --border:        #3a3730;
    --border-strong: #5a5750;
    --page-bg:       #1c1b18;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 3rem 1.5rem;
    background: var(--page-bg);
    color: var(--text-primary);
  }

  .wrap {
    max-width: 1400px;
    margin: 0 auto;
    font-family: var(--font-voice);
  }

  .title {
    text-align: center;
    margin-bottom: 1.25rem;
    font-size: 19px;
    letter-spacing: 0.04em;
  }

  .font-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    margin-bottom: 2rem;
    font-family: var(--font-sans);
  }

  .font-controls button {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }

  .font-controls button:hover {
    background: var(--border);
  }

  .font-controls span {
    font-size: 12px;
    color: var(--text-muted);
    min-width: 2.4em;
    text-align: center;
  }

  .col-headers {
    display: flex;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--border-strong);
  }

  .col-headers span {
    width: 48%;
    font-size: 13px;
    font-style: italic;
    color: var(--text-muted);
  }

  #paras {
    position: relative;
  }

  #paras::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 1px;
    background: var(--border-strong);
  }

  .row {
    display: flex;
    justify-content: space-between;
    gap: 0;
    padding: 1rem 0;
  }

  .row p {
    margin: 0;
    font-size: var(--row-font-size);
    line-height: 1.65;
    width: 48%;
  }

  .page-row {
    text-align: center;
    padding: 0.5rem 0;
  }

  .page-mark {
    color: var(--text-muted);
    font-size: 12px;
    font-style: normal;
    font-family: var(--font-sans);
  }

  @media (max-width: 600px) {
    #paras::before {
      display: none;
    }
    .col-headers,
    .row {
      flex-direction: column;
      gap: 0.75rem;
    }
    .col-headers span,
    .row p {
      width: 100%;
    }
    .row p + p {
      padding-top: 0.75rem;
      border-top: 1px dashed var(--border);
    }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="title">Mito y paisaje</div>

  <div class="font-controls">
    <button type="button" id="font-dec" aria-label="Decrease font size">A−</button>
    <span id="font-size-label">16px</span>
    <button type="button" id="font-inc" aria-label="Increase font size">A+</button>
  </div>

  <div class="col-headers">
    <span>Spanish, original</span>
    <span>English translation</span>
  </div>

  <div id="paras"></div>
</div>

<script>
const DATA = [{"orig": "INTI", "trans": "INTI"}, {"orig": "El alma, la vida es como el ultravioleta de la pura visión. Por eso la imagen mítica no es una mera figura luminosa y remota, sino una presencia que irradia juntamente la luz y la vida. Por eso el sol —fúlgido, distante y fecundo— representa en el espacio celeste lo que representa el mito en el espacio del alma. Y por eso, en fin, los cultos solares ofrecen al estudioso de estas misteriosas expresiones de la esencia del hombre, un doble interés: el que despierta la visión mítica en sí misma y el que atañe a las relaciones sagradas y secretas entre el astro y la esfera vital donde luce.", "trans": "The soul, life itself, is like the ultraviolet of pure vision. That is why the mythic image is not a mere luminous and remote figure, but a presence that radiates light and life together. That is why the sun — resplendent, distant, and fecund — represents in celestial space what myth represents in the space of the soul. And that is why, in short, solar cults offer the student of these mysterious expressions of the essence of man a twofold interest: that awakened by the mythic vision in itself, and that which concerns the sacred and secret relations between the heavenly body and the vital sphere where it shines."}, {"orig": "Contemplado desde este punto de vista, el culto solar de los antiguos peruanos realiza una perfecta armonía entre la imagen y la vida, entre el sol como objeto físico de contemplación y el sol como encarnación propicia de potencias germinales y anímicas. Inti es el sol en la plenitud de su doble naturaleza: es el astro que brilla en el cielo y el antepasado legendario del Inca, el que infunde la vida en las plantas y el que impone a los hombres las reglas inviolables de la policía y del trabajo.", "trans": "Viewed from this standpoint, the solar cult of the ancient Peruvians achieves a perfect harmony between image and life, between the sun as a physical object of contemplation and the sun as the propitious incarnation of germinal and animic powers. Inti is the sun in the fullness of its twofold nature: he is the star that shines in the sky and the legendary ancestor of the Inca, he who infuses life into the plants and who imposes upon men the inviolable rules of order and labor."}, {"orig": "Como es sabido, los civilizadores míticos de los hombres, Manco Cápac y Mama Ocllo, son hijos del sol. De esta suerte, bajo el patronato solar se ponen todos los beneficios de la cultura, tanto los que derivan de la organización social como los que atañen al aprovechamiento de las potencias y de los frutos naturales. Y como, además, el sol es quien provoca en el seno de la tierra la germinación vegetal, resulta que hay una admirable continuidad en la marcha progresiva de la acción solar que, por mediación del Inca, pasa de la configuración meramente biológica de los seres a las realizaciones más altas y más específicamente humanas del espíritu.", "trans": "As is well known, the mythic civilizers of mankind, Manco Cápac and Mama Ocllo, are children of the sun. In this way, all the benefits of culture are placed under solar patronage, both those deriving from social organization and those concerning the harnessing of natural powers and fruits. And since, moreover, the sun is what provokes vegetal germination in the bosom of the earth, it follows that there is an admirable continuity in the progressive march of solar action which, through the mediation of the Inca, passes from the merely biological configuration of beings to the higher and more specifically human realizations of the spirit."}, {"orig": "Inti era un dios, pero el sentimiento metafísico de los indios jamás llegó a identificarlo con el supremo autor de las cosas. Ese supremo autor es Huiracocha quien hace salir del Lago en tinieblas juntamente al sol y a los hombres. Inti es así, como Apolo, un hijo de la noche. Como él, nace en medio de las olas, y hay asimismo en su destino algo que lo asemeja al dios helénico, puesto que Inti, como Apolo, debía irradiar, con la luz que suscita las formas del paisaje, la claridad que alumbra el ámbito interior de la vida.", "trans": "Inti was a god, but the metaphysical feeling of the Indians never went so far as to identify him with the supreme author of things. That supreme author is Huiracocha, who brings forth from the Lake, out of the darkness, both the sun and men together. Inti is thus, like Apollo, a child of the night. Like Apollo, he is born amid the waves, and there is likewise something in his destiny that resembles the Hellenic god, since Inti, like Apollo, was to radiate, together with the light that calls forth the forms of the landscape, the clarity that illumines the inner realm of life."}, {"orig": "El paisaje serrano con su geología atormentada y su cielo de indescriptible pureza nos proporciona como un primer fundamento de la veneración de los indios peruanos por el sol. El sol es la luz que inunda el espacio, ahuyenta las sombras temibles de la noche, reverbera en las nieves eternas e infunde una como majestuosa plenitud sobre el horizonte de las mesetas desoladas. El sol es el color y la forma, es el esplendor integral, el punto supremo, dominador del firmamento.", "trans": "The mountain landscape, with its tormented geology and its sky of indescribable purity, provides us with a kind of first foundation for the Peruvian Indians' veneration of the sun. The sun is the light that floods space, drives away the fearsome shadows of night, glitters upon the eternal snows and instills a kind of majestic fullness over the horizon of the desolate high plateaus. The sun is color and form, it is integral splendor, the supreme point, ruler of the firmament."}, {"orig": "Por otra parte, el sol es el ígneo dispensador del calor y del fuego, título eminente a la adoración en las altas regiones de la sierra donde el aire es glacial y reina la nieve durante una gran parte del año. El paisaje y el clima despertaron, pues, en el habitante de la sierra la adoración del sol.", "trans": "On the other hand, the sun is the fiery dispenser of heat and fire, an eminent title to adoration in the high regions of the sierra, where the air is glacial and snow reigns for a great part of the year. Landscape and climate thus awakened, in the dweller of the sierra, the adoration of the sun."}, {"orig": "Pero los indios adoraban de modo principal al sol naciente. Como los licios, amaban la natividad solar y gustaban de contemplar el astro, en la tierna semioscuridad de su aparición, \"húmedo como un niño\". Tenían que impresionar a los indios peruanos esas magníficas y puras auroras de la sierra, esa inexpresable transfiguración de la tiniebla en claridad, ese solemne crescendo sinfónico que, envolviendo en su inmensa unidad todas las formas y todas las incipientes tonalidades del color, pasa del abismo sombrío de la noche al violeta, al celeste, al azul y en fin a la pura luz en que cada cosa tiene su propia coloración y suena como una voz libre, feliz, incontenible en la triunfal algarabía del cosmos.", "trans": "But the Indians worshipped chiefly the rising sun. Like the Lycians, they loved the solar nativity and delighted in contemplating the star in the tender half-darkness of its appearance, \"moist as a newborn child.\" Those magnificent and pure dawns of the sierra must have struck the Peruvian Indians deeply — that inexpressible transfiguration of darkness into brightness, that solemn symphonic crescendo which, enfolding in its immense unity all the forms and all the incipient tonalities of color, passes from the somber abyss of night to violet, to pale blue, to azure, and finally to the pure light in which each thing has its own coloring and sounds like a free voice, joyful, unrestrainable, amid the triumphant clamor of the cosmos."}, {"orig": "Y en esa adoración se manifestaban sin duda sus aspiraciones más secretas e íntimas. En ese cotidiano nacimiento del sol se exaltaba, seguramente, la melancólica humildad de la raza. Para el indio era el espectáculo supremo, la epifanía cuyo esplendor distante deslumbraba su visión y compensaba con su gratuita abundancia la oscura limitación de la existencia. El nacimiento del sol era para el indio una hora santa, un momento de embriaguez y de plenitud en que por obra de la luz alcanzaba la participación extática en el arcano inexpresable del mundo.", "trans": "And in that adoration their most secret and intimate longings were, without doubt, made manifest. In that daily birth of the sun the melancholy humility of the race was surely exalted. For the Indian it was the supreme spectacle, the epiphany whose distant splendor dazzled his vision and compensated, with its gratuitous abundance, for the obscure limitation of existence. The birth of the sun was for the Indian a holy hour, a moment of intoxication and fullness in which, through the working of light, he attained ecstatic participation in the inexpressible mystery of the world."}, {"orig": "Los adoradores de Mitra, el genio de la luz, a quien los romanos llamaban \"sol invictus\", sacrificaban, en sus ritos ocultos y nocturnos, un toro cuya sangre era para los iniciados, alimento de vida inmortal. Ese sacrificio se hacía en conmemoración de una hazaña del dios consistente en haber dado muerte a un toro fabuloso y haber provocado con su sangre la vida terrestre. El rito era, en cierto modo, una renovación de la hazaña divina y se integraba con un complejo simbolismo astral y metafísico. Los adoradores peruanos del sol sacrificaban al astro en cada amanecer una llama, la cual era inmolada con la cabeza dirigida hacia el levante.", "trans": "The worshippers of Mithras, the genius of light, whom the Romans called \"sol invictus,\" sacrificed, in their hidden and nocturnal rites, a bull whose blood was, for the initiated, the nourishment of immortal life. That sacrifice was performed in commemoration of a feat of the god, who had slain a fabulous bull and, with its blood, had brought forth earthly life. The rite was, in a sense, a renewal of that divine feat, and it was bound up with a complex astral and metaphysical symbolism. The Peruvian worshippers of the sun sacrificed to the star each dawn a llama, which was immolated with its head turned toward the east."}, {"orig": "Y he aquí como la mera observación de este sacrificio sencillo, parece entregarnos la revelación del pathos que caracterizaba la religión solar de los peruanos. Esta ofrenda de la llama era, quién sabe, una ofrenda de salutación a Inti, o tal vez un sacrificio mágico con el objeto de provocar o acelerar el nacimiento del sol, o quizá también un acto propiciatorio para obtener en las horas venideras los ansiados beneficios del astro. De todos modos era un sacrificio matinal, símbolo de un anhelo primitivo y triste que busca la luz, aspira al calor y paga con la cruenta inmolación del animal bien amado el advenimiento cotidiano del sol. Por donde se ve que mientras el sacrificio mitríaco es un símbolo de inspiración dualística y agónica, puesto que la muerte del animal constituía la condición necesaria de la vida, el rito peruano es un simple acto de adoración, un voto materializado, un dolor que se ofrece en la humildad y que, al igual que las sombras de la noche, disipa sin esfuerzo la claridad del día.", "trans": "And here we see how the mere observation of this simple sacrifice seems to deliver to us the revelation of the pathos that characterized the solar religion of the Peruvians. This offering of the llama was, who knows, an offering of salutation to Inti, or perhaps a magical sacrifice meant to provoke or hasten the birth of the sun, or perhaps also a propitiatory act to obtain, in the hours to come, the longed-for benefits of the star. In any case it was a morning sacrifice, the symbol of a primitive and sorrowful yearning that seeks light, aspires to warmth, and pays, through the bloody immolation of the beloved animal, for the daily coming of the sun. Whence it may be seen that while the Mithraic sacrifice is a symbol of dualistic and agonistic inspiration — since the death of the animal constituted the necessary condition of life — the Peruvian rite is a simple act of adoration, a materialized vow, a sorrow offered in humility, which, like the shadows of night, dissolves effortlessly before the clarity of day."}, {"orig": "Inti es la potencia cósmica de la universal bendición. Ese carácter beneficente, pródigo, gratuito de la acción solar lo sentían los peruanos no sólo en el esplendor del paisaje y en los dones preciosos de la tierra, no sólo creían reconocerlo en la sabia organización paternal que presidía el Inca; lo percibían, por modo singular, en las propias ceremonias del culto que no simbolizaban únicamente la veneración y la gratitud de los mortales sino que, como lo ha visto muy bien Garcilaso, constituían en muchas ocasiones fiestas suntuosas y abundantes banquetes con que el sol regalaba a sus hijos.", "trans": "Inti is the cosmic power of universal blessing. That beneficent, prodigal, gratuitous character of solar action the Peruvians felt not only in the splendor of the landscape and in the precious gifts of the earth; nor did they merely believe they recognized it in the wise paternal organization presided over by the Inca — they perceived it, in a singular way, in the very ceremonies of the cult, which symbolized not only the veneration and gratitude of mortals but also, as Garcilaso so well observed, constituted on many occasions sumptuous feasts and abundant banquets with which the sun regaled his children."}, {"orig": "Tal era por excelencia, el Intip Raimi (la fiesta del Inti) que se celebraba en el Cuzco pasado el solsticio de junio. Entonces, al despuntar el sol, el Inca brindaba en su copa de oro, con su padre. Luego el propio emperador, ya no como hijo del sol sino como representante de la divinidad, brindaba con sus nobles y después con el pueblo. Por manera que en la chicha ritual se desparramaba el regalo, se difundía la bendición paternal del astro, que de esa suerte se ofrecía cual una dádiva suprema en el licor sagrado engendrador del entusiasmo y en el deslumbrante apogeo matinal de la luz.", "trans": "Such was, par excellence, the Intip Raimi (the feast of Inti), which was celebrated in Cuzco after the June solstice. Then, at the break of the sun, the Inca would drink a toast in his golden cup with his father. Afterward the emperor himself, no longer as son of the sun but as representative of the divinity, would drink a toast with his nobles and then with the people. So that in the ritual chicha the gift was scattered abroad, the paternal blessing of the star was spread, offering itself thus as a supreme gift in the sacred liquor that engendered enthusiasm, amid the dazzling morning zenith of the light."}, {"orig": "El sol de la sierra posee una admirable potencia de configuración plástica. Talla, define las apariencias del paisaje. Pule las superficies y afila las aristas de las rocas. Recorta sobre el cielo profundo el perfil de la lejana cordillera, colma de sombras los abismos. Y lo más prodigioso: parece que su luz impusiera silencio a las cosas y les confiriera una como solemne y vibrante inmovilidad.", "trans": "The sun of the sierra possesses an admirable power of plastic configuration. It carves and defines the appearances of the landscape. It polishes surfaces and hones the edges of the rocks. It cuts out against the deep sky the profile of the distant cordillera, and fills the abysses with shadow. And most wondrous of all: its light seems to impose silence upon things and to confer upon them a kind of solemn, vibrant immobility."}, {"orig": "De esta suerte fulge Inti en el espacio de la naturaleza y en el ámbito anímico como el elemento supremo de estabilidad y de perfección. De él parten los rayos de la energía configuradora y vivificante, a él vuelven —como los áureos reflejos del ídolo que se venera en el Coricancha— las miradas y las plegarias de los hombres, por él se mantiene, orgánica y armónica, la economía secular del imperio. Y así, como lo nota profundamente Klages, el sol y el Inca, que es su encarnación sobre la tierra, son el centro vital, la cabeza y el corazón del círculo cósmico y humano que gira en torno a su fascinante majestad.", "trans": "In this way Inti blazes in the space of nature and in the realm of the soul as the supreme element of stability and perfection. From him spring the rays of configuring, vivifying energy; to him return — like the golden reflections of the idol venerated in the Coricancha — the gazes and prayers of men; through him is maintained, organic and harmonious, the age-old economy of the empire. And thus, as Klages profoundly observes, the sun and the Inca, who is its incarnation upon earth, are the vital center, the head and the heart of the cosmic and human circle that turns about its fascinating majesty."}, {"orig": "Por todo lo cual, el mito de Inti y las ceremonias rituales con que se saludaba su aparición, nos revela con viva claridad algo que acaso constituye el principio fundamental de la conciencia mítica, a saber: que ella es siempre una conciencia de la totalidad concreta de la vida, totalidad que vibra en la luminosa irradiación de sus imágenes. Los indios, que se extasiaban ante la aparición deslumbrante de Inti, vivían en esa visión toda la vida. El sol brillaba desde el fondo de su pasado legendario como brillaba desde el fondo del cielo, y al levantarse sobre las crestas de los Andes vertía una luz que no era simplemente luz, sino alma. El paisaje iba brotando del seno de la noche, también como un niño, mientras los indios prosternados y absortos aspiraban la húmeda ternura maternal de la tierra.", "trans": "For all these reasons, the myth of Inti and the ritual ceremonies with which his appearance was greeted reveal to us with vivid clarity something that perhaps constitutes the fundamental principle of mythic consciousness, namely: that it is always a consciousness of the concrete totality of life, a totality that vibrates in the luminous irradiation of its images. The Indians, who fell into ecstasy before the dazzling appearance of Inti, lived their whole life within that vision. The sun shone forth from the depths of its legendary past just as it shone from the depths of the sky, and as it rose over the crests of the Andes it poured forth a light that was not merely light, but soul. The landscape emerged, little by little, from the bosom of night, itself like a newborn child, while the Indians, prostrate and absorbed, breathed in the moist maternal tenderness of the earth."}];

const container = document.getElementById('paras');

function pageMark(num) {
  const span = document.createElement('span');
  span.className = 'page-mark';
  span.textContent = ' [' + num + '] ';
  return span;
}

function snapToWord(text, pos) {
  if (pos <= 0) return 0;
  if (pos >= text.length) return text.length;
  if (text[pos] === ' ') return pos;
  let lo = pos - 1, hi = pos + 1;
  while (lo > 0 && text[lo] !== ' ') lo--;
  while (hi < text.length && text[hi] !== ' ') hi++;
  return (pos - lo <= hi - pos) ? lo : hi;
}

DATA.forEach((d) => {
  const row = document.createElement('div');
  row.className = 'row';

  const orig = document.createElement('p');
  const trans = document.createElement('p');

  if (d.page_mid) {
    const offset = d.mid_offset;
    const origPre  = d.orig.slice(0, offset);
    const origPost = d.orig.slice(offset);
    const ratio = offset / d.orig.length;
    const transOffset = snapToWord(d.trans, Math.round(d.trans.length * ratio));
    const transPre  = d.trans.slice(0, transOffset);
    const transPost = d.trans.slice(transOffset);
    orig.append(origPre, pageMark(d.page_mid), origPost);
    trans.append(transPre, pageMark(d.page_mid), transPost);
  } else {
    orig.textContent  = d.orig;
    trans.textContent = d.trans;
  }

  row.appendChild(orig);
  row.appendChild(trans);
  container.appendChild(row);

  if (d.page_after) {
    const nums = Array.isArray(d.page_after) ? d.page_after : [d.page_after];
    nums.forEach((num) => {
      const marker = document.createElement('div');
      marker.className = 'page-row';
      marker.appendChild(pageMark(num));
      container.appendChild(marker);
    });
  }
});

// ── Adjustable font size ────────────────────────────────────────────────
(function () {
  const MIN = 12, MAX = 28, STEP = 1;
  const root = document.documentElement;
  const label = document.getElementById('font-size-label');
  const stored = parseInt(localStorage.getItem('mito-font-size'), 10);
  let size = Number.isFinite(stored) ? Math.min(MAX, Math.max(MIN, stored)) : 16;

  function apply() {
    root.style.setProperty('--row-font-size', size + 'px');
    label.textContent = size + 'px';
    localStorage.setItem('mito-font-size', size);
  }

  document.getElementById('font-inc').addEventListener('click', () => {
    size = Math.min(MAX, size + STEP);
    apply();
  });
  document.getElementById('font-dec').addEventListener('click', () => {
    size = Math.max(MIN, size - STEP);
    apply();
  });

  apply();
})();
</script>

</body>
</html>
