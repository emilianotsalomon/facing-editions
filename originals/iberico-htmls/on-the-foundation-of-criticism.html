<style>
/* ── Design tokens ───────────────────────────────────────────────────────── */
:root {
  /* Light palette — cool slate ground, antique-gold accent */
  --bg:         #ECEDF2;
  --bg-body:    #ECEDF2;
  --bg-alt:     #E4E5EC;
  --bg-panel:   #F2F2F7;

}

    --bg-alt:     #171626;

    --accent-hl:  #D9A85A;
    --rule:       #2E2B42;
    --rule-faint: #252338;
  }
}

:root[data-theme="dark"] {
  --bg:         #100F1C;
  --bg-body:    #100F1C;
  --bg-alt:     #171626;
  --bg-panel:   #1C1B2C;
  --text:       #E2DFEE;
  --text-muted: #8A86A4;
  --accent:     #C0904A;
  --accent-hl:  #D9A85A;

}

:root[data-theme="light"] {
  --bg:         #ECEDF2;

  --bg-alt:     #E4E5EC;

}

/* ── Reset & base ────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg-body);
  color: var(--text);
  font-family: var(--serif-body);
  line-height: var(--lh);
  padding-bottom: 6rem;
  min-height: 100vh;
}

/* ── Controls ────────────────────────────────────────────────────────────── */
.controls {
  position: fixed;
  top: 1.1rem;
  right: 1.25rem;
  display: flex;
  gap: 0.3rem;
  align-items: center;
  z-index: 200;
}

.ctrl-btn, .theme-btn {
  font-family: var(--sans);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: var(--bg-panel);
  border: 1px solid var(--rule);
  color: var(--text-muted);
  border-radius: 3px;
  padding: 0.3rem 0.6rem;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  line-height: 1;
}
.ctrl-btn:hover, .theme-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--bg);
}
.ctrl-sep {
  width: 1px;
  height: 1.2rem;
  background: var(--rule);
  margin: 0 0.1rem;
}

/* ── Masthead ─────────────────────────────────────────────────────────────── */
.masthead {
  max-width: 760px;
  margin: 0 auto;
  padding: 5rem 2rem 3.5rem;
  text-align: center;
}

.eyebrow {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
  display: block;
  margin-bottom: 1.4rem;
}

.main-title {
  font-family: var(--serif-display);
  font-size: clamp(1.9rem, 4.5vw, 3rem);
  font-weight: 600;
  font-style: italic;
  line-height: 1.18;
  color: var(--text);
  letter-spacing: 0.01em;
  text-wrap: balance;
  margin-bottom: 0.5rem;
}

.title-orig {
  font-family: var(--serif-display);
  font-size: clamp(0.95rem, 2vw, 1.15rem);
  font-weight: 400;
  font-style: italic;
  color: var(--text-muted);
  display: block;
  margin-bottom: 2.4rem;
  letter-spacing: 0.01em;
}

.masthead-rule {
  display: flex;
  align-items: center;
  gap: 1rem;
  justify-content: center;
}
.masthead-rule::before,
.masthead-rule::after {
  content: '';
  flex: 1;
  max-width: 140px;
  height: 1px;
  background: var(--rule);
}
.masthead-rule-diamond {
  width: 6px;
  height: 6px;
  background: var(--accent);
  transform: rotate(45deg);
  opacity: 0.65;
  flex-shrink: 0;
}

/* ── Column header bar ────────────────────────────────────────────────────── */
.col-bar {
  max-width: 1240px;
  margin: 2.4rem auto 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-top: 1px solid var(--rule);
  padding: 0;
  position: relative;
}

.col-bar::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  width: 1px;
  height: 100%;
  background: var(--rule);
}

.col-label {
  font-family: var(--sans);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 0.7rem 2rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.col-label-flag {
  display: inline-block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.7;
  flex-shrink: 0;
}

.col-label:last-child {
  justify-content: flex-end;
}
.col-label:last-child .col-label-flag {
  order: 2;
}

/* ── Main paragraph grid ──────────────────────────────────────────────────── */
.paras {
  max-width: 1240px;
  margin: 0 auto;
  position: relative;
}

/* Single continuous vertical rule at the column boundary */
.paras::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--rule);
  pointer-events: none;
}

/* Paragraph rows */
.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 1.05rem 0;
  align-items: start;
  border-top: 1px solid var(--rule-faint);
  transition: background 0.12s;
}

.row:first-child {
  border-top: 1px solid var(--rule);
}

.row:hover {
  background: var(--bg-alt);
}

.row p {
  font-family: var(--serif-body);
  font-size: var(--fs);
  line-height: var(--lh);
  padding: 0 2rem;
  margin: 0;
  hyphens: auto;
  color: var(--text);
}

.row p:last-child {
  color: var(--text);
  opacity: 0.9;
}

/* Numbered questions — styled as inset callouts */
.row.is-question {
  padding: 0.7rem 0;
  background: var(--bg-alt);
}

.row.is-question p {
  font-family: var(--serif-display);
  font-style: italic;
  font-size: calc(var(--fs) * 1.05);
  color: var(--text);
  padding: 0.5rem 2rem 0.5rem 2.4rem;
  border-left: 2px solid var(--accent);
  margin: 0 1rem;
  opacity: 1;
}
.row.is-question p:first-child {
  border-left: 2px solid var(--accent);
}
.row.is-question p:last-child {
  border-left: 2px solid var(--accent);
  opacity: 0.85;
}

/* Section dividers (all-caps) */
.section-div {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-top: 1px solid var(--rule);
  margin-top: 1rem;
}

.section-div .s-orig,
.section-div .s-trans {
  font-family: var(--sans);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  padding: 0.7rem 2rem;
}

/* Page markers */
.page-row {
  max-width: 1240px;
  margin: 0 auto;
  text-align: center;
  padding: 0.2rem 0;
}
.page-mark {
  font-family: var(--sans);
  font-size: 10px;
  color: var(--text-muted);
  opacity: 0.5;
}

/* ── Responsive ────────────────────────────────────────────────────────────── */
@media (max-width: 680px) {
  .masthead { padding: 3.5rem 1.5rem 2.5rem; }
  .col-bar, .row, .row.is-question, .section-div { grid-template-columns: 1fr; }
  .paras::before, .col-bar::after { display: none; }
  .col-bar { display: none; }

  .row p:first-child {
    border-bottom: 1px solid var(--rule-faint);
    padding-bottom: 1rem;
  }
  .row p:last-child {
    padding-top: 1rem;
    opacity: 1;
  }
  .row.is-question p:last-child { opacity: 0.85; }
  .section-div .s-trans { padding-top: 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

<script>
const DATA = [{"orig": "La filosofía de la crítica oscila entre estos dos extremos: el dogmatismo que, postulando la existencia de normas, principios, leyes estéticas de carácter absoluto y objetivo, considera que la tarea crítica debe consistir fundamentalmente en una confrontación entre el principio general y el caso concreto que constituye la obra de arte, y el subjetivismo que, no admitiendo la existencia de principios estéticos objetivos, asigna a la crítica, como función propia, la descripción de las impresiones personales del crítico ante la obra. El dogmatismo cuyo origen mas o menos confesado o negado es la filosofía de Platón es intelectualista. Los principios o normas estéticas en que se funda son fórmulas que la inteligencia comprende y justifica y la valuación crítica es en el fondo un proceso de reducción lógica destinada a incluir el caso concreto en la idea o norma general a que obedece. El subjetivismo, en cambio es de naturaleza afectiva. Lo que podríamos llamar su criterio de valor consiste en el placer o desplacer, en la finura o la rareza de las impresiones suscitadas en el alma del contemplador por el objeto estético, y su obra crítica en una como lírica confidencia de esas resonancias interiores.", "trans": "The philosophy of criticism oscillates between two extremes: the dogmatism that, postulating the existence of norms, principles, aesthetic laws of an absolute and objective character, holds that the critical task must consist fundamentally in a confrontation between the general principle and the concrete case that constitutes the work of art; and the subjectivism that, not admitting the existence of objective aesthetic principles, assigns to criticism, as its proper function, the description of the critic's personal impressions before the work. Dogmatism, whose more or less avowed or denied origin is the philosophy of Platón, is intellectualist. The aesthetic principles or norms on which it rests are formulas that the intellect comprehends and justifies, and critical valuation is at bottom a process of logical reduction designed to subsume the concrete case under the idea or general norm to which it answers. Subjectivism, by contrast, is affective in nature. What we might call its criterion of value consists in the pleasure or displeasure, in the fineness or strangeness of the impressions aroused in the contemplator's soul by the aesthetic object, and its critical work in something like a lyrical confiding of those inner resonances."}, {"orig": "Es verdad que la crítica no realiza nunca en su pureza ninguna de estas dos posibilidades. Ni el dogmatismo puede mantenerse en una esfera de pura confrontación intelectual y objetiva, ni el subjetivismo puede renunciar de modo absoluto a dar a sus reacciones afectivas una cierta significación objetiva, ni a justificar o explicar por razones de orden intelectual, sus líricas impresiones de arte. Dogmatismo y subjetivismo son así dos extremos meramente teóricos que no se compadecen con la realidad psicológica y estética del fenómeno crítico.", "trans": "It is true that criticism never realizes in its purity either of these two possibilities. Dogmatism cannot sustain itself in a sphere of pure intellectual and objective confrontation, nor can subjectivism absolutely renounce giving its affective reactions a certain objective significance, or justifying and explaining its lyrical impressions of art through reasons of an intellectual order. Dogmatism and subjectivism are thus two merely theoretical extremes that cannot be reconciled with the psychological and aesthetic reality of the critical phenomenon."}, {"orig": "¿Dónde está entonces la verdad? ¿En una solución intermedia o mas bien ecléctica que considere la crítica como un producto de la colaboración entre la razón y el corazón, entre el intelecto y la afectividad? No lo pensamos, porque aun admitiendo que en la crítica exista una colaboración entre la razón y el corazón, ese eclecticismo deja sin solucionar estas dos preguntas que constituyen el núcleo de toda la problemática estética y que son a saber:", "trans": "Where, then, does the truth lie? In an intermediate or rather eclectic solution that considers criticism as a product of the collaboration between reason and the heart, between intellect and affectivity? We do not think so, because even granting that in criticism there exists a collaboration between reason and the heart, that eclecticism leaves unsolved these two questions that constitute the nucleus of all aesthetic problematics and which are, to wit:", "question": true}, {"orig": "1ª. ¿Existe una esfera objetiva de valores estéticos?", "trans": "1st. Does an objective sphere of aesthetic values exist?", "question": true}, {"orig": "2ª. ¿Qué facultad del alma decide en último análisis sobre el valor o el no valor estético de una obra?", "trans": "2nd. What faculty of the soul decides in the last analysis on the aesthetic value or non-value of a work?", "question": true}, {"orig": "La mera existencia de la crítica, es decir de una actividad que formula juicios de valor y, sobre todo que los comunica a los demás con propósitos de convencimiento, está probando que sea cual fuere la escuela de crítica estética a que se pertenezca, se admita una cierta objetividad del fenómeno estético, objetividad capaz de ser percibida y gustada por todos. De lo cual resulta, por modo evidente que en toda manifestación crítica se da un dogmatismo subyacente. O dicho de otro modo que toda actividad crítica postula la existencia de una esfera de valores, por encima de la simple subjetividad intelectual.", "trans": "The mere existence of criticism — that is, of an activity that formulates value judgments and, above all, communicates them to others with the aim of persuasion — demonstrates that, whatever school of aesthetic criticism one belongs to, a certain objectivity of the aesthetic phenomenon is admitted, an objectivity capable of being perceived and savored by all; from which it results, in an evident manner, that in every critical manifestation there exists an underlying dogmatism, or, stated otherwise, that every critical activity postulates the existence of a sphere of values above mere intellectual subjectivity."}, {"orig": "Pero si admitimos que en toda actividad crítica exista un dogmatismo subyacente, nos encontramos con una seria dificultad al pretender definir la naturaleza de ese dogmatismo. Parece que todo dogmatismo debe ser de naturaleza intelectual, diremos mejor, racional. Es la razón quien define los principios absolutos y quien, además, juzga los hechos y los aprecia según la medida en que esos hechos realizan los imperativos implícitos en los principios fundamentales del conocimiento o de la práctica. Lo cual se opone a las enseñanzas de la Psicología Estética según las cuales la reacción de este nombre es de naturaleza esencialmente emocional, afectiva. Y así, si nos quedamos con el dogmatismo caemos en el intelectualismo que falsea la realidad psicológica de la reacción estética y si nos quedamos con el subjetivismo caemos en la desorientación en cuanto se refiere a la naturaleza de la objetividad estética y sobre todo en cuanto al fundamento de nuestra aprobación o desaprobación, puesto que según un viejo lugar común que todos aceptan sin discutir \"la emoción es ciega\".", "trans": "But if we admit that in every critical activity there exists an underlying dogmatism, we find ourselves in serious difficulty when we attempt to define the nature of that dogmatism. It would seem that every dogmatism must be intellectual in nature — or better, rational: it is reason that defines the absolute principles and that, furthermore, judges facts and appraises them according to the degree to which those facts realize the imperatives implicit in the fundamental principles of knowledge or of practice — which stands in opposition to the teachings of Aesthetic Psychology, according to which the reaction of that name is essentially emotional and affective in nature; and so, if we hold to dogmatism we fall into the intellectualism that distorts the psychological reality of the aesthetic reaction, and if we hold to subjectivism we fall into disorientation with regard to the nature of aesthetic objectivity and above all with regard to the foundation of our approval or disapproval, since, according to an old commonplace that all accept without question, \"emotion is blind.\""}, {"orig": "Hay pues que buscar una solución que sin desconocer la naturaleza emocional del fenómeno estético, sea capaz al propio tiempo de explicar por qué la crítica aspira a formular apreciaciones de validez objetiva, y no simples efusiones impresionistas, y nos parece que esta solución podría encontrarse en la teoría de la intencionalidad emocional de Max Scheler.", "trans": "There is therefore a solution to be sought that, without ignoring the emotional nature of the aesthetic phenomenon, is capable at the same time of explaining why criticism aspires to formulate appraisals of objective validity and not mere impressionistic effusions; and it seems to us that this solution might be found in Max Scheler's theory of emotional intentionality."}, {"orig": "Pensadores eminentes — San Agustín, Pascal — reconocieron la naturaleza intuitiva cognoscitiva de la emoción, y diferenciaron por características esenciales, la intuición emocional del conocimiento intelectual. Recordemos las \"razones del corazón\" de que habla Pascal y que la razón no conoce. Pero por lo general permanece ignorada por filósofos y psicólogos esta calidad de intuición extra-intelectual de la emoción, y se la considera (Descartes) como una forma inferior, confusa de la inteligencia o se la considera (siglo XIX) como totalmente ciega. La importancia de la teoría de Max Scheler consiste por eso, en haber puesto en claro este carácter intuitivo de la emoción y en haber determinado con extraordinaria profundidad y finura las diversas categorías y los distintos grados del mundo emocional. Por lo cual y teniendo en cuenta que Max Scheler ha definido en forma admirable los tipos de las aprehensiones emocionales y ha vislumbrado al par que su riqueza su unidad jerárquica, puede llamársele con justicia el Platón del mundo emocional.", "trans": "Eminent thinkers — San Agustín, Pascal — recognized the intuitive, cognitive nature of emotion and differentiated, by essential characteristics, emotional intuition from intellectual knowledge. Let us recall the \"reasons of the heart\" of which Pascal speaks and which reason does not know. But in general this quality of extra-intellectual intuition belonging to emotion remains unknown to philosophers and psychologists; it is regarded (Descartes) as an inferior, confused form of intelligence, or it is regarded (the nineteenth century) as totally blind. The importance of Max Scheler's theory consists, for that reason, in having clarified this intuitive character of emotion and in having determined with extraordinary depth and fineness the diverse categories and the different degrees of the emotional world; on which account, and bearing in mind that Max Scheler has defined in admirable form the types of emotional apprehensions and has glimpsed at once their richness and their hierarchical unity, he may justly be called the Platón of the emotional world."}, {"orig": "Antes de referirnos a su aplicación al problema de la crítica digamos brevemente en qué consiste la doctrina de la intencionalidad de los actos emocionales.", "trans": "Before addressing its application to the problem of criticism, let us state briefly what the doctrine of the intentionality of emotional acts consists in."}, {"orig": "El término intencionalidad, que Scheler no emplea en el sentido corriente de fin propuesto a la acción moral sino mas bien en un sentido afín al que le conferían los escolásticos, es la referencia a algo heterogéneo a la conciencia misma pero que en el acto de la aprehensión emotiva se da inmediatamente, sin el intermediario de la función intelectual. Así mediante la emoción podemos aprehender algo que está más allá de la emoción misma, pero que no es una idea, una noción, sino algo esencialmente irreductible a la categoría de los objetos intelectuales, algo que solo la emoción puede entregarnos y que es a saber: el valor. Así aprehendemos los valores de lo suntuoso, lo noble, lo bello, que no son cosas materiales ni conceptos, pero que no son tampoco meros caprichos de la sensibilidad sino esencias cuyo único órgano de percepción es la emoción.", "trans": "The term intentionality, which Scheler employs not in the ordinary sense of an end proposed to moral action but rather in a sense akin to that which the scholastics conferred upon it, is the reference to something heterogeneous to consciousness itself yet which in the act of emotive apprehension is given immediately, without the intermediary of the intellectual function. Thus through emotion we can apprehend something that lies beyond emotion itself, yet which is not an idea, a notion, but something essentially irreducible to the category of intellectual objects, something that only emotion can deliver to us and which is, to wit: value. Thus we apprehend the values of the sumptuous, the noble, the beautiful — which are neither material things nor concepts, yet are not mere caprices of sensibility either, but essences whose sole organ of perception is emotion."}, {"orig": "De lo expuesto, pueden inferirse los principales caracteres de las aprehensiones emocionales: 1º. Son aprehensiones de carácter irracional, es decir que se refieren a contenidos absolutamente inaccesibles a la intencionalidad intelectual; 2º. No son aprehensiones de existencia sino aprehensiones de valor; 3º. Se dan como los extremos de una polaridad entre el sí y el no: lo bello, lo feo, lo noble, lo bajo; 4º. Las aprehensiones emocionales se nos dan como aprehensiones de más o de menos en la escala de cada valor en particular y de superioridad y de inferioridad en el mundo total de los valores; tienen un fundamento a priori; 5º. Las aprehensiones emocionales son eternas, en otros términos se reclaman del carácter extratemporal de los valores y de la esencia misma del acto emocional.", "trans": "From what has been set forth, the principal characteristics of emotional apprehensions may be inferred: 1st. They are apprehensions of an irrational character, that is, they refer to contents absolutely inaccessible to intellectual intentionality; 2nd. They are not apprehensions of existence but apprehensions of value; 3rd. They are given as the extremes of a polarity between yes and no: the beautiful, the ugly, the noble, the base; 4th. Emotional apprehensions are given to us as apprehensions of more or less on the scale of each particular value and of superiority and inferiority in the total world of values; they have an a priori foundation; 5th. Emotional apprehensions are eternal — in other terms, they partake of the extra-temporal character of values and of the very essence of the emotional act."}, {"orig": "En la jerarquía de los valores Scheler coloca los estéticos en el plano de los valores espirituales, que están por encima de los que se refieren a lo agradable y a lo útil y en situación de inferioridad con respecto a los valores de lo sagrado.", "trans": "In the hierarchy of values, Scheler places the aesthetic in the plane of spiritual values, which stand above those pertaining to the agreeable and the useful and in a position of inferiority with respect to the values of the sacred."}, {"orig": "Y bien, la crítica sería el ejercicio de la intuición emocional en la esfera del arte. Esta intuición descubre valores, valores objetivos puesto que ellos no se dan como simples modos de ser de la emoción sino como sus objetos intencionales. Con lo cual resultan superados así el dogmatismo intelectualista como el subjetivismo impresionista, porque la crítica no es ni una fría deducción académica ni una lírica transcripción de movimientos temperamentales, sino la expresión de lo que vive el alma en el mundo de la verdadera realidad artística, donde la individualidad de la obra aparece como impregnada y suspendida en la atmósfera universal y eterna de los valores de lo bello. Con lo cual, además, se explican así la posibilidad como la dificultad de la participación de todos en los bienes de la belleza y del arte: la posibilidad, porque esos bienes se dan como objetivos universales y permanentes en el mundo del espíritu; la dificultad, porque al igual que la reminiscencia platónica la aprehensión emocional de los valores necesita ser despertada en el fondo del alma mediante una educación cuidadosa.", "trans": "And well, criticism would be the exercise of emotional intuition in the sphere of art. This intuition discovers values — objective values, since they are not given as mere modes of being of emotion but as its intentional objects — whereby both intellectualist dogmatism and impressionist subjectivism are overcome, because criticism is neither a cold academic deduction nor a lyrical transcription of temperamental movements, but rather the expression of what the soul lives in the world of true artistic reality, where the individuality of the work appears as impregnated and suspended in the universal and eternal atmosphere of the values of the beautiful; and thereby, moreover, both the possibility and the difficulty of everyone's participation in the goods of beauty and art are explained: the possibility, because those goods are given as universal and permanent objectives in the world of the spirit; the difficulty, because, like Platonic reminiscence, emotional apprehension of values needs to be awakened in the depths of the soul through a careful education."}, {"orig": "Al hacer estas breves indicaciones sobre la esencia de la crítica estética, hemos presentado el fenómeno crítico en su forma abstracta más simple. No ignoramos que la valuación estética se presenta, por regla general, rodeada de un aparato de erudición y de técnica. Se estudian la psicología del artista, su vida, las influencias que recibió y las que pudo ejercer; se analizan la forma y el contenido de la obra, se determinan sus dificultades, sus deficiencias y sus aciertos técnicos. Pero nos parece indispensable decir, que desde el punto de vista de la teoría que brevemente hemos expuesto, todo ese aparato erudito y técnico es útil y hasta necesario siempre que se limite a ser un dispositivo destinado a proyectar ante los ojos del espectador una imagen pura de la obra.", "trans": "In offering these brief indications about the essence of aesthetic criticism, we have presented the critical phenomenon in its most simple, abstract form. We are not unaware that aesthetic valuation presents itself, as a general rule, surrounded by an apparatus of erudition and technique: the psychology of the artist is studied, his life, the influences he received and those he may have exerted; the form and content of the work are analyzed; its difficulties, its deficiencies, and its technical achievements are determined. But it seems to us indispensable to say that, from the standpoint of the theory we have briefly set forth, all that erudite and technical apparatus is useful and even necessary, provided it limits itself to being a device designed to project before the eyes of the spectator a pure image of the work."}, {"orig": "Y en fin agregamos que esta teoría se suma al empeño de la filosofía contemporánea por reivindicar la objetividad del espíritu, o sea la objetividad de los valores que, para emplear un lenguaje aristotélico, podemos llamar las formas finales y supremas de la vida emocional.", "trans": "And finally we add that this theory joins the effort of contemporary philosophy to vindicate the objectivity of the spirit — that is, the objectivity of those values that, to employ an Aristotelian language, we may call the final and supreme forms of emotional life."}];

const container = document.getElementById('paras');
const root = document.documentElement;

// Safe localStorage
const store = {
  get(k, fb) { try { const v = localStorage.getItem(k); return v === null ? fb : v; } catch(e) { return fb; } },
  set(k, v)  { try { localStorage.setItem(k, v); } catch(e) {} },
};

// Font size
let fontSize = parseFloat(store.get('sbs2-fs', '16'));
fontSize = isFinite(fontSize) ? Math.min(22, Math.max(12, fontSize)) : 16;
function setFontSize(px) {
  fontSize = Math.max(12, Math.min(22, px));
  root.style.setProperty('--fs', fontSize + 'px');
  store.set('sbs2-fs', fontSize);
}
root.style.setProperty('--fs', fontSize + 'px');
document.getElementById('fontDown').addEventListener('click', () => setFontSize(fontSize - 1));
document.getElementById('fontUp').addEventListener('click',   () => setFontSize(fontSize + 1));

// Detect short numbered questions (1ª. / 2ª. etc.)
function isQuestion(s) {
  return /^[1-9][ªº][\.\s]/.test(s.trim()) || s.trim().length < 100;
}

// Render pairs
DATA.forEach((d) => {
  const row  = document.createElement('div');
  row.className = 'row' + (d.question || isQuestion(d.orig) ? ' is-question' : '');
  const orig  = document.createElement('p');
  const trans = document.createElement('p');
  orig.textContent  = d.orig;
  trans.textContent = d.trans;
  row.appendChild(orig);
  row.appendChild(trans);
  container.appendChild(row);
});

// Theme
const themeBtn   = document.getElementById('themeBtn');
const savedTheme = store.get('sbs2-theme', null);
let dark = savedTheme !== null
  ? savedTheme === 'dark'
  : window.matchMedia('(prefers-color-scheme: dark)').matches;

function applyTheme(isDark) {
  root.setAttribute('data-theme', isDark ? 'dark' : 'light');
  themeBtn.textContent = isDark ? 'light' : 'dark';
  themeBtn.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
  store.set('sbs2-theme', isDark ? 'dark' : 'light');
}
applyTheme(dark);
themeBtn.addEventListener('click', () => { dark = !dark; applyTheme(dark); });
</script>
