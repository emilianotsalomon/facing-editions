ropias palabras: \"Yo no he venido a traer la paz sino la guerra.\" Pero tal vez en ninguna otra ocasión Jesucristo consagró tan bien en su persona la simiente inmortal de desesperación y de agonía cuando dijo: \"Yo soy el camino, la verdad y la vida.\" Porque, ¿se puede ser al mismo tiempo el camino, la verdad y la vida? ¿No es al contrario, la verdad enemiga de la vida? ¿Y no anunció Cristo al reunir en sí mismo los atributos de su persona y de su enseñanza, esta dolorosa división interior de quienes en El buscan la verdad y la vida?","trans":"The agonic character of Christ and of the sense of life that he establishes is already inseparably expressed in his own words: \"I have come not to bring peace but war.\" But perhaps in no other moment did Jesus Christ so well consecrate in his own person the immortal seed of desperation and agony as when he said: \"I am the way, the truth, and the life.\" For, can one be at the same time the way, the truth, and the life? Is not, on the contrary, truth the enemy of life? And did Christ not announce, by gathering into himself the attributes of his person and his teaching, that painful interior division in those who seek in him both truth and life?"},{"orig":"Esta división interior estaba preparada ya de mucho antes, con la fortaleza de esperanza que, entrando en pugna con la concepción de la vida antigua, había de generar un terrible debate agónico.","trans":"This interior division had been prepared long before, with the power of hope which, entering into conflict with the ancient conception of life, was bound to generate a terrible agonic debate."},{"orig":"Lo vemos en San Pablo, con caracteres de singular intensidad. En su alma combaten dos concepciones antagónicas de la inmortalidad: la concepción de origen judío que toma como base la resurrección de la carne, y la concepción de orígen griego, de carácter espiritual y pneumático. Lucha trágica, porque los términos de ella se confrontan, a la vez se oponen y se necesitan. De modo que al alma se le plantean estas dos urgencias contradictorias: la de abrazar los dos extremos del dilema, la de optar por uno de ellos solamente.","trans":"We see it in Saint Paul, with singular intensity. In his soul two antagonistic conceptions of immortality wage war: the conception of Jewish origin, which takes as its foundation the resurrection of the flesh, and the conception of Greek origin, spiritual and pneumatic in character. A tragic struggle, because the terms that confront each other simultaneously oppose and require one another. So the soul is presented with two contradictory urgencies: to embrace both extremes of the dilemma, or to choose only one of them."},{"orig":"El espíritu y la letra se oponen y se necesitan. Esa forma de inmortalidad espiritual que es la historia —perduración de la obra, influencia de la obra a través del tiempo— se combina con la forma de la inmortalidad de la carne que es la permanencia por obra de la generación física. Se oponen porque la virilidad carnal es en cierto modo hostil a la virginidad del espíritu; se necesitan porque el espíritu necesita de la materia: \"Y el Verbo se hizo carne y habitó entre nosotros.\"","trans":"Spirit and letter oppose and require one another. That form of spiritual immortality which is history — the endurance of the work, the influence of the work through time — is combined with the form of carnal immortality, which is permanence through physical generation. They oppose each other because carnal virility is in a certain way hostile to the virginity of the spirit; they require each other because the spirit needs matter: \"And the Word was made flesh and dwelt among us.\""},{"orig":"La enseñanza de Jesucristo era oral, pero vino la escritura y lo evangélico se hizo Biblia y nació la letra, enemiga del verbo viviente. San Pablo es el hombre de la letra, dice Unamuno en su libro, que frente a la religión puramente evangélica crea la religión bíblica. De la letra nace el dogma, y de la agonía del dogma nacen las herejías que lo combaten y por lo tanto lo afirman. La más grande de todas, la Reforma, que fue la explosión de la libertad, pero que restableciendo la vieja contradicción paulina, quiere resucitar en ella la palabra, sacar de la letra el verbo, de la historia el Evangelio. Con lo cual comienza una nueva agonía.","trans":"The teaching of Jesus Christ was oral, but the written word came and the evangelic became Scripture; the Bible was born and with it the letter, enemy of the living word. Saint Paul is the man of the letter, Unamuno says in his book — who, in opposition to the purely evangelical religion, creates the biblical religion. From the letter the dogma is born, and from the agony of dogma the heresies are born that combat it and therefore affirm it. The greatest of them all, the Reformation, was an explosion of freedom, but reestablishing the old Pauline contradiction, it seeks to revive in it the word, to extract from the letter the logos, from history the Gospel. Whereby a new agony begins."},{"orig":"Unamuno distingue en lo que podríamos llamar la materia histórica dos esferas de existencia: la realidad y la personalidad. La realidad es la existencia de las cosas tomadas en cierto modo en sí, fuera del espíritu que las contempla; la personalidad es la existencia comprendida como eficacia, como fecundidad espiritual. Don Quijote, por ejemplo, tiene más existencia personal que el propio Cervantes; pues si Cervantes existe en la historia, es gracias a la vida que en la personalidad de su fama y de su gloria le infunde Don Quijote. ¿Y Cristo? Cristo, nos dice Unamuno, existe en la cristiandad. Cristo es nuestro anhelo y nuestra esperanza, es nuestra alma que muere y resucita por obra del amor y del dolor. Cristo es nosotros mismos.","trans":"Unamuno distinguishes, in what we might call the historical substance, two spheres of existence: reality and personality. Reality is the existence of things considered in a certain way in themselves, outside the spirit that contemplates them; personality is existence understood as efficacy, as spiritual fruitfulness. Don Quixote, for example, has more personal existence than Cervantes himself; for if Cervantes exists in history, it is thanks to the life that Don Quixote breathes into the personality of his fame and glory. And Christ? Christ, Unamuno tells us, exists in Christendom. Christ is our longing and our hope; he is our soul that dies and rises again through love and pain. Christ is ourselves."},{"orig":"Y bien, el cristiano exige que Cristo haya tenido una existencia carnal, física, en un cierto lugar del espacio o en una determinada época del tiempo. Y eso es porque si le es dable admirar y aun amar el ideal de Cristo sin ese supuesto carnal, no le es dable decirlo sin contradicción.","trans":"Now, the Christian demands that Christ have had a carnal, physical existence in a certain place in space or a certain moment in time. And that is because, while one may admire and even love the ideal of Christ without that carnal presupposition, one cannot say so without contradiction."},{"orig":"Juntamente con estas contradicciones hay otra oposición trágica, derivada de la posición del cristianismo frente a la vida social. El cristianismo en su pureza es individualismo absoluto, como que es una preparación para la muerte y hemos de morir solos. Por esta razón al cristianismo le son completamente extrañas todas las cuestiones económicas, políticas, jurídicas en general, todos los intereses y pasiones que componen la trama del mundo.","trans":"Along with these contradictions there is another tragic opposition, derived from the position of Christianity with respect to social life. Christianity in its purity is absolute individualism, for it is a preparation for death, and we die alone. For this reason all economic, political, and juridical questions are completely alien to Christianity — indeed, all the interests and passions that make up the fabric of the world."},{"orig":"Pero el cristiano es hombre y debe vivir en sociedad, por lo tanto en la lucha donde se confrontan y se vivifican su cristianismo y la sociedad. Y ni siquiera la moral, el deber, la justicia pertenecen en esencia al cristianismo, puesto que en él la vida no se inspira en el respeto al deber, sino en el miedo de la muerte y en el amor, que no son sentimientos de justicia.","trans":"But the Christian is a human being and must live in society — consequently in the struggle where Christianity and society confront and vivify each other. And not even morality, duty, or justice belong essentially to Christianity, since in it life is inspired not by respect for duty but by the fear of death and by love, which are not feelings of justice."},{"orig":"Ese duelo entre cristianismo y sociedad puede contemplarlo en la perspectiva más vasta que nos ofrece la radical oposición entre cristianismo y civilización. El cristianismo es el más allá, la civilización el aquí y hoy. Y sin embargo, ni el cristianismo puede vivir sin la civilización, ni la civilización sin el cristianismo. El cristianismo y civilización se oponen y se necesitan, como la razón y la voluntad, la carne y el espíritu; como no pueden ni ignorarse ni suprimirse, agonizan.","trans":"That duel between Christianity and society can be viewed in the vaster perspective offered by the radical opposition between Christianity and civilization. Christianity is the beyond; civilization is the here and now. Yet neither can Christianity exist without civilization, nor civilization without Christianity. Christianity and civilization oppose and require each other, as reason and will, as flesh and spirit; since they can neither be ignored nor suppressed, they agonize."},{"orig":"Pero todas estas agonías están como envueltas y penetradas por la agonía del amor y de la fé. Como hemos visto el amor trágico por el mundo quiere salvarlo del anonadamiento para salvarnos con él. Y corremos a Dios. Pero no a la mera idea de Dios, sino al Dios vivo y personal que sufre, muere y resucita. Sabremos si el divino objeto de nuestro amor existe realmente o si, al desesperarnos, nos desesperamos. De manera que la agonía del amor religioso deriva en primer término de la compasión por la tragedia divina y luego de la tortura de no saber si esa tragedia es algo más que la proyección de nuestra angustia en el vacío.","trans":"But all these agonies are as if wrapped and penetrated by the agony of love and faith. As we have seen, the tragic love of the world wishes to save it from annihilation in order to save us with it. And we run to God. But not to the mere idea of God, but to the living, personal God who suffers, dies, and rises again. We shall know whether the divine object of our love exists in reality, or whether, in our desperation, we are despairing of something that does not exist. So that the agony of religious love derives first from compassion for the divine tragedy, and then from the torment of not knowing whether that tragedy is anything more than the projection of our anguish into the void."},{"orig":"El alma es la Sunamita que calienta con su amor la agonía de Dios. Dios es el amado agónico que enciende los ardores del alma y la mantiene en la desesperación que es su vida.","trans":"The soul is the Shunamite woman who warms with her love the agony of God. God is the agonizing beloved who kindles the soul's ardors and keeps it in the desperation that is its life."},{"orig":"En lo ya dicho va insinuado que la agonía del amor es la agonía de la fé. El amor es una voluntad de comunión en el dolor. La fé es la voluntad de creer en el amado y de poner en sus manos su esperanza eterna, la totalidad de su deseo. Por eso agoniza la fé como el amor porque la asedia la duda, porque preñada de incertidumbre vé vacilar la esperanza. Esperanza que vuelve a encontrar su raíz en la compasión y en el amor.","trans":"In what has already been said, it is insinuated that the agony of love is the agony of faith. Love is a will to communion in pain. Faith is the will to believe in the beloved and to place in their hands one's eternal hope, the totality of one's desire. That is why faith agonizes like love — because doubt besieges it, because, heavy with uncertainty, it watches hope waver. Hope that rediscovers its root in compassion and in love."},{"orig":"Aquí muestra Unamuno como la virilidad, apetito masculino de procreación, simple gana y no verdadera voluntad de creer, decisión autónoma, libre albedrío de suscitar la fé, lleva al desgano, a esa falta total de aspiración y de interés que él llama nadismo y que encuentra sus más claras expresiones en la virilidad española. Para la fé, el espíritu no nace de la virilidad, sino de la feminidad. Y sobre todo, de la feminidad promovida al rango excelso de la maternidad virginal. Si en el orden de la carne Adán es padre de Eva, en el orden del espíritu, la Virgen María es madre del Creador.","trans":"Here Unamuno shows how virility — the masculine appetite for procreation, mere want and not true will to believe, autonomous decision, free volition to arouse faith — leads to apathy, to that total lack of aspiration and interest which he calls nadism and which finds its clearest expressions in Spanish virility. For faith, the spirit is born not of virility but of femininity — and above all of femininity raised to the exalted rank of virginal motherhood. If in the order of flesh Adam is the father of Eve, in the order of spirit the Virgin Mary is the mother of the Creator."},{"orig":"Unamuno llega a preguntarse si Dios es femenino. Y su pregunta tiene un profundo sentido, porque si Dios es el origen de la vida universal ¿no es como el seno materno de donde brotan todas las existencias? Y el misticismo, ese anhelo de morir para vivir, ¿qué otro es sino el ansia por reintegrarse en la noche primordial que los griegos simbolizaban en la deidad femenina y en cuya oscuridad veneraban conjuntamente los secretos de la generación y de la muerte?","trans":"Unamuno goes so far as to ask whether God is feminine. And his question has a profound meaning, for if God is the origin of universal life, is he not like the maternal womb from which all existences spring? And mysticism — that longing to die in order to live — what is it but the desire to reintegrate into the primordial night that the Greeks symbolized in the feminine deity, in whose darkness they venerated together the secrets of generation and death?"},{"orig":"Así, mientras luce en la altura la palabra evangélica que promete a los humildes y no a los orgullosos el Reino de los Cielos, el alma agoniza en la lucha inacabable entre la fe que consuela y la razón que destruye, entre el amor que eterniza y la muerte que acecha. Y en esa agonía, dividida y trágica, reside para Unamuno la verdadera unidad del alma humana.","trans":"Thus, while the evangelical word shines on high — promising the Kingdom of Heaven to the humble and not to the proud — the soul agonizes in the unending struggle between the faith that consoles and the reason that destroys, between the love that eternalizes and the death that lurks. And in that agony, divided and tragic, lies for Unamuno the true unity of the human soul."}];

/* ── Build chapters ───────────────────────────────────────────────────── */
const NUMS = new Set(['I','II','III','IV']);
function rowType(s){ return s.match(/^\(\d+\)\./) ? 'fn' : (s.startsWith('Y es la muerte')||s.startsWith('Y en el fondo de todo')) ? 'verse' : 'body'; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const chapters=[];
// intro
let items=[],i=3;
while(i<DATA.length && !NUMS.has(DATA[i].orig)){ items.push({...DATA[i],type:rowType(DATA[i].orig)}); i++; }
chapters.push({label:'Intro',num:null,origTitle:'INTRODUCCIÓN',transTitle:'INTRODUCTION',items});
while(i<DATA.length){
  if(NUMS.has(DATA[i].orig)){
    const num=DATA[i].orig; i++;
    const origTitle=DATA[i].orig,transTitle=DATA[i].trans; i++;
    const its=[];
    while(i<DATA.length && !NUMS.has(DATA[i].orig)){ its.push({...DATA[i],type:rowType(DATA[i].orig)}); i++; }
    chapters.push({label:num,num,origTitle,transTitle,items:its});
  } else { i++; }
}

/* ── Render pages ────────────────────────────────────────────────────── */
const titleEl=document.getElementById('main-title');
const epEl=document.getElementById('epigraph');
const navEl=document.getElementById('chapter-nav');
const textArea=document.getElementById('text-area');
const btnPrev=document.getElementById('btn-prev');
const btnNext=document.getElementById('btn-next');
const pageCounter=document.getElementById('page-counter');

titleEl.textContent=DATA[0].orig;
const ep=DATA[1].orig.split('—');
epEl.innerHTML=esc(ep[0].trim())+(ep[1]?'<span class="attribution">— '+esc(ep[1].trim())+'</span>':'');

const sections=chapters.map((ch,ci)=>{
  const btn=document.createElement('button');
  btn.type='button';
  btn.textContent=ch.num ? ch.num+' · '+abbr(ch.origTitle) : 'Intro';
  btn.dataset.idx=ci;
  btn.addEventListener('click',()=>goTo(ci));
  navEl.appendChild(btn);

  const sec=document.createElement('div');
  sec.className='chapter-section';

  const hdr=document.createElement('div');
  hdr.className='section-header';
  if(ch.num){ const s=document.createElement('span'); s.className='chapter-number'; s.textContent='Chapter '+ch.num; hdr.appendChild(s); }
  hdr.innerHTML+=`<div class="chapter-title-pair"><h2 class="chapter-title">${esc(ch.origTitle)}</h2><h2 class="chapter-title right">${esc(ch.transTitle)}</h2></div>`;
  sec.appendChild(hdr);

  const wrap=document.createElement('div');
  wrap.className='rows-wrap';
  ch.items.forEach((item,ri)=>{
    const row=document.createElement('div');
    row.className='row'+(item.type==='verse'?' is-verse':'')+(item.type==='fn'?' is-footnote':'');
    const p0=document.createElement('p'); p0.className='cell'; p0.dataset.ch=ci; p0.dataset.row=ri; p0.dataset.side=0; p0.textContent=item.orig;
    const p1=document.createElement('p'); p1.className='cell'; p1.dataset.ch=ci; p1.dataset.row=ri; p1.dataset.side=1; p1.textContent=item.trans;
    row.appendChild(p0); row.appendChild(p1);
    wrap.appendChild(row);
  });
  sec.appendChild(wrap);
  textArea.appendChild(sec);
  return {sec,btn};
});

function abbr(t){ const w=t.split(' '); return w.length<=3?t:w.slice(0,3).join(' ')+'…'; }

let current=0;
function goTo(idx){
  sections[current].sec.classList.remove('active');
  sections[current].btn.classList.remove('active');
  current=idx;
  sections[current].sec.classList.add('active');
  sections[current].btn.classList.add('active');
  sections[current].btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  document.querySelector('.chapter-nav').scrollIntoView({behavior:'smooth',block:'start'});
  updateCtrl();
}
function updateCtrl(){
  btnPrev.disabled=current===0;
  btnNext.disabled=current===sections.length-1;
  pageCounter.textContent=(current+1)+' / '+sections.length;
  btnPrev.textContent=current>0?'← '+(chapters[current-1].num||'Intro'):'← Prev';
  btnNext.textContent=current<sections.length-1?(chapters[current+1].num||'Intro')+' →':'Next →';
}
btnPrev.addEventListener('click',()=>{ if(current>0) goTo(current-1); });
btnNext.addEventListener('click',()=>{ if(current<sections.length-1) goTo(current+1); });
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(e.key==='ArrowRight'&&current<sections.length-1) goTo(current+1);
  if(e.key==='ArrowLeft'&&current>0) goTo(current-1);
});
goTo(0);

/* ── Font + theme ────────────────────────────────────────────────────── */
let fontSize=17;
const sizeLabel=document.getElementById('size-label');
function applySize(){ document.documentElement.style.setProperty('--body-size',fontSize+'px'); document.body.style.fontSize=fontSize+'px'; sizeLabel.textContent=fontSize+'px'; }
document.getElementById('font-dec').addEventListener('click',()=>{ if(fontSize>13){fontSize--;applySize();} });
document.getElementById('font-inc').addEventListener('click',()=>{ if(fontSize<24){fontSize++;applySize();} });

let dark=window.matchMedia('(prefers-color-scheme:dark)').matches;
const themeBtn=document.getElementById('theme-toggle');
function applyTheme(){ document.documentElement.setAttribute('data-theme',dark?'dark':'light'); themeBtn.textContent=dark?'Light':'Dark'; }
applyTheme();
themeBtn.addEventListener('click',()=>{ dark=!dark; applyTheme(); });

const ANN_KEY='unamuno-ann-v1';
let annotations=[];
try{ annotations=JSON.parse(localStorage.getItem(ANN_KEY)||'[]'); }catch(e){}
let annId=annotations.reduce((m,a)=>Math.max(m,a.id||0),0)+1;

function saveAnns(){ try{ localStorage.setItem(ANN_KEY,JSON.stringify(annotations)); }catch(e){} }

/* Find a cell by its data attributes */
function findCell(ch,row,side){
  return textArea.querySelector(`.cell[data-ch="${ch}"][data-row="${row}"][data-side="${side}"]`);
}

/* Char offset of range endpoint within a container's text content */
function offsetIn(container, node, off){
  const r=document.createRange();
  r.selectNodeContents(container);
  r.setEnd(node,off);
  return r.toString().length;
}

/* Apply a stored annotation object to the DOM */
function applyAnnToDOM(ann){
  const cell=findCell(ann.ch,ann.row,ann.side);
  if(!cell) return;
  const walker=document.createTreeWalker(cell,NodeFilter.SHOW_TEXT);
  let node,cum=0,hits=[];
  while((node=walker.nextNode())){
    const len=node.textContent.length;
    const ns=cum,ne=cum+len;
    if(ne>ann.start && ns<ann.end){
      hits.push({node,from:Math.max(ann.start-ns,0),to:Math.min(ann.end-ns,len)});
    }
    cum+=len;
    if(cum>=ann.end) break;
  }
  [...hits].reverse().forEach(({node,from,to})=>{
    const mk=document.createElement('mark');
    mk.className='hl hl-'+ann.color+(ann.note?' has-note':'');
    mk.dataset.annId=ann.id;
    if(ann.note) mk.title=ann.note;
    mk.addEventListener('click',e=>{ e.stopPropagation(); openEditOnMark(ann,mk); });
    if(to<node.textContent.length) node.splitText(to);
    const mid=from>0?node.splitText(from):node;
    (from>0?node:mid).parentNode.insertBefore(mk,mid);
    mk.appendChild(mid);
  });
}

/* Restore all annotations */
function restoreAll(){ annotations.forEach(a=>applyAnnToDOM(a)); }
restoreAll();

/* ── Toolbar ─────────────────────────────────────────────────────────── */
const toolbar=document.getElementById('ann-toolbar');
const commentWrap=document.getElementById('ann-comment-wrap');
const commentInput=document.getElementById('ann-comment-input');
const tbDelete=document.getElementById('tb-delete');
let tbRange=null, tbCell=null, tbEditAnn=null;

function positionToolbar(range){
  const rect=range.getBoundingClientRect();
  const x=Math.min(rect.left+window.scrollX, window.innerWidth-230+window.scrollX);
  const y=rect.top+window.scrollY-54;
  toolbar.style.left=Math.max(8,x)+'px';
  toolbar.style.top=Math.max(8,y)+'px';
  toolbar.style.display='flex';
}

function hideToolbar(){
  toolbar.style.display='none';
  commentWrap.style.display='none';
  commentInput.value='';
  tbRange=null; tbCell=null; tbEditAnn=null;
  tbDelete.style.display='none';
}

/* Show toolbar on text selection */
document.addEventListener('mouseup',e=>{
  if(toolbar.contains(e.target)) return;
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed||!sel.toString().trim()){ hideToolbar(); return; }
  const range=sel.getRangeAt(0);
  const anc=range.commonAncestorContainer;
  const cell=(anc.nodeType===1?anc:anc.parentElement)?.closest('.cell');
  if(!cell){ hideToolbar(); return; }
  tbRange=range.cloneRange();
  tbCell=cell;
  tbEditAnn=null;
  tbDelete.style.display='none';
  positionToolbar(range);
});

/* Click outside hides toolbar */
document.addEventListener('mousedown',e=>{
  if(!toolbar.contains(e.target)) hideToolbar();
});

/* Color swatches */
toolbar.querySelectorAll('.hl-swatch').forEach(btn=>{
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    if(tbEditAnn){
      // change color of existing annotation
      document.querySelectorAll(`mark[data-ann-id="${tbEditAnn.id}"]`).forEach(m=>{
        m.className='hl hl-'+btn.dataset.color+(tbEditAnn.note?' has-note':'');
      });
      tbEditAnn.color=btn.dataset.color;
      saveAnns();
      hideToolbar();
    } else {
      commitHighlight(btn.dataset.color);
    }
  });
});

function commitHighlight(color){
  if(!tbRange||!tbCell) return;
  const start=offsetIn(tbCell,tbRange.startContainer,tbRange.startOffset);
  const end=offsetIn(tbCell,tbRange.endContainer,tbRange.endOffset);
  if(start===end) return;
  const note=commentInput.value.trim();
  const ann={
    id:annId++,
    ch:parseInt(tbCell.dataset.ch),
    row:parseInt(tbCell.dataset.row),
    side:parseInt(tbCell.dataset.side),
    start,end,color,note,
    quote:tbRange.toString().slice(0,80)
  };
  annotations.push(ann);
  saveAnns();
  applyAnnToDOM(ann);
  window.getSelection().removeAllRanges();
  hideToolbar();
  refreshNotes();
}

/* Comment button */
document.getElementById('tb-comment').addEventListener('click',e=>{
  e.stopPropagation();
  commentWrap.style.display=commentWrap.style.display==='block'?'none':'block';
  commentInput.focus();
});

document.getElementById('cm-save').addEventListener('click',e=>{
  e.stopPropagation();
  if(tbEditAnn){
    tbEditAnn.note=commentInput.value.trim();
    document.querySelectorAll(`mark[data-ann-id="${tbEditAnn.id}"]`).forEach(m=>{
      m.title=tbEditAnn.note;
      m.classList.toggle('has-note',!!tbEditAnn.note);
    });
    saveAnns();
    hideToolbar();
    refreshNotes();
  } else {
    // pick first swatch color as default if none chosen
    commitHighlight('yellow');
  }
});

document.getElementById('cm-cancel').addEventListener('click',e=>{
  e.stopPropagation();
  commentWrap.style.display='none';
  commentInput.value='';
});

commentInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){ document.getElementById('cm-save').click(); }
  if(e.key==='Escape'){ commentWrap.style.display='none'; commentInput.value=''; }
});

/* Delete button */
tbDelete.addEventListener('click',e=>{
  e.stopPropagation();
  if(!tbEditAnn) return;
  const id=tbEditAnn.id;
  document.querySelectorAll(`mark[data-ann-id="${id}"]`).forEach(mk=>{
    while(mk.firstChild) mk.parentNode.insertBefore(mk.firstChild,mk);
    mk.remove();
  });
  annotations=annotations.filter(a=>a.id!==id);
  saveAnns();
  hideToolbar();
  refreshNotes();
});

/* Open toolbar on click of existing mark */
function openEditOnMark(ann,mk){
  tbEditAnn=ann;
  tbRange=null; tbCell=null;
  tbDelete.style.display='';
  commentInput.value=ann.note||'';
  commentWrap.style.display='block';
  const rect=mk.getBoundingClientRect();
  toolbar.style.left=Math.max(8,rect.left+window.scrollX)+'px';
  toolbar.style.top=Math.max(8,rect.top+window.scrollY-54)+'px';
  toolbar.style.display='flex';
}

/* ── Notes panel ─────────────────────────────────────────────────────── */
const notesPanel=document.getElementById('notes-panel');
const notesList=document.getElementById('notes-list');
const notesToggle=document.getElementById('notes-toggle');
document.getElementById('np-close').addEventListener('click',()=>{ notesPanel.classList.remove('open'); notesToggle.classList.remove('active'); });
notesToggle.addEventListener('click',()=>{
  const open=notesPanel.classList.toggle('open');
  notesToggle.classList.toggle('active',open);
  if(open) refreshNotes();
});

function refreshNotes(){
  const withNotes=annotations.filter(a=>a.note);
  if(!withNotes.length){
    notesList.innerHTML='<p class="np-empty">No notes yet.<br>Select text and click 💬 to add one.</p>';
    return;
  }
  notesList.innerHTML='';
  withNotes.forEach(ann=>{
    const div=document.createElement('div');
    div.className='note-item';
    const dot=ann.color==='underline'?`<span class="ni-underline"></span>`:`<span class="ni-color ni-${ann.color}"></span>`;
    div.innerHTML=`
      <div class="ni-quote">${dot}${esc(ann.quote||'')}</div>
      <div class="ni-note">${esc(ann.note)}</div>
      <div class="ni-actions">
        <button data-id="${ann.id}" class="go-btn">Go to</button>
        <button data-id="${ann.id}" class="del-btn">Delete</button>
      </div>`;
    notesList.appendChild(div);
  });
  notesList.querySelectorAll('.go-btn').forEach(b=>b.addEventListener('click',()=>{
    const a=annotations.find(x=>x.id===parseInt(b.dataset.id));
    if(a){ goTo(a.ch); setTimeout(()=>{ const mk=textArea.querySelector(`mark[data-ann-id="${a.id}"]`); if(mk) mk.scrollIntoView({behavior:'smooth',block:'center'}); },300); }
  }));
  notesList.querySelectorAll('.del-btn').forEach(b=>b.addEventListener('click',()=>{
    const id=parseInt(b.dataset.id);
    document.querySelectorAll(`mark[data-ann-id="${id}"]`).forEach(mk=>{ while(mk.firstChild) mk.parentNode.insertBefore(mk.firstChild,mk); mk.remove(); });
    annotations=annotations.filter(a=>a.id!==id);
    saveAnns(); refreshNotes();
  }));
}
</script>
