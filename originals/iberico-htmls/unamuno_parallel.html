<title>Inquietud Religiosa de Miguel de Unamuno</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Libre+Franklin:wght@400;500&display=swap">
<style>
:root {
  --ground:       #F2F1EF;
  --ink:          #1C1A17;
  --ink-muted:    #7A7668;
  --ink-faint:    #C4C0B8;
  --rule:         #C8C4BD;
  --accent:       #3D6272;
  --accent-hover: #2E4F5E;
  --epigraph-bg:  #ECEAE6;
  --btn-bg:       #E5E3DF;
  --btn-hover:    #D8D5CF;
  --nav-active:   #1C1A17;
  --ff-display: 'IM Fell English','Palatino Linotype',serif;
  --ff-body:    'Crimson Pro','Palatino Linotype',Georgia,serif;
  --ff-ui:      'Libre Franklin',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1119;--ink:#E5E1DA;--ink-muted:#7A7870;--ink-faint:#2A2D36;
  --rule:#232730;--accent:#6B9BAC;--accent-hover:#85B0BF;--epigraph-bg:#141822;
  --btn-bg:#1E2230;--btn-hover:#262C3C;--nav-active:#E5E1DA;
}}
:root[data-theme="dark"]{
  --ground:#0E1119;--ink:#E5E1DA;--ink-muted:#7A7870;--ink-faint:#2A2D36;
  --rule:#232730;--accent:#6B9BAC;--accent-hover:#85B0BF;--epigraph-bg:#141822;
  --btn-bg:#1E2230;--btn-hover:#262C3C;--nav-active:#E5E1DA;
}
:root[data-theme="light"]{
  --ground:#F2F1EF;--ink:#1C1A17;--ink-muted:#7A7668;--ink-faint:#C4C0B8;
  --rule:#C8C4BD;--accent:#3D6272;--accent-hover:#2E4F5E;--epigraph-bg:#ECEAE6;
  --btn-bg:#E5E3DF;--btn-hover:#D8D5CF;--nav-active:#1C1A17;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ground);color:var(--ink);font-family:var(--ff-body);font-size:17px;line-height:1.72}

/* masthead */
.masthead{padding:4rem 2rem 2rem;text-align:center;border-bottom:1px solid var(--ink-faint);max-width:1380px;margin:0 auto}
.title-main{font-family:var(--ff-display);font-size:clamp(1.8rem,5vw,3.1rem);font-weight:400;letter-spacing:.01em;line-height:1.18;text-wrap:balance}
.epigraph{margin:2rem auto 0;max-width:400px;padding:1.1rem 1.5rem;background:var(--epigraph-bg);border-left:2px solid var(--accent);text-align:left;font-family:var(--ff-display);font-size:.93rem;font-style:italic;color:var(--ink-muted);line-height:1.6}
.epigraph .attribution{display:block;margin-top:.45rem;font-style:normal;font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);font-family:var(--ff-ui)}

/* controls */
.controls-bar{display:flex;align-items:center;justify-content:space-between;max-width:1380px;margin:0 auto;padding:.75rem 2rem;border-bottom:1px solid var(--ink-faint);gap:1rem;flex-wrap:wrap}
.col-labels{display:flex;flex:1}
.col-label{font-family:var(--ff-ui);font-size:.68rem;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-muted);width:50%}
.col-label:last-child{text-align:right}
.right-controls{display:flex;align-items:center;gap:.6rem;flex-shrink:0;flex-wrap:wrap}
.font-controls{display:flex;align-items:center;gap:.3rem}
.font-controls button,.theme-toggle,.notes-toggle{font-family:var(--ff-ui);font-size:.68rem;font-weight:500;letter-spacing:.04em;padding:.25rem .55rem;border:1px solid var(--rule);border-radius:3px;background:var(--btn-bg);color:var(--ink-muted);cursor:pointer;transition:background .15s,color .15s;line-height:1}
.font-controls button:hover,.theme-toggle:hover,.notes-toggle:hover{background:var(--btn-hover);color:var(--ink)}
.font-controls button:focus-visible,.theme-toggle:focus-visible,.notes-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.font-size-label{font-family:var(--ff-ui);font-size:.66rem;color:var(--ink-faint);min-width:2.4em;text-align:center}
.notes-toggle.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* chapter nav */
.chapter-nav{max-width:1380px;margin:0 auto;padding:0 2rem;border-bottom:1px solid var(--rule);display:flex;overflow-x:auto;scrollbar-width:none}
.chapter-nav::-webkit-scrollbar{display:none}
.chapter-nav button{font-family:var(--ff-ui);font-size:.68rem;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-muted);background:none;border:none;border-bottom:2px solid transparent;padding:.75rem 1rem .65rem;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;margin-bottom:-1px;flex-shrink:0}
.chapter-nav button:hover{color:var(--ink)}
.chapter-nav button.active{color:var(--nav-active);border-bottom-color:var(--accent)}

/* text area */
.text-area{max-width:1380px;margin:0 auto;padding:0 2rem 2rem}
.chapter-section{display:none}
.chapter-section.active{display:block}
.section-header{padding:3rem 0 1.5rem}
.chapter-number{font-family:var(--ff-ui);font-size:.66rem;font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);display:block;margin-bottom:.45rem}
.chapter-title-pair{display:flex;gap:4%}
.chapter-title{font-family:var(--ff-display);font-size:clamp(1.1rem,2.5vw,1.45rem);font-weight:400;letter-spacing:.015em;line-height:1.25;width:48%;text-wrap:balance}
.chapter-title.right{color:var(--ink-muted);font-style:italic}

/* rows */
.rows-wrap{position:relative}
.rows-wrap::before{content:'';position:absolute;top:0;bottom:0;left:calc(48% + 2%);width:1px;background:var(--rule);pointer-events:none}
.row{display:flex;gap:4%;padding:.65rem 0;border-top:1px solid var(--ink-faint)}
.row:first-child{border-top:none}
.cell{width:48%;font-family:var(--ff-body);font-size:var(--body-size,17px);line-height:1.72;color:var(--ink);cursor:text}
.row.is-verse{padding:1.1rem 0}
.row.is-verse .cell{font-style:italic;color:var(--ink-muted);padding-left:1.5rem;font-size:calc(var(--body-size,17px)*.95)}
.row.is-footnote .cell{font-size:calc(var(--body-size,17px)*.84);color:var(--ink-muted)}

/* page controls */
.page-controls{display:flex;align-items:center;justify-content:space-between;max-width:1380px;margin:0 auto;padding:1.5rem 2rem 4rem;border-top:1px solid var(--ink-faint)}
.page-btn{font-family:var(--ff-ui);font-size:.72rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:.45rem 1rem;border:1px solid var(--rule);border-radius:3px;background:var(--btn-bg);color:var(--ink-muted);cursor:pointer;transition:background .15s,color .15s}
.page-btn:hover:not(:disabled){background:var(--btn-hover);color:var(--ink)}
.page-btn:disabled{opacity:.3;cursor:default}
.page-counter{font-family:var(--ff-ui);font-size:.68rem;color:var(--ink-faint);letter-spacing:.06em}

/* ── ANNOTATIONS ─────────────────────────────────────────────────────── */
mark.hl{background:none;color:inherit;border-radius:2px;cursor:pointer;position:relative}
mark.hl-yellow{background:rgba(250,219,60,.35)}
mark.hl-blue{background:rgba(80,170,220,.28)}
mark.hl-rose{background:rgba(230,90,110,.25)}
mark.hl-underline{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--accent)}
mark.hl.has-note::after{content:'†';font-size:.6em;vertical-align:super;color:var(--accent);margin-left:1px;font-family:var(--ff-display);font-style:italic}
mark.hl:hover{filter:brightness(.92)}

/* toolbar */
#ann-toolbar{display:none;position:absolute;z-index:200;flex-direction:column;gap:4px;background:var(--ground);border:1px solid var(--rule);border-radius:5px;padding:6px 8px;box-shadow:0 4px 16px rgba(0,0,0,.18);min-width:200px}
#ann-toolbar .tb-row{display:flex;align-items:center;gap:4px}
#ann-toolbar button{font-family:var(--ff-ui);font-size:.65rem;padding:.25rem .5rem;border:1px solid var(--rule);border-radius:3px;background:var(--btn-bg);color:var(--ink);cursor:pointer;line-height:1;white-space:nowrap}
#ann-toolbar button:hover{background:var(--btn-hover)}
#ann-toolbar .tb-word{background:none;border:none;color:var(--ink-muted);font-family:var(--ff-ui);font-size:.65rem;letter-spacing:.07em;text-transform:uppercase;padding:.2rem .3rem;cursor:pointer}
#ann-toolbar .tb-word:hover{color:var(--ink);background:none}
#ann-toolbar .tb-word.tb-remove{color:var(--ink-muted)}
#ann-toolbar .tb-word.tb-remove:hover{color:#b04040}
#ann-toolbar .hl-swatch{width:16px;height:16px;border-radius:50%;border:1.5px solid transparent;cursor:pointer;flex-shrink:0;transition:transform .12s,box-shadow .12s;position:relative;-webkit-appearance:none;appearance:none}
#ann-toolbar .hl-swatch:hover{transform:scale(1.22);box-shadow:0 0 0 2px var(--accent)}
#ann-toolbar .sw-yellow{background:rgba(248,213,48,.85);border-color:rgba(190,155,0,.4)}
#ann-toolbar .sw-blue{background:rgba(66,158,218,.8);border-color:rgba(30,110,180,.35)}
#ann-toolbar .sw-rose{background:rgba(222,78,98,.75);border-color:rgba(180,40,60,.35)}
#ann-toolbar .sw-underline{background:var(--ground);border:1px solid var(--rule)!important;border-radius:3px!important}
#ann-toolbar .sw-underline::after{content:'';position:absolute;bottom:3px;left:2px;right:2px;height:1.5px;background:var(--accent)}
#ann-toolbar .sep{width:1px;height:18px;background:var(--rule);margin:0 2px}
#ann-comment-wrap{display:none;margin-top:2px}
#ann-comment-wrap input{width:100%;font-family:var(--ff-ui);font-size:.72rem;padding:.3rem .5rem;border:1px solid var(--rule);border-radius:3px;background:var(--ground);color:var(--ink);outline:none}
#ann-comment-wrap input:focus{border-color:var(--accent)}
#ann-comment-wrap .cm-actions{display:flex;gap:4px;margin-top:4px}
#ann-comment-wrap .cm-actions button{flex:1;font-size:.65rem}

/* notes panel */
#notes-panel{display:none;position:fixed;top:0;right:0;width:min(320px,90vw);height:100vh;background:var(--ground);border-left:1px solid var(--rule);z-index:300;overflow-y:auto;padding:1.5rem 1.25rem 2rem;box-shadow:-4px 0 24px rgba(0,0,0,.12)}
#notes-panel.open{display:block}
#notes-panel h2{font-family:var(--ff-display);font-size:1.05rem;font-weight:400;margin-bottom:1rem;border-bottom:1px solid var(--rule);padding-bottom:.6rem}
#notes-panel .np-close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--ink-muted)}
#notes-panel .np-close:hover{color:var(--ink)}
.note-item{margin-bottom:1rem;padding:.6rem .75rem;border:1px solid var(--rule);border-radius:4px;font-family:var(--ff-body);font-size:.88rem;line-height:1.5}
.note-item .ni-quote{color:var(--ink-muted);font-style:italic;margin-bottom:.3rem;font-size:.82rem;border-left:2px solid var(--rule);padding-left:.5rem}
.note-item .ni-note{color:var(--ink)}
.note-item .ni-actions{margin-top:.5rem;display:flex;gap:.75rem;align-items:center}
.note-item .ni-actions button{font-family:var(--ff-ui);font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;padding:0;border:none;background:none;color:var(--ink-muted);cursor:pointer}
.note-item .ni-actions button:hover{color:var(--ink)}
.note-item .ni-actions .del-btn:hover{color:#b04040}
.np-empty{font-family:var(--ff-ui);font-size:.78rem;color:var(--ink-muted);text-align:center;margin-top:2rem}

/* swatch for color in note list */
.ni-color{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.ni-color.ni-yellow{background:rgba(248,213,48,.9)}.ni-color.ni-blue{background:rgba(66,158,218,.9)}.ni-color.ni-rose{background:rgba(222,78,98,.8)}.ni-underline{border-bottom:2px solid var(--accent);width:10px;height:0;display:inline-block;vertical-align:middle;margin-right:4px}

/* responsive */
@media(max-width:660px){
  .masthead,.controls-bar,.chapter-nav,.text-area,.page-controls{padding-left:1.25rem;padding-right:1.25rem}
  .rows-wrap::before{display:none}
  .row{flex-direction:column;gap:.5rem}
  .cell,.chapter-title{width:100%}
  .cell.right-cell{color:var(--ink-muted)}
  .chapter-title-pair{flex-direction:column;gap:.35rem}
  .chapter-title.right{font-size:.95em}
  .col-labels{display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}

<script>
/* ── DATA ────────────────────────────────────────────────────────────── */
const DATA = [{"orig":"INQUIETUD RELIGIOSA DE MIGUEL DE UNAMUNO","trans":"THE RELIGIOUS UNREST OF MIGUEL DE UNAMUNO"},{"orig":"Dios es el Señor de los vivos y de los muertos. — San Agustín","trans":"God is the Lord of the living and of the dead. — Saint Augustine"},{"orig":"INTRODUCCIÓN","trans":"INTRODUCTION"},{"orig":"Hay dos grandes estilos de pensamiento y de actividad espiritual, el de quienes aspiran al reposo y el de quienes se abrazan a la vida con su pasión e inquietud. Estas actitudes suscitan dos metafísicas: la primera la metafísica del ser, la segunda la metafísica del devenir. La metafísica del ser presupone algo invariable como fundamento de la realidad. La metafísica del devenir concibe la existencia como cambio continuo.","trans":"There are two great styles of thought and spiritual activity: that of those who aspire to repose, and that of those who embrace life with its passion and unrest. These attitudes give rise to two metaphysics: the first, the metaphysics of being; the second, the metaphysics of becoming. The metaphysics of being presupposes something invariable as the foundation of reality. The metaphysics of becoming conceives existence as continuous change."},{"orig":"Además, la metafísica del ser, obedeciendo al voto de reposo que la engendra, hace de aquél no sólo el fundamento existencial de las cosas, sino la forma de éstas, es decir la ley inconmovible a que deben someterse las apariencias variables y fugaces. Con esto el alma puede encontrar en la concepción del ser y en la del orden racional que de ella dimana el reposo que busca.","trans":"Moreover, the metaphysics of being, obeying the desire for repose that engenders it, makes of that invariable not only the existential foundation of things but their very form — that is, the immovable law to which variable and fleeting appearances must submit. By this means the soul can find in the conception of being, and in the rational order that flows from it, the repose it seeks."},{"orig":"La metafísica del devenir no promete la absoluta quietud, es decir el acabamiento en el seno del ser absoluto; al contrario, creando la realidad con la materia misma del tiempo, ofrece al espíritu una perspectiva de progreso sin fin. Es en cierto sentido una filosofía de lo imborrable pues lo que una vez acontece no ha de repetirse nunca. Es también en cierto sentido una filosofía de ilimitada esperanza, puesto que en el reino de lo imprevisible que ella consagra, pueden realizarse hasta los más locos designios. Pero es sobretodo una filosofía lúcida. Sabe que sin ilusión no puede existir la vida, pero también denuncia todas las ilusiones como formas en que nuestra inquietud se congelaría si las llegara a lograr.","trans":"The metaphysics of becoming does not promise absolute quiet — that is, absorption into the bosom of absolute being; on the contrary, creating reality from the very stuff of time, it offers the spirit a perspective of endless progress. It is in a certain sense a philosophy of the indelible, for what once occurs need never repeat itself. It is also in a certain sense a philosophy of unlimited hope, since in the realm of the unforeseeable that it consecrates, even the most extravagant designs may be realized. But above all it is a lucid philosophy. It knows that without illusion life cannot exist, yet it also denounces all illusions as forms in which our unrest would congeal if it ever managed to attain them."},{"orig":"La fórmula de Proclo: \"el ser es, sale de sí y vuelve a sí\" satisface el anhelo metafísico de quienes aspiran al reposo. La fórmula de Heráclito: \"la guerra es madre y señora de todas las cosas\" expresa el sentimiento de la vida de quienes confieren a la inquietud y la lucha la dignidad más alta.","trans":"Proclus's formula — \"being is, proceeds from itself and returns to itself\" — satisfies the metaphysical longing of those who aspire to repose. Heraclitus's formula — \"war is the mother and mistress of all things\" — expresses the feeling of life held by those who confer upon unrest and struggle the highest dignity."},{"orig":"Y aquí surge una pregunta inevitable: ¿para qué el movimiento, para qué? No para volver como lo querían los neoplatónicos, porque reintegrarse en el ser es abolirse como individuo. No para volver, sino para crear, para engendrar una realidad nueva, para alcanzar una posesión más plena y más rica del ser universal.","trans":"And here an inevitable question arises: movement toward what, and for what? Not to return, as the Neoplatonists wished, for to reintegrate into being is to annul oneself as an individual. Not to return, but to create, to engender a new reality, to attain a fuller and richer possession of universal being."},{"orig":"I","trans":"I"},{"orig":"RAZÓN Y VIDA","trans":"REASON AND LIFE"},{"orig":"Lo que desde luego se observa al estudiar la filosofía religiosa de Unamuno es la declaración expresa de que las exigencias del sentimiento son opuestas a las exigencias racionales. El corazón quiere vida y la razón le ofrece la muerte. Mas para percibir así la claridad como la profunda significación humana de la actitud que Unamuno adopta ante esta oposición, conviene referirla a la distinción que Nietzsche establece entre filosofías del conocimiento y filosofías del instinto vital, consagradas las primeras a estudiar las condiciones y posibilidades de la facultad de conocer, dirigidas las segundas a justificar por un lado y a estimular por otro las exigencias vitales del hombre; las primeras críticas y especulativas, las segundas dogmáticas y dinámicas.","trans":"What one immediately observes in studying the religious philosophy of Unamuno is the explicit declaration that the demands of feeling are opposed to the demands of reason. The heart wants life; reason offers it death. But to perceive clearly the profound human significance of the attitude Unamuno adopts toward this opposition, one must relate it to the distinction Nietzsche draws between philosophies of knowledge and philosophies of vital instinct: the former consecrated to studying the conditions and possibilities of the faculty of knowing; the latter directed toward justifying on one side and stimulating on the other the vital demands of the human being. The former are critical and speculative; the latter dogmatic and dynamic."},{"orig":"Según Unamuno lo fundamental, el resorte que en definitiva mueve y determina a los hombres en su acción es el sentimiento entendido como el conjunto de fuerzas oscuras e inexplicables que se agitan desde las profundidades del alma.","trans":"According to Unamuno, the fundamental spring that ultimately moves and determines human beings in their action is feeling, understood as the ensemble of dark and inexplicable forces that stir from the depths of the soul."},{"orig":"Y así vivir es el anhelo sustancial, insaciable y trágico, cuyo imperativo se traduce primeramente en todas las formas biológicas del hambre y luego en las diversas expresiones de los instintos sociales que desde el odio hasta el amor tienden a afirmar, conservar y expandir eternamente la vida.","trans":"And so to live is the substantial, insatiable and tragic longing whose imperative is translated first into all the biological forms of hunger, and then into the diverse expressions of the social instincts that, from hatred to love, tend to affirm, preserve, and eternally expand life."},{"orig":"Esta avidez esencial es según Unamuno el origen del sentimiento sensible en el animal y en el hombre aislado y del conocimiento racional en el hombre socializado. Del conocimiento sensible, porque ella discierne en la realidad circundante los elementos que es necesario asimilar o rechazar para subsistir; del conocimiento racional, porque el pensamiento no es más que un lenguaje interior, brotado del lenguaje exterior y dirigido primordialmante a satisfacer el instinto de perpetuación en la especie. Por manera que el mundo material que nace del hambre y el mundo ideal que nace del amor reconocen uno y el mismo origen profundo.","trans":"This essential avidity is, according to Unamuno, the origin of sensible knowledge in the animal and in the isolated human being, and of rational knowledge in the socialized human being. Of sensible knowledge, because it discerns in the surrounding reality the elements that must be assimilated or rejected in order to survive; of rational knowledge, because thought is nothing more than an interior language, sprung from exterior language and directed primarily toward satisfying the instinct of perpetuation in the species. Thus the material world that is born of hunger and the ideal world that is born of love share a single deep origin."},{"orig":"Pero sucede que la razón, lejos de orientarse a satisfacer las necesidades vitales que le dieron origen, se orienta hacia la nada y nos anuncia la muerte, el acabamiento, el no ser. La filosofía del instinto saca del deseo la existencia del objeto. Unamuno deduce la inmortalidad del hecho de desearla. Suya es pues una filosofía del instinto.","trans":"But it happens that reason, far from orienting itself toward satisfying the vital needs that gave rise to it, orients itself toward nothingness and announces to us death, ending, non-being. The philosophy of instinct derives the existence of its object from desire. Unamuno deduces immortality from the fact of desiring it. His is therefore a philosophy of instinct."},{"orig":"Pero lo que le individualiza es que en él el objeto de la creencia, o mejor del deseo, no llega a convertirse esa como alucinación que en otros filósofos del instinto elimina o por lo menos disimula la división interior del alma. En él por el contrario, envuelto en incertidumbre, acediado por la duda, tanto más problemático cuanto más deseado, se ofrece no como una posesión sino como una conquista aventurada, engendrando así en el alma que lo anhela y que no lo alcanza una lucha sin fin, una agonía interminable. Por manera que esta filosofía, que tiene su base en la pugna obstinada y terrible entre el instinto y la razón, lejos de darnos la unidad ficticia en que el conflicto se suprime, nos descubre en el conflicto mismo la verdadera unidad del alma, dividida y trágica.","trans":"But what individualizes him is that in him the object of belief — or rather of desire — does not succeed in becoming that hallucination which in other philosophers of instinct eliminates, or at least dissimulates, the soul's interior division. In him, on the contrary, shrouded in uncertainty, besieged by doubt, all the more problematic the more it is desired, the object presents itself not as a possession but as a hazardous conquest, thereby engendering in the soul that longs for it yet cannot attain it an endless struggle, an interminable agony. So that this philosophy, which has its foundation in the obstinate and terrible conflict between instinct and reason, far from giving us the fictitious unity in which conflict is suppressed, reveals to us in the very conflict the true unity of the soul — divided and tragic."},{"orig":"Entre tales esfuerzos el catolicismo ocupa un lugar de preeminencia, pues es en concepto de Unamuno la religión cristiana que con mayor fuerza afirma y cuyo más hondo significado confiere a la voluntad de eternidad. La creencia católica en efecto recoge la aspiración fundamental de la vida cristiana y la consagra con la doctrina de la resurrección y la consiguiente inmortalidad no sólo del alma sino también del cuerpo.","trans":"Among such efforts, Catholicism occupies a place of preeminence, for in Unamuno's view it is the Christian religion that most forcefully affirms and whose deepest meaning most fully endows the will to eternity. The Catholic faith effectively gathers the fundamental aspiration of Christian life and consecrates it with the doctrine of the resurrection and the consequent immortality not only of the soul but of the body."},{"orig":"Muestra Unamuno como esa creencia se desarrolla a través de la historia. Las dos grandes corrientes espirituales helénica y judaica de las cuales brotó el cristianismo habían llegado ya a la concepción de la perduración de la vida y en una u otra forma a la de la perpetuidad del alma individual. Pero ni en el helenismo ni en el judaísmo el apetito y la idea de inmortalidad alcanzan la intensidad y el valor que en la conciencia cristiana. Cada uno por su lado, judíos y griegos, llegaron al verdadero descubrimiento de la muerte, que es la revelación de la muerte del hombre que había venido a morir y murió. (1)","trans":"Unamuno shows how this belief develops through history. The two great spiritual currents — Hellenic and Judaic — from which Christianity sprang had already arrived at the conception of the endurance of life, and in one form or another at that of the perpetuity of the individual soul. But neither in Hellenism nor in Judaism do the appetite and idea of immortality attain the intensity and value they hold in Christian consciousness. Each in its own way, Jews and Greeks arrived at the true discovery of death — the revelation of the death of the man who had come to die and died. (1)"},{"orig":"Tal descubrimiento —el de la muerte como preparación para la inmortalidad— que los procesos religiosos judaico y helénico habían preparado, es lo específico de lo cristiano. Pero donde se reveló con todo su incomparable valor religioso fué en el alma de Pablo de Tarso, aquel \"judío fariseo helenizado\" que no conoció personalmente a Jesús y que por esto acaso le descubrió como Cristo, el apóstol de gentiles que haciendo de la resurrección el dogma central de su teología, dice en su Epístola a los Corintios (I. XV. 12, 15): \"Porque si no hay resurrección de los muertos, tampoco Cristo resucitó. Si Cristo no resucitó vana es nuestra predicación y vana es nuestra fé\".","trans":"That discovery — of death as preparation for immortality — which the Jewish and Hellenic religious processes had prepared, is what is specific to Christianity. But where it revealed itself with all its incomparable religious value was in the soul of Paul of Tarsus, that \"Hellenized Jewish Pharisee\" who did not know Jesus personally and who for that very reason perhaps discovered him as Christ, the apostle of the Gentiles who, making the resurrection the central dogma of his theology, writes in his First Epistle to the Corinthians (XV. 12, 15): \"For if there is no resurrection of the dead, then Christ has not been raised either. If Christ has not been raised, our preaching is useless and so is your faith.\""},{"orig":"Después de siglos de incesante actividad teológica la cristología pauliana recibió una nueva y solemne confirmación en Nicea por obra de Atanasio, hombre glorioso y fuerte que por encima de toda preocupación meramente racional afirma, contra el peligro arriano, la creencia en Cristo como Dios verdadero de Dios verdadero.","trans":"After centuries of unceasing theological activity, Pauline Christology received a new and solemn confirmation at Nicaea through the work of Athanasius, a glorious and strong man who, above all merely rational preoccupation, affirms against the Arian peril the belief in Christ as true God from true God."},{"orig":"A cada aspecto de Cristo corresponde un sacramento que es el eje de la devoción popular católica: la Eucaristía, sacramento civilizador cuya eficacia reside en un admirable realismo trascendente. Comemos y bebemos a Dios y adquirimos carne y sangre de inmortalidad. Y en la Eucaristía se condensa todo lo esencial del catolicismo puro, porque lo específico religioso católico es la inmortalización y no la justificación al modo protestante. Este es más bien ético. Y es en Kant, en quien el protestantismo, mal que pese a los ortodoxos de él, sacó sus últimas consecuencias: la religión depende de la moral y no ésta de aquella como en el catolicismo. (2)","trans":"To each aspect of Christ there corresponds a sacrament that is the axis of popular Catholic devotion: the Eucharist, a civilizing sacrament whose efficacy resides in an admirable transcendent realism. We eat and drink God and acquire flesh and blood of immortality. And in the Eucharist is condensed all that is essential in pure Catholicism, because the specifically religious element in Catholicism is immortalization and not justification in the Protestant manner. The Protestant manner is rather ethical. It is in Kant that Protestantism, much as his orthodox followers may resent it, drew its ultimate consequences: religion depends on morality, and not morality on religion, as in Catholicism. (2)"},{"orig":"La religión católica sirve pues con mayor eficacia que las sectas protestantes el anhelo de inmortalidad. Mas como quiera que en su empeño encuéntrase con la razón hostil, tiene que pactar con ella y de esta situación nace el ímprobo trabajo de formular en términos de razón lo que por naturaleza es irreductible a las categorías racionales. Y así nace la escolástica, formidable construcción de la mente dedicada al propósito imposible de acordar las contradicciones y de suprimir el conflicto entre instinto y razón.","trans":"The Catholic religion thus serves the longing for immortality with greater efficacy than the Protestant sects. But since in its endeavor it encounters reason as a hostile force, it must come to terms with it, and from this situation arises the enormous labor of formulating in rational terms what is by nature irreducible to rational categories. And thus scholasticism is born — a formidable construction of the mind dedicated to the impossible aim of reconciling contradictions and suppressing the conflict between instinct and reason."},{"orig":"Esta tentativa aborta: la escolástica acaba siendo una filosofía esotérica, inaccesible al vulgo. Por eso el catolicismo más bien disimula que soluciona el conflicto espiritual de cuyo fondo brota el sentimiento trágico de la vida. Conflicto pronto a definirse como un duelo a muerte entre la voluntad que se obstina en vivir y la razón que le opone sus negaciones perentorias.","trans":"This attempt aborts: scholasticism ends as an esoteric philosophy, inaccessible to the common person. That is why Catholicism conceals rather than resolves the spiritual conflict from whose depths the tragic sense of life springs. A conflict ready to define itself as a duel to the death between the will that persists in living and the reason that opposes it with its peremptory negations."},{"orig":"Como el amante en la exaltación de un amor contrariado, así Unamuno al estudiar el duelo entre razón e instinto se empeña en abolir las posibilidades de su existencia como antagonismo resuelto.","trans":"Like the lover in the exaltation of a thwarted love, so Unamuno, in studying the duel between reason and instinct, strives to abolish the possibilities of their existence as a resolved antagonism."},{"orig":"Es concluyente su crítica de las tentativas encaminadas a probar racionalmente la inmortalidad del alma. Se dirige desde luego a refutar la doctrina propiamente irracional de la sustancialidad. Muestra cuán insostenible es desde el punto de vista de la razón el concepto de una sustancia simple que sea la base o principio de los fenómenos conscientes.","trans":"His critique of the attempts to rationally prove the immortality of the soul is conclusive. He proceeds at once to refute the properly irrational doctrine of substantiality. He shows how untenable is, from the standpoint of reason, the concept of a simple substance that would be the foundation or principle of conscious phenomena."},{"orig":"La inmortalidad no ha podido ser probada racionalmente, pues los resultados de las investigaciones psíquicas son muy mediocres; tampoco la salva el panteísmo, porque si volvemos a Dios como antes en El estábamos, es decir sin conciencia personal, es que hemos dejado de existir. Ni la salva por fin el agnosticismo, porque lo incognoscible es tan sólo un concepto de la razón sobre el cual no se puede fundar sentimiento ni esperanza. Por cualquier lado que la cosa se mire siempre resulta que la razón se pone en frente de ese nuestro anhelo y siempre le contradice. Y es que en rigor la razón es enemiga de la vida. (3)","trans":"Immortality cannot be proved rationally, for the results of psychical investigations are very meager; nor does pantheism rescue it, for if we return to God as we were in him before — that is, without personal consciousness — we have simply ceased to exist. Nor does agnosticism rescue it in the end, because the unknowable is merely a concept of reason upon which no feeling or hope can be founded. In whatever direction one looks, reason always places itself against our longing and always contradicts it. For in the last analysis, reason is the enemy of life. (3)"},{"orig":"La razón, insiste Unamuno, es enemiga de la vida porque, tendiendo a la fijeza, desconoce la incontenible movilidad de nuestra conciencia profunda; porque tendiendo a lo abstracto desconoce la individualidad concreta; porque erigiendo el imperio absoluto de un universo mecanismo, aniquila entre sus mallas inflexibles toda autonomía interior, toda posibilidad de sustraer a su disolución nuestra conciencia personal.","trans":"Reason, Unamuno insists, is the enemy of life because, tending toward fixity, it ignores the uncontainable mobility of our deep consciousness; because, tending toward the abstract, it ignores concrete individuality; because, erecting the absolute empire of a universal mechanism, it annihilates between its inflexible meshes all interior autonomy, all possibility of rescuing our personal consciousness from dissolution."},{"orig":"Para decir lo mismo en otros términos, la razón engendra el sacrificio de una unidad impersonal. De todos modos la razón obra en contra de la vida que es multiplicidad y cambio imprevisible y de la inmortalidad que requiere la perduración de un núcleo personal e irreductible.","trans":"To say the same in other terms: reason engenders the sacrifice to an impersonal unity. In any case, reason works against life, which is multiplicity and unforeseeable change, and against immortality, which requires the endurance of a personal and irreducible core."},{"orig":"Frente a todas las negaciones de la lógica que rige las relaciones aparenciales de las cosas, se alza la afirmación de la cardiaca, que rige los toques sustanciales de ellas. Aunque tu cabeza diga que se te ha de extinguir la conciencia un día, tu corazón, despertado y desgarrado por la congoja infinita, te enseñará que hay un mundo en que la razón no es guía. La verdad es lo que hace vivir, no lo que hace pensar. (4) Y sin embargo, la razón suele movilizar todo el aparato de sus deducciones en servicio de las tesis del instinto vital, el impulso de la cardiaca. Es que entonces, abandonando su función especulativa, se entrega a la labor abogadil de defender proposiciones adoptadas de antemano y definidas por una autoridad extraña a la pura evidencia racional.","trans":"Against all the negations of the logic that governs the apparent relations among things, there rises the affirmation of the heart, which governs their substantial contacts. Although your head says that your consciousness will one day be extinguished, your heart, awakened and torn by infinite anguish, will teach you that there is a world in which reason is not the guide. Truth is what makes one live, not what makes one think. (4) And yet reason habitually mobilizes the whole apparatus of its deductions in the service of the theses of vital instinct, of the heart's impulse. For at that point, abandoning its speculative function, it gives itself over to the advocacy task of defending propositions adopted in advance and defined by an authority foreign to pure rational evidence."},{"orig":"Y aquí, antes de seguir a Unamuno por las rutas inesperadas a donde su inquietud va a conducirnos, quiero observar que si no se asimila íntegramente la vida del espíritu no puede ser considerada la razón como una fuerza antivital. La vida del hombre es justamente la lucha más o menos franca o más o menos encubierta entre el instinto y la razón. En el propio concepto de Unamuno es la razón quien provoca la duda, quien conduce a los hombres a la agonía religiosa que es la expresión más alta de la vida. Sin la razón la existencia humana dejaría de ser lo que es: una agonía. La razón es pues un extremo de la vida, un término dialéctico negativo si se quiere, pero de todos modos un resorte encargado de perturbar la confianza, de denunciar todas las ilusiones del instinto y de promover aquella energía creadora que reemplaza las ficciones desaparecidas por otras destinadas a su vez a perecer sacrificadas por la crítica implacable y fecunda.","trans":"And here, before following Unamuno along the unexpected paths to which his unrest is about to lead us, I wish to observe that if one does not fully assimilate the life of the spirit, reason cannot be regarded as an antivital force. The life of the human being is precisely the struggle, more or less frank or more or less concealed, between instinct and reason. In Unamuno's own conception, it is reason that provokes doubt, that leads people to the religious agony that is the highest expression of life. Without reason, human existence would cease to be what it is: an agony. Reason is therefore an extreme of life, a dialectical and negative term if you will, but in any case a spring charged with disturbing confidence, with denouncing all the illusions of instinct, and with promoting that creative energy which replaces vanished fictions with new ones destined in their turn to perish, sacrificed by implacable and fruitful criticism."},{"orig":"Por lo demás yo no hago estas reflexiones con propósito de rectificación. Yo sé que ellas concuerdan con lo fundamental de la posición de Unamuno, pues la duda, la inagotable productividad del espíritu:","trans":"For the rest, I make these observations without any intention to correct. I know that they accord with what is fundamental in Unamuno's own position, since doubt is the inexhaustible productivity of the spirit:"},{"orig":"Y es la muerte el sustento de la vida. Y de la fé la duda.","trans":"And death is the sustenance of life. And doubt the sustenance of faith."},{"orig":"Las hago sobre todo porque quiero indicar que es preciso distinguir dos sentidos de la palabra vida en la filosofía religiosa de Unamuno. En un sentido la vida es el instinto o mejor el hambre de inmortalidad. En otro sentido es ese hambre y además la razón que lo combate, la indefinible realidad que van creando juntas, no por virtud de su propia oposición. En este último sentido las expresiones vida y tragedia se equivalen. La tragedia es vida y la vida es tragedia. No pretendamos pues suprimir la tragedia o querremos que la vida se abisme en la quieta unidad de la muerte.","trans":"I make them above all because I wish to indicate that it is necessary to distinguish two senses of the word life in the religious philosophy of Unamuno. In one sense, life is the instinct, or rather the hunger for immortality. In the other sense it is that hunger together with the reason that combats it — the indefinable reality that the two create together, not by virtue of their opposition alone. In this latter sense, the expressions life and tragedy are equivalent. Tragedy is life and life is tragedy. Let us not then pretend to suppress tragedy, or we shall want life to sink into the quiet unity of death."},{"orig":"II","trans":"II"},{"orig":"FILOSOFÍA DE LA DESESPERACIÓN","trans":"THE PHILOSOPHY OF DESPERATION"},{"orig":"El racionalista está en su derecho cuando niega la posibilidad de probar la inmortalidad del alma lógica o científicamente, pero se conduce absurdamente cuando se enfurece contra quienes creen en ella y se equivoca o habla hipócritamente cuando afirma que no es necesario aceptar la inmortalidad personal para darle un sentido a la vida.","trans":"The rationalist is within his rights when he denies the possibility of proving the immortality of the soul logically or scientifically; but he behaves absurdly when he grows furious against those who believe in it, and he is mistaken, or speaks hypocritically, when he affirms that it is not necessary to accept personal immortality in order to give life a meaning."},{"orig":"Sin inmortalidad la vida no tiene sentido, digan lo que quieran los filósofos. Por eso cuando la razón —ese principio desconsolador y disolvente— al par que denuncia la inmortalidad como una quimera, presume de brindar al alma un motivo de contentamiento interior y de esperanza, es más desconsoladora todavía. Y por eso también vale más que la razón ruede por su pendiente natural hasta hundirse en el más profundo escepticismo, en cuyo fondo ha de encontrarse con el indeclinable anhelo del corazón y de tal encuentro saldrá una base, no tanto formulable de las potencias en lucha, sino el sentimiento que de esa lucha se desprende, en la \"guerra e incertidumbre\" donde se exalta nuestra conciencia de existir y que nos preserva así de las desoladas abnegaciones del racionalismo puro como de la yerta inmovilidad de una fé sin sombra de duda.","trans":"Without immortality, life has no meaning, whatever philosophers may say. That is why when reason — that desolating and dissolving principle — while denouncing immortality as a chimera, presumes to offer the soul a motive for inner contentment and hope, it is all the more desolating. And that is why it is better that reason should roll down its natural slope until it sinks into the deepest skepticism, in whose depths it must encounter the unconditional longing of the heart, and from that encounter a basis will emerge — not so much formulable as the warring powers, but rather the feeling that emerges from that struggle, in the \"war and uncertainty\" where our consciousness of existing is exalted, and which preserves us both from the desolate abnegations of pure rationalism and from the rigid immobility of a faith without a shadow of doubt."},{"orig":"Ahora bien, ¿Cómo es esa vida que de la desesperación nace y a la desesperación conduce pero que tiene la virtud maravillosa de restituirnos incesantemente lo que nos quita y de mantenernos así desesperados, en eterna esperanza?","trans":"Now then: what is that life that is born of desperation and leads back to desperation, yet possesses the marvelous virtue of restoring to us unceasingly what it takes away, and of keeping us thus in desperate but eternal hope?"},{"orig":"Unamuno la describe en páginas admirables de hondo lirismo. Nos muestra cómo la desesperación primero palpita ya en el fondo del amor físico, engendrando luego el amor espiritual, virginal; cómo la compasión hacia nosotros mismos que nace también de la desesperación nos incorpora en el drama humano y con él nos une a Dios.","trans":"Unamuno describes it in admirable pages of profound lyricism. He shows us how desperation first pulses already in the depths of physical love, then engenders spiritual, virginal love; how compassion toward ourselves, which also springs from desperation, incorporates us into the human drama and through it unites us to God."},{"orig":"Hay sin duda escribe nuestro autor algo de trágicamente atractivo en el fondo del amor, tal como en su forma más primitiva, animal, se nos presenta en el invencible instinto que empuja a un macho y a una hembra a confundir sus entrañas en un apretón de furia. Lo mismo que les une de los cuerpos les separa en cierto modo las almas: al abrazarse se odian tanto como se aman, y sobre todo luchan, luchan por un tercero, aun sin vida. El amor es una lucha, y especies animales hay en que al unirse el macho a la hembra la maltrata, y otras en que la hembra devora al macho luego que éste la hubo fecundado. (5) El amor es inmediatamente ansia de generación e inmediatamente anhelo de perpetuación; y en la tercera perpetúan los amantes o mejor dicho el amor, una perpetuación de muerte. De la carne, del dolor y de la muerte que combaten sin tregua a la vida pero para combatirla la promueven, la exaltan, la eternizan.","trans":"There is no doubt, writes our author, something tragically attractive at the root of love, as it presents itself to us in its most primitive, animal form — in the invincible instinct that drives a male and a female to mingle their entrails in a furious embrace. The very thing that unites their bodies separates their souls in a certain way: in embracing they hate each other as much as they love, and above all they struggle, they struggle for a third, not yet alive. Love is a struggle, and there are animal species in which the male mistreats the female at the moment of union, and others in which the female devours the male once he has fertilized her. (5) Love is immediately a longing for generation and immediately a longing for perpetuation; and through offspring, the lovers — or rather love itself — perpetuate a perpetuation of death. From flesh, from pain, and from death that fight without truce against life yet by fighting it promote it, exalt it, eternalize it."},{"orig":"\"Gracias al amor sentimos todo lo que de corpóreo tiene el espíritu\", es decir todo lo que hay de corpóreo, de mortal, en la composición de la vida.","trans":"\"Thanks to love we feel all that is corporeal in the spirit\" — that is to say, all that is corporeal, all that is mortal, in the composition of life."},{"orig":"Los hijos traen consigo una nueva posibilidad de la vida a superar ese amor que en sus padres despiertan y que no sólo los une y defiende a los hijos sino que santifica y depura el afecto recíproco de los padres. Sentimiento predominante es la compasión por el ser indefenso, frágil, a quien martiriza el dolor o arrebata despiadadamente la muerte. Es por obra del dolor que inaugura el reino del espíritu, el germen virginal destinado a engrandecerse a expensas del apetito de la carne. Y de esta suerte la carne es madre y nodriza del espíritu.","trans":"Children bring with them a new possibility of the life that must surpass the love they awaken in their parents — a love that not only unites and defends the children but sanctifies and purifies the mutual affection of the parents. The predominant feeling is compassion for the defenseless, fragile being, tortured by pain or ruthlessly snatched away by death. It is through the pain that inaugurates the kingdom of spirit — the virginal germ destined to grow at the expense of the flesh's appetite — that flesh becomes the mother and nurse of the spirit."},{"orig":"El dolor es así en definitiva la raíz de la vida espiritual. El dolor engendra la compasión. Y la compasión es amor y el amor es espíritu. Y como quiera que no es posible amar sin conocer el dolor, es al cabo de nuestro propio sufrimiento, de nuestra propia angustia y de la compasión hacia nosotros mismos que nos inspiran, desde donde nos levantamos para ascender por grados a las más elevadas y vastas regiones del amor.","trans":"Pain is thus ultimately the root of spiritual life. Pain engenders compassion. And compassion is love, and love is spirit. And since it is impossible to love without knowing pain, it is from our own suffering, our own anguish, and the compassion for ourselves that they inspire, that we rise to ascend by degrees toward the most elevated and vast regions of love."},{"orig":"Amamos a nuestros semejantes porque adivinamos en ellos nuestro propio dolor, y en ellos nos incorporamos a la humanidad entera en el sentimiento de nuestra propia existencia personal.","trans":"We love our fellow human beings because we intuit in them our own pain, and through them we incorporate all of humanity into the feeling of our own personal existence."},{"orig":"Pero hay más: el hambre de vida y el anhelo irreprimible de no sólo inmortalizar la propia conciencia sino de extenderla, de multiplicarla, de insinuarla en todos los misterios y en todas las posibilidades de lo creado, suscitan, junto con la angustia ante la amenaza de la muerte, la desesperación de no poder serlo todo sin dejar de ser nosotros mismos. Y sucede que, llevados por el irresistible instinto de personalización (6), transferimos a las cosas inanimadas nuestra congoja íntima y como nos parece que al igual que nosotros tienen semillas de vida y van a morir, las compadecemos y las amamos; y así del amor trágico por nosotros mismos brota un amor trágico por el cosmos.","trans":"But there is more: the hunger for life and the irrepressible longing not merely to immortalize one's own consciousness but to extend it, to multiply it, to insinuate it into all the mysteries and all the possibilities of creation, awaken — together with anguish before the threat of death — the desperation of being unable to be everything without ceasing to be ourselves. And it happens that, driven by the irresistible instinct of personalization (6), we transfer our intimate anguish to inanimate things, and as they seem to us, like ourselves, to bear the seeds of life and be destined for death, we pity them and love them; and so from the tragic love of ourselves there springs a tragic love of the cosmos."},{"orig":"(6).—Esta facultad de personalización a que Unamuno llama así y que él considera en cierto modo como dependiente de la compasión y del amor, es en nuestro concepto una facultad primaria y aún más: la ineludible condición psicológica de la compasión y del amor. No personalizamos porque compadecemos sino al contrario: compadecemos porque personalizamos.","trans":"(6).—This faculty of personalization, which Unamuno so calls and regards in a certain way as dependent upon compassion and love, is in our view a primary faculty and something more: the inescapable psychological condition of compassion and love. We do not personalize because we feel compassion; on the contrary: we feel compassion because we personalize."},{"orig":"Llegamos así a Dios, alma en quien asume proporciones cósmicas el drama del hombre. \"Dios es pues, escribe Unamuno, la personificación del todo, es la conciencia universal e infinita del universo, conciencia presa de la materia y luchando por libertarse de ella. Personificamos el universo para salvarlo de la nada. Y el único misterio verdaderamente misterioso es el misterio del dolor.\"","trans":"We arrive thus at God, the soul in whom the drama of the human being assumes cosmic proportions. \"God then,\" writes Unamuno, \"is the personification of the all; he is the infinite and universal consciousness of the universe, consciousness imprisoned in matter and struggling to free itself from it. We personalize the universe to save it from nothingness. And the only truly mysterious mystery is the mystery of pain.\""},{"orig":"Hemos llegado a Dios pero no hemos eliminado el dolor que persiste como un elemento irreductible de la vida, una fatalidad ineluctable en toda posibilidad de ser. Y como quiera que Dios es la vida de la vida, el misterio de Dios es el misterio del dolor. Es el enigma que inquietaba al gran Jacobo Bohme, el misterio que a veces nos lleva a Dios y a veces nos aparta de El, porque es necesario que Dios sufra y es necesario también que Dios se encuentre más allá de todo dolor para que en nosotros se encienda y se apague para volver a encenderse el sentimiento religioso del alma.","trans":"We have reached God but we have not eliminated pain, which persists as an irreducible element of life, an ineluctable fatality in every possibility of being. And since God is the life of life, the mystery of God is the mystery of pain. It is the enigma that troubled the great Jacob Boehme, the mystery that sometimes leads us to God and sometimes turns us away from him, because it is necessary that God suffer and it is also necessary that God be found beyond all pain, so that within us the religious sense of the soul may kindle and go out only to kindle again."},{"orig":"En el yo hay un dualismo de instinto y razón; ese dualismo se transporta al universo como si el instinto se sublimara en Dios y la razón se hipostasiara en la materia. Mas lo que en la mayoría de los casos suele ser el resultado de un movimiento inconsciente, de una fusión más bien estética entre el yo y el cosmos, es en Unamuno el producto de una desesperación religiosa, de un desafío consciente a la razón antivital en nombre de la imaginación consoladora. Por lo cual, manteniéndose el dualismo entre razón y voluntad, se mantiene también la desesperación y su inseparable y terrible consuelo. Fruto y símbolo de desesperación, el Dios de Unamuno se nos ofrece a veces como el miraje de un oasis en el desierto. El viajero sabe que el oasis no existe pero tiene que creer en él, porque de no hacerlo, ya no le quedaría fuerza para andar sobre las arenas inclementes.","trans":"In the self there is a dualism of instinct and reason; that dualism is transported to the universe, as if instinct were sublimated into God and reason were hypostatized into matter. But what in most cases is the result of an unconscious movement, of a fusion more aesthetic than conscious between the self and the cosmos, is in Unamuno the product of a religious desperation, of a conscious challenge to antivital reason in the name of consoling imagination. Therefore, as the dualism between reason and will is maintained, so too is desperation maintained, along with its inseparable and terrible consolation. Fruit and symbol of desperation, Unamuno's God presents itself to us at times as the mirage of an oasis in the desert. The traveler knows the oasis does not exist yet must believe in it, because without that belief no strength would remain to walk upon the merciless sands."},{"orig":"En el proceso que de la desesperación lleva a Dios hay empero un motivo más sutil, y es a saber: que no podemos concebir la realidad sino bajo la categoría de la conciencia.","trans":"In the process that leads from desperation to God there is, however, a subtler motive, namely: that we cannot conceive of reality except under the category of consciousness."},{"orig":"Al Dios vivo no puede buscarlo, ni descubrirlo, ni probarlo la razón. Es la fé quien lo encuentra, lo posee y en cierto modo lo crea. Pero ¿qué es la fé? No es desde luego una convicción teórica, la posesión de una verdad filosófica o científica. Es la confianza en aquello que nos reconforta, la adhesión al mensaje que alivia y exalta nuestro hambre de inmortalidad. Por eso contiene en lo hondo de sí misma una imperiosa voluntad de creer, una ansia por suscitar la esperanza en lo que sustente nuestro anhelo. Y como quiera que esta voluntad se afirma contra toda evidencia racional, hay siempre en el fondo de la fé una profunda incertidumbre y el temor angustioso de que al fin y al cabo sea la razón quien tenga la última palabra. Pero la fé implica siempre un supuesto fundamental: la existencia de un ser personal, viviente, que sufre en nosotros y fuera de nosotros, cuya palabra de amor escuchamos y a quien nos asimilamos como a una fuente inagotable de vida.","trans":"The living God cannot be sought, nor discovered, nor proved by reason. It is faith that finds him, possesses him, and in a certain sense creates him. But what is faith? It is certainly not a theoretical conviction, the possession of a philosophical or scientific truth. It is trust in what comforts us, adherence to the message that alleviates and exalts our hunger for immortality. That is why it contains in its depths an imperious will to believe, a longing to arouse hope in what may sustain our desire. And since this will asserts itself against all rational evidence, there is always at the depths of faith a profound uncertainty and the anguished fear that in the end reason may have the last word. But faith always implies a fundamental presupposition: the existence of a personal, living being who suffers in us and outside us, whose word of love we hear, and to whom we assimilate ourselves as to an inexhaustible source of life."},{"orig":"De este modo, insinuándonos la fé en la profundísima relación que une el querer al existir y la necesidad al ser, nos hace vislumbrar esta equivalencia misteriosa y profunda: creer, crear.","trans":"In this way, faith insinuating itself into the deepest relation that unites willing to existing and necessity to being, makes us glimpse this mysterious and profound equivalence: to believe, to create."},{"orig":"Es una necesidad de esperanza quien crea la fé; es la fé quien a su turno sirve de sostén a la esperanza. Creemos porque esperamos y esperamos porque creemos. Círculo que recorre la desesperación, ritmo fecundo en que sentimos la más honda palpitación de la existencia. Porque es la vida que no quiere morir y crea a Dios para sacar en seguida de ese Dios hecho de carne y de dolor humanos un alimento inagotable, una garantía sobrehumana de inmortalidad. Y he aquí como en ese proceso que va de la esperanza a la fé y de la fé a la esperanza, tiene la vida si quiere eternizarse, que salir de si misma para volver a recogerse en una interminable y trágica oscilación.","trans":"It is a need of hope that creates faith; it is faith that in its turn sustains hope. We believe because we hope, and we hope because we believe. A circle traversed by desperation, a fertile rhythm in which we feel the deepest pulse of existence. For it is life that does not want to die and creates God so as to draw from that God — made of flesh and human pain — inexhaustible nourishment, a superhuman guarantee of immortality. And here is how, in that process that runs from hope to faith and from faith to hope, life, if it wishes to eternalize itself, must step outside itself only to gather itself back in an interminable and tragic oscillation."},{"orig":"Y en el fondo de todo está el dolor. El dolor que es del árbol de la vida la savia vigorosa.","trans":"And at the bottom of everything lies pain. Pain that is of the tree of life the vigorous sap."},{"orig":"Nuestra realidad interior se define como una lucha interminable contra el dolor —que al par que nos aplasta nos personaliza— y contra la materia que ahoga nuestro anhelo de expansión infinita con la cierta uniformidad de su mecanismo. El amor considerado así nos hace descubrir en la perspectiva universal ese cósmico drama: Dios es la conciencia, el anhelo de existencia infinita que lucha por libertarse de la inercia pasiva e impersonal de la materia. Mezclando entonces nuestra angustia a la angustia divina, luchamos por el triunfo universal de la conciencia, trabajamos por el establecimiento del Reino del Espíritu, del Reino de Dios. Y el arma es la caridad.","trans":"Our interior reality defines itself as an interminable struggle against pain — which, even as it crushes us, personalizes us — and against the matter that stifles our longing for infinite expansion with the dull uniformity of its mechanism. Love, considered thus, makes us discover in the universal perspective that cosmic drama: God is consciousness, the longing for infinite existence that struggles to free itself from the passive and impersonal inertia of matter. By mingling our anguish with the divine anguish, we struggle for the universal triumph of consciousness; we work for the establishment of the Kingdom of the Spirit, the Kingdom of God. And the weapon is charity."},{"orig":"El mal es la abdicación de la vida ante la muerte o más concretamente: es la pereza y la avaricia espiritual que, cerrándonos a la compasión, nos remiten a la vil pasividad de la materia. Solo la caridad puede resistirlo.","trans":"Evil is the abdication of life before death, or more concretely: it is the spiritual sloth and avarice that, closing us to compassion, relegate us to the base passivity of matter. Only charity can resist it."},{"orig":"No olvidemos que toda esta vida espiritual deriva del conflicto entre el hambre de inmortalidad y la razón que lo niega. Dios aparece en ella como el recurso supremo ante una posibilidad desesperada de salvación y de esperanza. La religión es así la unión a Dios en esta vida y la esperanza de poseerlo en la otra. De poseerlo sin absorbernos en El. O mejor de irle poseyendo en una expansión sin término.","trans":"Let us not forget that all this spiritual life derives from the conflict between the hunger for immortality and the reason that denies it. God appears in it as the supreme resource before a desperate possibility of salvation and hope. Religion is thus the union with God in this life and the hope of possessing him in the next — possessing him without being absorbed into him, or rather progressively possessing him in an expansion without end."},{"orig":"Unamuno siente la grandeza del acto en que la conciencia individual se niega y se deja absorber en la conciencia divina, pero agrega: \"Y el alma, mi alma, menos anhela otra cosa, no absorción, no quietud, no luz, no apagamiento, sino eterno acercarse sin llegar nunca, inacabable anhelo, eterna esperanza que eternamente se renueva sin acabarse del todo nunca.\" Y en esto descalifica todo anhelo de quietud perfecta y armonía absoluta y final. \"No mateis el tiempo\" es su lema, porque no quiere la existencia inmóvil de la idea sino la existencia anhelante y esperanzada en el seno de lo vivo, del Dios Hombre. No mateis pues absolutamente este dolor porque al desaparecer se llevaría también la esperanza de la vida. Déjemosle existir y prefiramos a una muerte quieta, angustia y sin esperanza, un purgatorio sin fin, amoroso y viviente.","trans":"Unamuno feels the greatness of the act in which individual consciousness denies itself and allows itself to be absorbed into the divine consciousness; but he adds: \"And the soul, my soul, desires nothing less than this: not absorption, not quietude, not light, not extinction, but eternal approach without ever arriving, unending longing, eternal hope that eternally renews itself without ever being entirely extinguished.\" And in this he disqualifies all longing for perfect quietude and absolute final harmony. \"Do not kill time\" is his motto, for he does not want the immobile existence of the idea but the yearning and hopeful existence in the bosom of the living, of the God-Man. Therefore do not wholly kill this pain, because in disappearing it would carry away with it hope and life. Let it exist, and let us prefer to a quiet death, anguish and hope — an endless purgatory, loving and alive."},{"orig":"Hemos visto como grado por grado la oposición entre instinto y razón se exacerba hasta llegar a ese punto extremo en que el propio instinto nos impulsa a suprimirlo, puesto que debemos luchar por el triunfo universal de la conciencia.","trans":"We have seen how, degree by degree, the opposition between instinct and reason intensifies until it reaches that extreme point where instinct itself drives us to suppress it, since we must struggle for the universal triumph of consciousness."},{"orig":"Aquí aparece una nueva forma de desesperación que quizás Unamuno no insiste acaso lo bastante y que procede no ya del conflicto entre vida y razón, o entre vida y materia, tomadas como términos absolutos, sino precisamente del sentimiento de su inseparabilidad. La materia o la razón es indispensable al juego de la vida, por lo tanto debemos amarla y odiarla al propio tiempo, querer y no querer el triunfo universal del espíritu; mantenerla porque de lo contrario abandonaríamos la partida, pero no quererlo porque si llegáramos a abolir la materia desapareceríamos con ella.","trans":"Here appears a new form of desperation upon which Unamuno perhaps does not sufficiently insist, and which proceeds not from the conflict between life and reason, or between life and matter, taken as absolute terms, but rather from the feeling of their inseparability. Matter, or reason, is indispensable to the game of life; therefore we must love and hate it at the same time, desire and not desire the universal triumph of the spirit — maintain it, because otherwise we would abandon the game, yet not desire its full victory, because if we were to abolish matter we would disappear with it."},{"orig":"Si suprimiéramos la materia, nos quedaría solamente a Unamuno el máximo sacrificio religioso: ahogarnos en la conciencia divina. Pero es que ya no tendríamos conciencia divina tampoco, porque, abolida la materia, todo se disiparía en la vacua unidad de la nada.","trans":"If we were to suppress matter, all that would remain would be for Unamuno the supreme religious sacrifice: to drown ourselves in the divine consciousness. But we would then have no divine consciousness either, because once matter is abolished everything would dissolve into the empty unity of nothingness."},{"orig":"III","trans":"III"},{"orig":"LA CUESTIÓN PRÁCTICA Y EL QUIJOTISMO","trans":"THE PRACTICAL QUESTION AND QUIXOTISM"},{"orig":"La religión pertenece a la actividad práctica del espíritu según Unamuno. Ella no nos da un conocimiento sino que ofrece a nuestro anhelo de inmortalidad una incierta esperanza. Y como quiera que de esa incierta esperanza depende nuestra vida, es al fin de cuentas la religión quien a la vez disciplina y promueve toda nuestra actividad. Y así no es la moral el fundamento de la religión sino al contrario, es la religión el fundamento de la moral.","trans":"Religion belongs to the practical activity of the spirit, according to Unamuno. It does not give us knowledge, but offers to our longing for immortality an uncertain hope. And since our life depends on that uncertain hope, it is in the end religion that simultaneously disciplines and promotes all our activity. Thus morality is not the foundation of religion; on the contrary, religion is the foundation of morality."},{"orig":"En verdad de todo lo que llevamos dicho puede deducirse cual será la filosofía práctica de Unamuno. No que ella derive como la consecuencia lógica de una premisa, sino porque va envuelta en el sentimiento trágico de la vida que Unamuno traduce. Ella emana de la desesperación como un imperativo a la vez absoluto y heroico. Vivir como si la inmortalidad fuera cierta.","trans":"From all that we have said, one can already deduce what the practical philosophy of Unamuno will be — not because it derives as a logical consequence from a premise, but because it is wrapped in the tragic sense of life that Unamuno expresses. It emanates from desperation as an imperative that is at once absolute and heroic: to live as if immortality were certain."},{"orig":"Si queremos la inmortalidad tenemos que esforzarnos por ser insustituibles en nuestro oficio o misión. Así crearemos una como necesidad cósmica que nos mantenga en la vida, pues seremos un elemento irreemplazable, una fuerza ineludible. Pero sobre todo impregnaremos el trabajo de religiosidad y lo santificamos. El propio anhelo de inmortalidad determina nuestra conducta para con nuestros semejantes, dándonos en primer término un amor compasivo por ellos y luego impulsándonos a grabar en sus almas nuestra huella. Porque la conservación egoísta y cerrada en la mezquina individualidad no basta a una alma verdaderamente religiosa y apasionada. Esta quiere acrecerse, difundirse, ofrecerse a los demás como alimento y a su vez nutrirse de ellos.","trans":"If we desire immortality, we must strive to be irreplaceable in our office or mission. Thus we shall create something like a cosmic necessity that keeps us in life, since we shall be an indispensable element, an inescapable force. But above all we shall saturate our work with religiosity and thereby sanctify it. The very longing for immortality determines our conduct toward our fellow human beings, first by giving us compassionate love for them, then by driving us to imprint our mark upon their souls. For the selfish, inward-turning self-preservation of narrow individuality does not suffice a truly religious and passionate soul. Such a soul wishes to grow, to spread itself, to offer itself to others as nourishment and in turn to nourish itself from them."},{"orig":"Un amor así no es contemplativo; por el contrario es dominante, proselitista. Lejos de mantenerse en la estéril actitud espectacular, el amor religioso lucha con una cruzada incesante por llevar a las almas el camino de la inmortalidad y de la salud. Mas el empeño por penetrar en las otras almas y por extender hasta el infinito nuestra propia vida enlaza con la compasión por aquellos que sufren.","trans":"A love of this kind is not contemplative; on the contrary it is dominant, proselytizing. Far from remaining in the sterile, spectatorial attitude, religious love fights an incessant crusade to bring souls toward the path of immortality and health. But the effort to penetrate other souls and to extend one's own life to infinity is joined to compassion for those who suffer."},{"orig":"Cristo el inocente, como conocía mejor que nadie la intensidad de la culpa, era en un cierto sentido el más culpable. En El llegó a conciencia, la divinidad de la humanidad y con ella su culpabilidad. (11)","trans":"Christ the innocent, knowing better than anyone the intensity of guilt, was in a certain sense the most guilty. In him the divinity of humanity — and with it its culpability — came to consciousness. (11)"},{"orig":"\"Sed perfectos como vuestro Padre\" nos dice Jesucristo. Es decir, llegad hasta El, confundíos con El por obra del amor y de la fé. De manera que el cristianismo lejos de ser como se ha sostenido, una moral de esclavos, promueve por el contrario a todos los hombres a la dignidad de amos y de dioses.","trans":"\"Be perfect, as your Father is perfect,\" Christ tells us. That is: reach up to him, become one with him through love and faith. So that Christianity, far from being, as has been claimed, a morality of slaves, on the contrary elevates all human beings to the dignity of masters and gods."},{"orig":"Dos propósitos declara Unamuno le han guiado al escribir los ensayos centrales de su obra religiosa: realizar una filosofía del sentimiento trágico de la vida y probar que esa es una filosofía española o más quijotesca, puesto que don Quijote es la eterna y suprema expresión del alma española.","trans":"Two purposes, Unamuno declares, have guided him in writing the central essays of his religious work: to realize a philosophy of the tragic sense of life, and to prove that this is a Spanish or rather Quixotic philosophy, since Don Quixote is the eternal and supreme expression of the Spanish soul."},{"orig":"Se ha acusado a España, observa, de no tener filosofía, de carecer de metafísica. Eso es exacto, pero España ha vivido su filosofía. Filosofía trágica y tanto religiosa que contra la razón busca lo imposible, y que viviendo en un terrible dualismo entre la realidad y el anhelo, hace que al fin y al cabo la realidad capitule ante la fuerza generosa del apasionado. No es un simple azar el que, al lado de un italiano, Croce, que descubre el valor normativo universal de lo económico, un español descubra que el religioso en general y especialmente el catolicismo español es en el fondo una economía de lo eterno. Economía de lo eterno, es decir, empeño por conquistar desde la tierra el derecho a la eternidad, ansía por asegurar la vida inmortal del alma contra todos los obstáculos de la razón o de la ciencia.","trans":"Spain has been accused, he observes, of having no philosophy, of lacking metaphysics. That is true, yet Spain has lived its philosophy. A philosophy tragic and so religious that, against reason, it seeks the impossible; and, living in a terrible dualism between reality and longing, it causes reality to capitulate in the end before the generous force of passion. It is no mere chance that, while an Italian, Croce, discovers the universal normative value of the economic, a Spaniard should discover that the religious in general — and especially Spanish Catholicism — is at bottom an economy of the eternal. Economy of the eternal: that is, the endeavor to conquer from this earth the right to eternity, the desire to secure the soul's immortal life against all the obstacles posed by reason or science."},{"orig":"Y bien, ese anhelo de eternidad que contra los obstáculos opuestos por la razón y por la ciencia erige una desesperada esperanza, es para Unamuno, el quijotismo. Quijote en efecto, impulsado por su sed de gloria imperecedera, de eterna fama, combate, en nombre de un ideal irrealizable, contra el mundo mezquino de la miseria humana.","trans":"And then, that longing for eternity which, against the obstacles raised by reason and science, erects a desperate hope — that is, for Unamuno, Quixotism. Don Quixote, driven by his thirst for imperishable glory, for eternal fame, battles in the name of an unrealizable ideal against the petty world of human misery."},{"orig":"Don Quijote es la encarnación más fecunda del anhelo de eternidad. Su anhelo de fama imperecedera no es sino el anhelo de no morir; las aventuras de su existencia caballeresca sólo fueron las peripecias de su ambición de vida eterna. Don Quijote es el ejemplo más admirable de cómo el ansia de inmortalidad puede engendrar las más altas virtudes y promover el camino, la energía creadora y heroica. Don Quijote ilustra aquella ley misteriosa en cuya virtud, desde el impulso más humano de su naturaleza, el deseo de gloria personal, elévase el hombre a las más excelsas posibilidades de la vida divina.","trans":"Don Quixote is the most fertile incarnation of the longing for eternity. His longing for imperishable fame is nothing but the longing not to die; the adventures of his chivalric existence were merely the vicissitudes of his ambition for eternal life. Don Quixote is the most admirable example of how the desire for immortality can engender the highest virtues and promote creative and heroic energy. Don Quixote illustrates that mysterious law by virtue of which, from the most human impulse of his nature — the desire for personal glory — the human being rises to the most sublime possibilities of divine life."},{"orig":"\"Amó Don Quijote a la gloria encarnada en Dulcinea\" (12) más exactamente quizá la gloria que le seguía no era sino la sublimación de su amor por Dulcinea, la expresión espiritual de un sentimiento escondido, recóndito. De todos modos, amor a la gloria en Dulcinea o amor a Dulcinea en la gloria, en Don Quijote es el amor a la inmortalidad, a la eternidad.","trans":"\"Don Quixote loved glory incarnated in Dulcinea\" (12) — or more precisely, perhaps, the glory he pursued was nothing but the sublimation of his love for Dulcinea, the spiritual expression of a hidden, deeply private feeling. In any case, whether love of glory in Dulcinea or love of Dulcinea in glory, in Don Quixote it is the love of immortality, of eternity."},{"orig":"\"Ansia de inmortalidad nos lleva a amar a la mujer y así fue como Don Quijote juntó en Dulcinea la mujer y a la gloria, y ya que no pudiera perpetuarse por ella en hijos de carne, buscó eternizarla en hazañas de espíritu.\" (13)","trans":"\"The longing for immortality leads us to love woman, and it was thus that Don Quixote joined in Dulcinea the woman and glory; and since he could not perpetuate himself through her in children of flesh, he sought to eternalize her in deeds of spirit.\" (13)"},{"orig":"El quijotismo español es el catolicismo (14) irracional, sediento de vida y de inmortalidad. Don Quijote y Unamuno representan su espíritu más puro: el alma dividida que lucha con el propio temor de que su anhelo sea absurdo y quimérico, que sabe del absurdo, mas por encima de su saber destructivo, arden inextinguibles su pasión y su esperanza.","trans":"Spanish Quixotism is irrational Catholicism (14), thirsting for life and immortality. Don Quixote and Unamuno, who represents his purest spirit, are the divided soul that struggles with the very fear that its longing may be absurd and chimerical — that knows of the absurd, yet above its destructive knowledge, its passion and hope burn inextinguishably."},{"orig":"La misión de Don Quijote es clamar en el desierto. Y también el desierto \"oye aunque no oigan los mortales, y un día se convertirá en selva sonora, y esa voz solitaria que va pasando como semilla, dará un hosanna gigantesco que con sus cien mil lenguas cantará un hosanna eterno al Señor de la vida y de la muerte.\" (15)","trans":"Don Quixote's mission is to cry out in the wilderness. And the wilderness too \"hears, though the passersby do not, and one day will be converted into a sonorous forest, and that solitary voice that passes like a seed shall give forth a gigantic hosanna that with its hundred thousand tongues shall sing an eternal hosanna to the Lord of life and death.\" (15)"},{"orig":"Clamar en el desierto, porque el desierto tiene oídos. He ahí una frase en que se condensa toda la concepción del alma española. \"Clamar en el desierto\" es el realismo desolado y solitario; \"porque el desierto oye\", es la porfía mística que desafía el absurdo y proyecta su obstinada esperanza. Cuando Keyserling (16) dice que Unamuno es el contemporáneo que mejor encarna el sentimiento español de la vida, define con esa palabra la tragedia.","trans":"To cry out in the wilderness, because the wilderness has ears. There is a phrase that condenses the entire conception of the Spanish soul. \"To cry out in the wilderness\" is the desolate and solitary realism; \"because the wilderness hears\" is the mystical persistence that defies the absurd and projects its obstinate hope. When Keyserling (16) says that Unamuno is the contemporary who best embodies the Spanish feeling of life, he defines with that word the tragedy."},{"orig":"IV","trans":"IV"},{"orig":"EL CRISTIANISMO Y SU AGONÍA","trans":"CHRISTIANITY AND ITS AGONY"},{"orig":"Unamuno, como Pascal, no concibe a Dios sino a través de Jesucristo. Y es que, como dice Pascal, Jesucristo es el verdadero Dios de los hombres. Cristo es el Dios sufriente y viviente que muere para resucitarnos. Pero sobre todo, Cristo es el que agoniza en la cristiandad, porque la cristiandad no es el Cristo.","trans":"Unamuno, like Pascal, does not conceive of God except through Jesus Christ. For, as Pascal says, Jesus Christ is the true God of human beings. Christ is the suffering and living God who dies to resurrect us. But above all, Christ is the one who agonizes in Christendom, because Christendom is not Christ."},{"orig":"Mas, la agonía no es como pudiera suponerse la extinción de la vida; es por el contrario la lucha de la vida contra la muerte o mejor, la vida misma como conflicto, división interior. Y así la vida cristiana es la agonía del cristianismo, el combate que libran en el propio seno de la conciencia y del amor cristiano, entre sí, los elementos antagónicos —igualmente irreductibles y necesarios— que ellos contienen.","trans":"But agony is not, as one might suppose, the extinction of life; it is on the contrary life's struggle against death — or rather, life itself as conflict, as interior division. And so Christian life is the agony of Christianity, the combat that, within the very heart of Christian consciousness and Christian love, the antagonistic elements — equally irreducible and necessary — wage with one another."},{"orig":"La esperanza tendrá que defenderse contra las intolerables posibilidades de muerte que ella encierra. Vivir contra la muerte y, en cierto modo, vivir en eterna guerra, con lo cual se origina la trágica agonía del cristianismo, en que se combaten y al propio tiempo se afirman las más hondas aspiraciones vitales del hombre.","trans":"Hope will have to defend itself against the intolerable possibilities of death that it contains. To live against death and, in a certain sense, to live in eternal war — from this arises the tragic agony of Christianity, in which the deepest vital aspirations of the human being simultaneously combat and affirm each other."},{"orig":"El carácter agónico del Cristo y del sentimiento de la vida que El instituye, está ya de modo inseparable expresado en sus p
